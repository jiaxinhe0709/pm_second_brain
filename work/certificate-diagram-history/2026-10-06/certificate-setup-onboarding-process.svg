ity</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Direct or accountant item</text><rect x="610" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="725.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-01</text><text x="725.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Classify need</text><text x="725.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Policy, route and profile</text><polygon points="1330.0,350 1450,395.0 1330.0,440 1210,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2"/><text x="1330.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1330.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Certificate needed?</text><text x="1330.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Required, not required or unknown</text><rect x="910" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1025.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-02</text><text x="1025.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Verify authority</text><text x="1025.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Principal, delegate and scope</text><rect x="1510" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1625.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-03</text><text x="1625.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Establish custody</text><text x="1625.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Protected version or reference</text><rect x="1810" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1925.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-04</text><text x="1925.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Validate material</text><text x="1925.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Owner, purpose, chain, status</text><rect x="2110" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2225.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-05</text><text x="2225.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Decide readiness</text><text x="2225.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Scoped result and recheck</text><ellipse cx="2555.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2555.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2555.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Show next action</text><text x="2555.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Ready, limited or action needed</text><polygon points="1234,178 1426,178 1450,221.0 1426,264 1234,264 1210,221.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1330.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">HOLD</text><text x="1330.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Policy decision</text><text x="1330.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Unknown requirement; owner assigned</text><polygon points="934,178 11