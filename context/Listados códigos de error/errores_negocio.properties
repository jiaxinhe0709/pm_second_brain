RULE_BR-AE-03_MENSAJE=Una factura que contiene una minoración a nivel de documento (BG-20)(%s) donde el código de categoría de IVA de la minoración a nivel de documento (BT-95)(%s) es "Inversión del Sujeto Pasivo" debe contener el Identificador a efectos del IVA del Vendedor (BT-31)(%s), el Identificador fiscal del Vendedor (BT-32)(%s) y/o el identificador a efectos del IVA del representante fiscal del Vendedor (BT-63)(%s) y el Identificador a efectos del IVA del Comprador (BT-48)(%s) y/o el identificador del registro legal del Comprador (BT-47)(%s).
