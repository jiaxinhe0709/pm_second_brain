" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check permission for the event</b><br /><span style="font-size:12px">Invoice, actor and country rule</span><br /><span style="font-size:11px;color:#555">LCS-02 / 04</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="990" y="380" width="230" height="100" rx="8" /><foreignObject x="996" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Identify required report destinations</b><br /><span style="font-size:12px">Earlier invoice route and reporting deadline</span><br /><span style="font-size:11px;color:#555">LCS-07</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1330" y="380" width="230" height="100" rx="8" /><foreignObject x="1336" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Create each required report</b><br /><span style="font-size:12px">One event; separate work per destination</span><br /><span style="font-size:11px;color:#555">LCS-08</span></div></div></foreignObject><polygon fill="#d7d7d7" stroke="#333333" stroke-width="2" points="2130.0,380.0 2250.0,435.0 2130.0,490.0 2010.0,435.0" /><foreignObject x="2026" y="396" width="208" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Is the reporting result known?</b><br /><span style="font-size:12px">Check each destination separately</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2350" y="380" width="230" height="100" rx="8" /><foreignObject x="2356" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Update status and reporting progress</b><br /><span style="font-size:12px">Keep known and pending results separate</span><br /><span style="font-size:11px;color:#555">LCS-05 / 06</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="2032.0,520.0 2218.0,520.0 2240.0,570.0 2218.0,620.0 2032.0,620.0 2010.0,570.0" /><foreignObject x="2016" y="526" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check the original report</b><br /><span style="font-size:12px">Establish the outcome before an unsafe retry</span><br /><span style="font-size:11px;color:#555">LCS-10</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1670" y="698" width="230" height="100" rx="8" /><foreignObject x="1676" y="704" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Send each required report</b><br /><span style="font-size:12px">Keep its request identity and exact content</span><br /><span style="font-size:11px;color:#555">LCS-09</span></div></div></foreignObject><rect fill="#ffffff" stroke="#333333" stroke-width="2" x="1670" y="876" width="230" height="100" rx="8" /><foreignObject x="1676" y="882" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Return the reporting result</b><br /><span style="font-size:12px">Public or private destination</span></div></div></foreignObject><foreignObject x="25" y="1051" width="3090" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Report an authorised business event only to its required destinations. Each public/private destination returns its own reporting result. Report acceptance does not fabricate buyer acceptance or payment. Receiving a platform status update must not automatically report it again.</div></div></foreignObject></svg>