ke-width="2" stroke-dasharray="7 5" /><polygon points="2010.0,570.0 2001.0,566.0 2001.0,574.0" fill="#555" /><rect x="1790.5" y="648" width="112.5" height="22" fill="white" /><foreignObject x="1790.5" y="648" width="112.5" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:11px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">timeout / no result</div></div></foreignObject><rect fill="#ffffff" stroke="#333333" stroke-width="2" x="310" y="202" width="230" height="100" rx="8" /><foreignObject x="322" y="214" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">SOURCE<br /><b>Record business event</b><br />Authorised rejection or payment</div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="2895" cy="252" rx="115" ry="50" /><foreignObject x="2792" y="214" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">END<br /><b>Show next action</b><br />Deadline and evidence source</div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="765" cy="430" rx="115" ry="50" /><foreignObject x="662" y="392" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-02 / 04<br /><b>Authorise event</b><br />Invoice, actor and country rule</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="990" y="380" width="230" height="100" rx="8" /><foreignObject x="1002" y="392" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-07<br /><b>Plan destinations</b><br />Historic route and deadline</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1330" y="380" width="230" height="100" rx="8" /><foreignObject x="1342" y="392" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-08<br /><b>Create obligations</b><br />One event, one per destination</div></div></foreignObject><polygon fill="#d7d7d7" stroke="#333333" stroke-width="2" points="2130.0,380.0 2250.0,435.0 2130.0,490.0 2010.0,435.0" /><foreignObject x="2028" y="398" width="204" height="74"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">DECISION<br /><b>Outcome known?</b><br />Per destination result</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2350" y="380" width="230" height="100" rx="8" /><foreignObject x="2362" y="392" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-05 / 06<br /><b>Update view</b><br />Known and pending separately</div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="2032.0,520.0 2218.0,520.0 2240.0,570.0 2218.0,620.0 2032.0,620.0 2010.0,570.0" /><foreignObject x="2022" y="532" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-10<br /><b>Reconcile original</b><br />Query before unsafe repeat</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1670" y="698" width="230" height="100" rx="8" /><foreignObject x="1682" y="710" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-09<br /><b>Deliver each action</b><br />Stable identity and payload</div></div></foreignObject><rect fill="#ffffff" stroke="#333333" stroke-width="2" x="1670" y="876" width="230" height="100" rx="8" /><foreignObject x="1682" y="888" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">RESULT<br /><b>Return reporting result</b><br />Public / private destination</div></div></foreignObject><foreignObject x="25" y="1051" width="3090" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Report an authorised business event only to its required destinations. Each public/private destination returns its own reporting result. Report acceptance does not fabricate buyer acceptance or payment. Receiving a platform status update must not automatically report it again.</div></div></foreignObject></svg>