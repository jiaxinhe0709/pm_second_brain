<svg aria-label="Lifecycle reporting: independent obligations" xmlns="http://www.w3.org/2000/svg" width="3140" height="1126" viewBox="0 0 3140 1126" role="img"><title>Lifecycle reporting: independent obligations</title><desc>One authorised business event can require separate issuer and public reports with distinct outcomes. Issuer and public-platform actions remain independent. A known success is not replayed because another destination is uncertain. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</desc><rect width="3140" height="1126" fill="white" /><foreignObject x="25" y="15" width="3090" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:26px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Lifecycle reporting: independent obligations</b></div></div></foreignObject><foreignObject x="25" y="58" width="3090" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="285" y="98" width="925" height="28" r