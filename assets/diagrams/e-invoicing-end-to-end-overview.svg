<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 950" role="img" aria-labelledby="title desc">
<title id="title">E-invoicing end-to-end journey</title>
<desc id="desc">Readiness, exchange and evidence are related outcomes; country policy chooses each required leg</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="2500" height="950" fill="#fff"/>
<text x="35" y="44" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#111">E-invoicing end-to-end journey</text>
<text x="35" y="76" font-family="Arial,sans-serif" font-size="15" fill="#444">Readiness, exchange and evidence are related outcomes; country policy chooses each required leg</text>
<rect x="30" y="130" width="2440" height="200" fill="#fafafa" stroke="#aaa"/>
<rect x="30" y="130" width="245" height="200" fill="#e5e5e5" stroke="#aaa"/>
<text x="152" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">CUSTOMER / SAGE</text>
<text x="152" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">PRODUCT</text>
<rect x="30" y="340" width="2440" height="310" fill="#f1f1f1" stroke="#aaa"/>
<rect x="30" y="340" width="245" height="310" fill="#e5e5e5" stroke="#aaa"/>
<text x="152" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">SAGE E-INVOICING</text>
<text x="152" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">SERVICE</text>
<rect x="30" y="660" width="2440" height="240" fill="#fafafa" stroke="#aaa"/>
<rect x="30" y="660" width="245" height="240" fill="#e5e5e5" stroke="#aaa"/>
<text x="152" y="704" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">ECOSYSTEM / EXCEPTIONS</text>
<path d="M540 232 H565 V455 H600" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M850 455 H900" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1150 455 H1250" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1500 455 H1600" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1850 455 H2050" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M2190 405 V340 H2275 V280" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1375 505 V720" fill="none" stroke="#444" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M1725 505 V720" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1850 455 H1875 V680 H2025 V720" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<ellipse cx="420.0" cy="232.5" rx="120.0" ry="47.5" fill="#fff" stroke="#222" stroke-width="2.2"/>
<text x="420.0" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Choose entity and capability</text>
<text x="420.0" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Customer or Sage product starts</text>
<polygon points="2164,185 2410,185 2386,280 2140,280" fill="#fff" stroke="#222" stroke-width="2.2"/>
<text x="2275.0" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">See evidence-based outcome</text>
<text x="2275.0" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Status, history and next action</text>
<rect x="600" y="405" width="250" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="725.0" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Establish readiness</text>
<text x="725.0" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Entity, actor and authority</text>
<polygon points="924,405 1150,405 1126,505 900,505" fill="#fff" stroke="#222" stroke-width="2.2"/>
<text x="1025.0" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Accept business intent</text>
<text x="1025.0" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Invoice or inbound event identity</text>
<polygon points="1375.0,405 1500,455.0 1375.0,505 1250,455.0" fill="#d1d1d1" stroke="#222" stroke-width="2.2"/>
<text x="1375.0" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Country obligations?</text>
<text x="1375.0" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Scope, document and</text>
<text x="1375.0" y="478" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">reporting</text>
<path d="M1600 405 H1850 V492 Q1790 478 1730 492 T1600 492 Z" fill="#fff" stroke="#333" stroke-width="2.2"/>
<text x="1725.0" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Plan and execute</text>
<text x="1725.0" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Validate, route and trust</text>
<path d="M2050 418 V492 C2050 508 2330 508 2330 492 V418 Z" fill="#e0e0e0" stroke="#333" stroke-width="2.2"/>
<ellipse cx="2190.0" cy="418" rx="140.0" ry="13" fill="#e0e0e0" stroke="#333" stroke-width="2.2"/>
<text x="2190.0" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Preserve and interpret</text>
<text x="2190.0" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Raw evidence and lifecycle view</text>
<polygon points="1274,720 1476,720 1500,767.5 1476,815 1274,815 1250,767.5" fill="#f4f4f4" stroke="#222" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1375.0" y="753" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Hold for evidence</text>
<text x="1375.0" y="777" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">No applicable approved policy</text>
<polygon points="1622,720 1828,720 1850,815 1600,815" fill="#fff" stroke="#555" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1725.0" y="753" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Recipient / network</text>
<text x="1725.0" y="777" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Approved send or receive path</text>
<polygon points="1922,720 2128,720 2150,815 1900,815" fill="#fff" stroke="#555" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="2025.0" y="753" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Authority leg</text>
<text x="2025.0" y="777" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Only if country policy requires</text>
<text x="35" y="930" font-family="Arial,sans-serif" font-size="13" fill="#444">Solid arrows show the process; dashed arrows end at a hold, correction or unresolved case. Country and provider details require source evidence.</text>
</svg>