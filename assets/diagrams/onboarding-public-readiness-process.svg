-04 · Scenario-specific</text></a><a href="../../specs/SPEC-SEI-002-onboarding-solution-specification.md" aria-label="ONB-11 Show results and next actions"><title>Readiness is separate from activation</title><rect x="2010" y="318" width="260" height="104" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="2140.0" y="344" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Show results and next</text><text x="2140.0" y="363" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">actions</text><text x="2140.0" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Readiness is separate from activation</text><text x="2140.0" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-11 · Common</text></a><a href="../../specs/SPEC-SEI-002-onboarding-solution-specification.md" aria-label="ONB-02/03 / OFR-03 Correct the requested evidence"><title>Same business, purpose and affected check</title><rect x="830" y="178" width="260" height="104" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="960.0" y="204" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Correct the requested</text><text x="960.0" y="223" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">evidence</text><text x="960.0" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Same business, purpose and affected check</text><text x="960.0" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-02/03 / OFR-03 · Conditional</text></a><a href="../../specs/SPEC-SEI-002-onboarding-solution-specification.md" aria-label="ONB-08 / OFR-02/04–08 Resolve the blocked check"><title>Check the original result; retry only if safe</title><rect x="1420" y="458" width="260" height="104" rx="8" fill="#d7d7d7" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1550.0" y="484" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Resolve the blocked check</text><text x="1550.0" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Check the original result; retry only if safe</text><text x="1550.0" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-08 / OFR-02/04–08 · Conditional</text></a><a href="../../specs/SPEC-SEI-002-onboarding-solution-specification.md" aria-label="OFR-07 Review the unresolved case"><title>Named owner, evidence and next action</title><rect x="1420" y="738" width="260" height="104" rx="8" fill="#d7d7d7" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1550.0" y="764" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Review the unresolved case</text><text x="1550.0" y="810" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Named owner, evidence and next action</text><text x="1550.0" y="830" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">OFR-07 · Conditional</text></a><text x="1450" y="914" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Checks pass</text><text x="690" y="325" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Missing identity or permission</text><text x="975" y="365" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Access or certificate problem</text><text x="400" y="215" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Corrected: repeat the same check</text><text x="1250" y="215" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Pending: return required action</text><text x="1160" y="416" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Check unavailable or result unknown</text><text x="1140" y="775" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Read failed or result unknown</text><text x="700" y="565" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Resolved: repeat the affected check</text><text x="1640" y="445" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Record this result</text><text x="1565" y="720" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Needs review</text><text x="1730" y="750" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Return action and owner</text><text x="28" y="1030" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">After correction or a confirmed result, repeat the affected check. Unavailable evidence does not prove a missing certificate.</text><text x="28" y="1054" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Check whether the original operation ran before repeating it. Keep unresolved work on hold with a named owner.</text><text x="28" y="1078" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Public readiness does not activate a route. Keep other valid functions available. The matrix below links to the detailed rules.</text></svg>