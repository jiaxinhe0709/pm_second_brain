<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Public onboarding: capability readiness</title><desc id="desc">Per legal subject and capability; direct and accountant work items use the same isolated gates. A portfolio returns independent child outcomes. READY is capability readiness, not invoice compliance, external registration or private route activation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Public onboarding: capability readiness</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">Per legal subject and capability; direct and accountant work items use the same isolated gates.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE COORDINATION</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">PROVIDER / EXTERNAL</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">OPERATIONS / RECORDS</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; SCOPE</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">ASSESS &amp; PREPARE</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">TRANSITION &amp; VERIFY</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">CONTINUITY &amp; CLOSE</text><polyline points="540,221 600,221 600,393 660,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="890,393 950,393 950,591 1010,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1240,591 1300,591 1300,393 1360,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1600,393 1710,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1600.0" y="357" width="100" height="22" fill="white" opacity=".96"/><text x="1650" y="373" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">sufficient</text><polyline points="1940,393 2000,393 2000,221 2060,221" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="775,350 775,221 1010,221" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="838.0" y="187" width="124" height="22" fill="white" opacity=".96"/><text x="900" y="203" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">missing grant</text><polyline points="1480,440 1480,798 1710,798" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1519.0" y="764" width="82" height="22" fill="white" opacity=".96"/><text x="1560" y="780" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">unknown</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">ONB-01</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Open work item</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Entity, capability, environment</text><rect x="660" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="775.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">ONB-02</text><text x="775.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Verify subject</text><text x="775.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Identity and scoped authority</text><rect x="1010" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1125.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">ONB-03</text><text x="1125.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Assess prerequisites</text><text x="1125.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">External checks and trust policy</text><polygon points="1480.0,350 1600,395.0 1480.0,440 1360,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2"/><text x="1480.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1480.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Evidence sufficient?</text><text x="1480.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Ready, limitation or unknown</text><rect x="1710" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1825.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">ONB-04</text><text x="1825.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Record readiness</text><text x="1825.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Per dimension and capability</text><ellipse cx="2175.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2175.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2175.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Show next action</text><text x="2175.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">No route activation</text><polygon points="1734,755 1916,755 1940,798.0 1916,841 1734,841 1710,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1825.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">ONB-08</text><text x="1825.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Reconcile result</text><text x="1825.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Original external operation</text><polygon points="1034,178 1216,178 1240,221.0 1216,264 1034,264 1010,221.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1125.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">ACTION</text><text x="1125.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Correct one item</text><text x="1125.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Client grant or evidence</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">A portfolio returns independent child outcomes. READY is capability readiness, not invoice compliance, external registration or private route activation.</text></svg>