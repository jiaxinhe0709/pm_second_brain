e Sage B2B access.</text><text x="28" y="914" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Keep exact readiness states. Return failed and unknown checks with actions; an uncertain external effect uses SPEC-SEI-004.</text><text x="28" y="938" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Spain policy controls required trust and capabilities. Portfolio clients and unaffected functions retain independent results.</text></svg>