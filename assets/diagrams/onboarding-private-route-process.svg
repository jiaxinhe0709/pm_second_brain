justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Switch future invoice traffic</b><br /><span style="font-size:12px">Use the approved effective boundary</span><br /><span style="font-size:11px;color:#555">ONB-07</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="1382.0,698.0 1578.0,698.0 1600.0,748.0 1578.0,798.0 1382.0,798.0 1360.0,748.0" /><foreignObject x="1366" y="704" width="228" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check uncertainty or hold the change</b><br /><span style="font-size:12px">Resolve missing or conflicting evidence</span><br /><span style="font-size:11px;color:#555">ONB-08</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2060" y="876" width="230" height="100" rx="8" /><foreignObject x="2066" y="882" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Keep earlier invoice context</b><br /><span style="font-size:12px">Original route and outstanding duties</span><br /><span style="font-size:11px;color:#555">ONB-09</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1010" y="1054" width="230" height="100" rx="8" /><foreignObject x="1016" y="1060" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Verify the receiving destination</b><br /><span style="font-size:12px">Platform and receiving-point evidence</span><br /><span style="font-size:11px;color:#555">ONB-06</span></div></div></foreignObject><foreignObject x="25" y="1229" width="2750" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">A private route changes only the authorised direction and scope after external readiness is observed. Configuration and tests leave the live route unchanged. A timeout reconciles the original operation before any retry or completion claim.</div></div></foreignObject></svg>