<svg aria-label="Shared prerequisites" xmlns="http://www.w3.org/2000/svg" width="1415" height="1474" viewBox="0 0 1415 1474" role="img"><title>Shared prerequisites</title><desc>Reuse current evidence; provision a dataset only if the channel requires it. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid requests; dashed paired responses; grey activation bars. Timing and service placement remain proposed. Current business access is required. HTTP success is separate from readiness and activation. Unknown evidence holds dependent work.</desc><rect width="1415" height="1474" fill="white" /><rect x="8" y="8" width="1399" height="1458" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Shared prerequisites</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Reuse current evidence; provision a dataset only if the channel requires it</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1371" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">Product</text><path d="M 515,216 L 515,1371" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1371" fill="no