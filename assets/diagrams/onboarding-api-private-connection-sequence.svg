<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3008" viewBox="0 0 1800 3008" role="img" aria-label="Onboarding API view - Create a private connection and observe the result"><title>Onboarding API view - Create a private connection and observe the result</title><desc>ONB-S01/03/04 | Later-phase proposal; qualified provider scope is required. No supplied FR endpoint proves Spain activation, approval, certificate or representation coverage. Source operation paths and response codes are exact; internal handoffs are proposed and labelled GAP. Private A to Private B remains gated. A diagram cannot enable an unsupported transition.</desc><rect width="1800" height="3008" fill="white" /><text x="28" y="42" font-family="Arial, sans-serif" font-size="28" fill="#222222" text-anchor="start">Onboarding API view - Create a private connection and observe the result</text><text x="28" y="75" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">ONB-S01/03/04 | Later-phase proposal; qualified provider scope is required.</text><text x="28" y="105" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Proposed logical sequence · Participants are responsibility groups; actual service placement and contracts remain open.</text><text x="28" y="132" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Solid filled arrow: request · Dashed open arrow: response · Solid open arrow: notification · Time runs down.</text><rect x="24" y="843" width="1752" height="744" fill="none" stroke="#777777" rx="4" /><rect x="24" y="1720" width="1752" height="450" fill="none" stroke="#777777" rx="4" /><path d="M 140,246 L 140,2830" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="27" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="140" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">ERP / product</text><path d="M 750,246 L 750,2830" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="637" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="750" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Global API</text><text x="750" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">FR contract candidate</text><path d="M 1090,246 L 1090,2830" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="977" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1090" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Domain Service -</text><text x="1090" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">E-Invoice Service</text><text x="1090" y="224" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Proposed coordination</text><path d="M 1390,246 L 1390,2830" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="1277" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1390" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Domain Service -</text><text x="1390" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Other Services</text><text x="1390" y="224" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Identity / trust / routing</text><path d="M 1660,246 L 1660,2830" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="1547" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1660" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Public / private platforms</text><text x="1660" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Qualified integration</text><rect x="24" y="843" width="1752" height="31" fill="#f1f1f1" stroke="#777777" rx="4" /><text x="36" y="865" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="start">opt - Selected plan needs create and Spain contract is qualified</text><rect x="24" y="1720" width="1752" height="31" fill="#f1f1f1" stroke="#777777" rx="4" /><text x="36" y="1742" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="start">opt - Known connectionId; owner-approved observation schedule</text><rect x="28" y="302" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="327" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">1 - Use discovery results and qualify missing work</text><rect x="35" y="387" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="412" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Use API-01/02/04 to find matching setup. Reuse valid existing configuration. Check business identity, current authority, selected service and conditional trust. Missing</text><text x="49" y="434" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">approval returns to ONB-12.</text><text x="49" y="467" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">ONB-01/02/03/05/10/12 | GAP-01/02/03/06</text><rect x="28" y="766" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="791" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">2 - Create only a separately authorised missing connection</text><rect x="35" y="921" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="946" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Save the original intent and Idempotency-Key before dispatch. FR payload uses company/user information and France address types. Do not send Spain NIF as fr.siren or</text><text x="49" y="968" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">inherit the omitted-usage default.</text><text x="49" y="1001" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">OFR-01 | API-03 | GAP-02/04</text><rect x="35" y="1428" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="1453" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">201 records resource creation. The address result can still be IN_PROGRESS, RETRYING, CONNECTED, DISCONNECTED or ERROR. It does not establish Spain capability readiness</text><text x="49" y="1475" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">or activation.</text><text x="49" y="1508" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">FR-03 | GAP-05</text><rect x="28" y="1643" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="1668" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">3 - Observe and recover the original operation</text><rect x="35" y="2174" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="2199" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">After a lost create response, connectionId may be unknown. API-02 discovery alone is not authoritative operation correlation. Keep affected work on hold until original-</text><text x="49" y="2221" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">effect evidence or qualified same-key replay resolves it. No fresh-key POST.</text><text x="49" y="2254" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">OFR-05/06/07 | GAP-04</text><rect x="28" y="2373" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="2398" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">4 - Gate activation and return independent results</text><rect x="35" y="2638" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="2663" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">ONB-11 returns separate connection, readiness and evidenced activation results. Preserve earlier invoice context. Runtime owners retain current authority and credential</text><text x="49" y="2685" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">checks.</text><text x="49" y="2718" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">ONB-11 | GAP-05/06</text><rect x="1098" y="521" width="284" height="43" fill="white" stroke="none" rx="4" /><text x="1240.0" y="539" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">01  Qualify authority and trust</text><text x="1240.0" y="562" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">GAP-03/06 - API contracts not supplied</text><path d="M 1090,574 L 1390,574" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1380.0,569.0 L 1390,574 L 1380.0,579.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="1098" y="611" width="284" height="43" fill="white" stroke="none" rx="4" /><text x="1240.0" y="629" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">02  Evidence or owned limitation</text><text x="1240.0" y="652" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed handoff; no endpoint assigned</text><path d="M 1390,664 L 1090,664" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 1100.0,669.0 L 1090,664 L 1100.0,659.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1033" width="594" height="65" fill="white" stroke="none" rx="4" /><text x="445.0" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">03  API-03 POST /connectors/{accessPointId}/datasets/{datasetId}/</text><text x="445.0" y="1073" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connect</text><text x="445.0" y="1096" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-03 | ONB-05/06</text><path d="M 140,1108 L 750,1108" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,1103.0 L 750,1108 L 740.0,1113.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1145" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="1163" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">04  Dispatch scoped operation</text><text x="920.0" y="1186" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,1198 L 1090,1198" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,1193.0 L 1090,1198 L 1080.0,1203.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1213" width="324" height="65" fill="white" stroke="none" rx="4" /><text x="920.0" y="1231" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">05  201 - connection resource and</text><text x="920.0" y="1253" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">address status</text><text x="920.0" y="1276" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,1288 L 750,1288" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,1293.0 L 750,1288 L 760.0,1283.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1325" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="1343" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">06  201 - connection resource and address status</text><text x="445.0" y="1366" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-03</text><path d="M 750,1378 L 140,1378" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,1383.0 L 140,1378 L 150.0,1373.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1763" width="594" height="65" fill="white" stroke="none" rx="4" /><text x="445.0" y="1781" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">07  API-04 GET /connectors/{accessPointId}/datasets/{datasetId}/</text><text x="445.0" y="1803" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connections/{connectionId}/</text><text x="445.0" y="1826" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-04 | ONB-06/08</text><path d="M 140,1838 L 750,1838" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,1833.0 L 750,1838 L 740.0,1843.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1875" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="1893" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">08  Dispatch scoped operation</text><text x="920.0" y="1916" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,1928 L 1090,1928" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,1923.0 L 1090,1928 L 1080.0,1933.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1943" width="324" height="65" fill="white" stroke="none" rx="4" /><text x="920.0" y="1961" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">09  200 - current address</text><text x="920.0" y="1983" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">observations</text><text x="920.0" y="2006" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,2018 L 750,2018" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,2023.0 L 750,2018 L 760.0,2013.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="2055" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="2073" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">10  200 - current address observations</text><text x="445.0" y="2096" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-04</text><path d="M 750,2108 L 140,2108" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,2113.0 L 140,2108 L 150.0,2103.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="1098" y="2423" width="284" height="65" fill="white" stroke="none" rx="4" /><text x="1240.0" y="2441" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">11  Request authorised route</text><text x="1240.0" y="2463" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">decision</text><text x="1240.0" y="2486" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">GAP-06 - routing API not supplied</text><path d="M 1090,2498 L 1390,2498" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1380.0,2493.0 L 1390,2498 L 1380.0,2503.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="1098" y="2535" width="284" height="43" fill="white" stroke="none" rx="4" /><text x="1240.0" y="2553" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">12  Observed boundary or hold</text><text x="1240.0" y="2576" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">ONB-07/09 - separate activation gate</text><path d="M 1390,2588 L 1090,2588" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 1100.0,2593.0 L 1090,2588 L 1100.0,2583.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="24" y="2848" width="1752" height="144" fill="#f4f4f4" stroke="#aaaaaa" rx="4" /><text x="40" y="2873" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Scope and interpretation</text><text x="40" y="2900" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">No supplied FR endpoint proves Spain activation, approval, certificate or representation coverage.</text><text x="40" y="2924" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Source operation paths and response codes are exact; internal handoffs are proposed and labelled GAP.</text><text x="40" y="2948" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Private A to Private B remains gated. A diagram cannot enable an unsupported transition.</text></svg>