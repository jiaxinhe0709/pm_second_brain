<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1150" viewBox="0 0 1660 1150" role="img" aria-label="Shared onboarding checks: company, permission and credentials"><title>Shared onboarding checks: company, permission and credentials</title><desc>Phases 1–3. Before customer setup: product integrations with SXS and Tax / Connections Service are available.</desc><rect width="1660" height="1150" fill="white" /><text x="28" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222">Shared onboarding checks: company, permission and credentials</text><text x="28" y="65" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">Phases 1–3. Before customer setup: product integrations with SXS and Tax / Connections Service are available.</text><text x="28" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Proposed design · Solid: main path · Dashed: alternative or correction · Darker grey: recovery · Details: table below · Crossed lines do not join</text><text x="28" y="143" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Read the main path from left to right. Swimlanes show proposed roles; Engineering must confirm service ownership.</text><rect x="20" y="160" width="1620" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="160" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="235" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Customer / accountant</text><rect x="20" y="300" width="1620" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="300" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="375" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">ERP / product</text><rect x="20" y="440" width="1620" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="440" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="505" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Domain Service -</text><text x="120" y="525" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">E-Invoice Service</text><rect x="20" y="580" width="1620" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="580" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="645" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Domain Service - Other</text><text x="120" y="665" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Services</text><path d="M 500,230.0 L 505,230 Q 510,230.0 510,235 L 510,505 Q 510,510.0 515,510 L 520,510.0" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 500,230.0 L 505,230 Q 510,230.0 510,235 L 510,505 Q 510,510.0 515,510 L 520,510.0" fill="none" stroke="#444444" stroke-width="2.4" stroke-linejoin="round" data-connection="choose→dataset" /><path d="M 520,510.0 L 512.0,506.0 L 512.0,514.0 Z" fill="#444444" /><path d="M 780,510.0 L 785,510 Q 790,510.0 790,515 L 790,645 Q 790,650.0 795,650 L 800,650.0" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 780,510.0 L 785,510 Q 790,510.0 790,515 L 790,645 Q 790,650.0 795,650 L 800,650.0" fill="none" stroke="#444444" stroke-width="2.4" stroke-linejoin="round" data-connection="dataset→identity" /><path d="M 800,650.0 L 792.0,646.0 L 792.0,654.0 Z" fill="#444444" /><path d="M 1060,650.0 L 1080,650.0" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 1060,650.0 L 1080,650.0" fill="none" stroke="#444444" stroke-width="2.4" stroke-linejoin="round" data-connection="identity→credential" /><path d="M 1080,650.0 L 1072.0,646.0 L 1072.0,654.0 Z" fill="#444444" /><path d="M 1340,650.0 L 1345,650 Q 1350,650.0 1350,645 L 1350,375 Q 1350,370.0 1355,370 L 1360,370.0" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 1340,650.0 L 1345,650 Q 1350,650.0 1350,645 L 1350,375 Q 1350,370.0 1355,370 L 1360,370.0" fill="none" stroke="#444444" stroke-width="2.4" stroke-linejoin="round" data-connection="credential→result" /><path d="M 1360,370.0 L 1352.0,366.0 L 1352.0,374.0 Z" fill="#444444" /><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#61-onb-01-capture-requested-functions" aria-label="ONB-01 1. Choose company and setup"><title>New, review, add or enabled change</title><rect x="240" y="178" width="260" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="370.0" y="204" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">1. Choose company and setup</text><text x="370.0" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">New, review, add or enabled change</text><text x="370.0" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-01</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#64-onb-10-assess-current-setup" aria-label="ONB-10 2. Resolve SXS dataset"><title>Reuse saved business/client mapping</title><rect x="520" y="458" width="260" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="650.0" y="484" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">2. Resolve SXS dataset</text><text x="650.0" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Reuse saved business/client mapping</text><text x="650.0" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-10</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#62-onb-02-check-business-identity-and-authority" aria-label="ONB-02 3. Check NIF and permission"><title>Check business and caller separately</title><rect x="800" y="598" width="260" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="930.0" y="624" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">3. Check NIF and permission</text><text x="930.0" y="670" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Check business and caller separately</text><text x="930.0" y="690" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-02</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#65-onb-03-assess-prerequisites" aria-label="ONB-03 4. Check required credential"><title>Skip if the selected function needs none</title><rect x="1080" y="598" width="260" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1210.0" y="624" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">4. Check required credential</text><text x="1210.0" y="670" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Skip if the selected function needs none</text><text x="1210.0" y="690" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-03</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#612-onb-11-return-results-and-required-actions" aria-label="ONB-11 5. Show shared check result"><title>Pass: continue public/private setup</title><rect x="1360" y="318" width="260" height="104" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="1490.0" y="344" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">5. Show shared check result</text><text x="1490.0" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Pass: continue public/private setup</text><text x="1490.0" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-11</text></a><text x="28" y="1060" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Continue the selected public or private checks only after the required shared checks pass. No route activation occurs here.</text><text x="28" y="1084" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Reuse valid evidence for the business, action and environment. An unavailable lookup does not prove missing setup.</text><text x="28" y="1108" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Open: Spain resource mapping and Tax / E-Invoice ID relationships require owner confirmation. SPEC039 GAP-01/02/06.</text><text x="28" y="752" font-family="Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">Additional checks and next actions</text><rect x="20" y="768" width="1620" height="240" fill="#fafafa" stroke="#aaaaaa" /><text x="36" y="790" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">When</text><text x="418" y="790" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">Who acts</text><text x="748" y="790" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">Next action</text><path d="M 20,800 L 1640,800" stroke="#cccccc" fill="none" /><text x="36" y="830" font-family="Arial, sans-serif" font-size="14" fill="#333333">Company mapping is missing</text><text x="418" y="830" font-family="Arial, sans-serif" font-size="14" fill="#333333">Product / SXS owner</text><text x="748" y="830" font-family="Arial, sans-serif" font-size="14" fill="#333333">Confirm it is missing, then complete qualified setup. ONB-10.</text><path d="M 20,852 L 1640,852" stroke="#cccccc" fill="none" /><text x="36" y="882" font-family="Arial, sans-serif" font-size="14" fill="#333333">Information or approval is missing</text><text x="418" y="882" font-family="Arial, sans-serif" font-size="14" fill="#333333">Customer / accountant</text><text x="748" y="882" font-family="Arial, sans-serif" font-size="14" fill="#333333">Correct it, then repeat the affected check. ONB-02/12.</text><path d="M 20,904 L 1640,904" stroke="#cccccc" fill="none" /><text x="36" y="934" font-family="Arial, sans-serif" font-size="14" fill="#333333">Required certificate is missing or unsuitable</text><text x="418" y="934" font-family="Arial, sans-serif" font-size="14" fill="#333333">Tax / credential owner</text><text x="748" y="934" font-family="Arial, sans-serif" font-size="14" fill="#333333">Use the qualified correction or provisioning path. ONB-03.</text><path d="M 20,956 L 1640,956" stroke="#cccccc" fill="none" /><text x="36" y="986" font-family="Arial, sans-serif" font-size="14" fill="#333333">Lookup fails or an earlier result is unknown</text><text x="418" y="986" font-family="Arial, sans-serif" font-size="14" fill="#333333">E-Invoice owner</text><text x="748" y="986" font-family="Arial, sans-serif" font-size="14" fill="#333333">Keep pending with an owner; check the original result. ONB-08/11.</text></svg>