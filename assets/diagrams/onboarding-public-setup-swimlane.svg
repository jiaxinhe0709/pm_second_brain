="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="380.0" y="406" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Load current public setup</text><text x="380.0" y="452" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Discover only missing service/setup details</text><text x="380.0" y="472" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-10</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#64-onb-10-assess-current-setup" aria-label="ONB-10 Reuse SXS dataset and setup"><title>Use the resolved company dataset</title><rect x="590" y="560" width="280" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="730.0" y="586" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Reuse SXS dataset and setup</text><text x="730.0" y="632" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Use the resolved company dataset</text><text x="730.0" y="652" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-10</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#65-onb-03-assess-prerequisites" aria-label="ONB-03/04 Request public access check"><title>Selected business, action and environment</title><rect x="590" y="380" width="280" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="730.0" y="406" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Request public access check</text><text x="730.0" y="452" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Selected business, action and environment</text><text x="730.0" y="472" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-03/04</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#65-onb-03-assess-prerequisites" aria-label="ONB-03/04 Coordinate public access check"><title>Reuse matching current evidence</title><rect x="940" y="560" width="280" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1080.0" y="586" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Coordinate public access check</text><text x="1080.0" y="632" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Reuse matching current evidence</text><text x="1080.0" y="652" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-03/04</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#62-onb-02-check-business-identity-and-authority" aria-label="ONB-02/03 Check identity and access"><title>NIF, permission; Tax credential if needed</title><rect x="940" y="740" width="280" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1080.0" y="766" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Check identity and access</text><text x="1080.0" y="812" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">NIF, permission; Tax credential if needed</text><text x="1080.0" y="832" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-02/03</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#65-onb-03-assess-prerequisites" aria-label="ONB-03 Check public service access"><title>Use supported checks for this function</title><rect x="1290" y="1100" width="280" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1430.0" y="1126" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Check public service access</text><text x="1430.0" y="1172" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Use supported checks for this function</text><text x="1430.0" y="1192" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-03</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#66-onb-04-publish-public-readiness" aria-label="ONB-04 Save public check results"><title>Save readiness and evidence</title><rect x="1640" y="560" width="280" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1780.0" y="586" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Save public check results</text><text x="1780.0" y="632" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Save readiness and evidence</text><text x="1780.0" y="652" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-04</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#612-onb-11-return-results-and-required-actions" aria-label="ONB-11 Show result and next action"><title>Readiness / pending / owner; use separate</title><rect x="1990" y="380" width="280" height="104" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="2130.0" y="406" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Show result and next action</text><text x="2130.0" y="452" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Readiness / pending / owner; use separate</text><text x="2130.0" y="472" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-11</text></a><text x="28" y="1590" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Check the business NIF, caller and permission separately. Use a suitable in-date certificate only where required.</text><text x="28" y="1614" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">No public enrolment call or test invoice is assumed. Results return to the common ONB-07 platform-use decision; setup alone activates nothing.</text><text x="28" y="1638" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Keep other valid functions available. Full rules and acceptance checks remain in SPEC038 §7.</text><text x="28" y="1272" font-family="Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">Additional checks and next actions</text><rect x="20" y="1288" width="2310" height="188" fill="#fafafa" stroke="#aaaaaa" /><text x="36" y="1310" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">When</text><text x="418" y="1310" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">Who acts</text><text x="748" y="1310" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">Next action</text><path d="M 20,1320 L 2330,1320" stroke="#cccccc" fill="none" /><text x="36" y="1350" font-family="Arial, sans-serif" font-size="14" fill="#333333">Information or approval is missing</text><text x="418" y="1350" font-family="Arial, sans-serif" font-size="14" fill="#333333">Customer / accountant</text><text x="748" y="1350" font-family="Arial, sans-serif" font-size="14" fill="#333333">Correct it, then repeat the affected check. ONB-02/03/12.</text><path d="M 20,1372 L 2330,1372" stroke="#cccccc" fill="none" /><text x="36" y="1402" font-family="Arial, sans-serif" font-size="14" fill="#333333">A check fails or its result is unknown</text><text x="418" y="1402" font-family="Arial, sans-serif" font-size="14" fill="#333333">E-Invoice owner</text><text x="748" y="1402" font-family="Arial, sans-serif" font-size="14" fill="#333333">Check the original result. Repeat only when safe. ONB-08.</text><path d="M 20,1424 L 2330,1424" stroke="#cccccc" fill="none" /><text x="36" y="1454" font-family="Arial, sans-serif" font-size="14" fill="#333333">The case cannot be resolved</text><text x="418" y="1454" font-family="Arial, sans-serif" font-size="14" fill="#333333">Operations / support</text><text x="748" y="1454" font-family="Arial, sans-serif" font-size="14" fill="#333333">Keep affected work pending; show its owner and next action. ONB-08/11.</text></svg>