al-feature-specification.md#612-onb-11-return-results-and-required-actions" aria-label="ONB-11 6. Show result and next action"><title>Per function; no route activation</title><rect x="1640" y="318" width="260" height="104" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="1770.0" y="344" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">6. Show result and next</text><text x="1770.0" y="363" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">action</text><text x="1770.0" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Per function; no route activation</text><text x="1770.0" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-11</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#62-onb-02-check-business-identity-and-authority" aria-label="ONB-02/12 Correct information or approval"><title>Repeat only the affected check</title><rect x="800" y="178" width="260" height="104" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="930.0" y="204" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Correct information or</text><text x="930.0" y="223" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">approval</text><text x="930.0" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Repeat only the affected check</text><text x="930.0" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-02/12</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#610-onb-08-reconcile-and-recover" aria-label="ONB-08 Check the original result"><title>Resume safely or return n