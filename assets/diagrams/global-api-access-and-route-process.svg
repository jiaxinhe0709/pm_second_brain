ite" opacity=".96" /><text x="2135" y="650" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">explicit route request</text><polyline points="1830,798 1900,798" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="1900.00,798.00 1890.00,794.00 1890.00,802.00" fill="#555" /><rect x="1823.0" y="766" width="84" height="22" fill="white" opacity=".96" /><text x="1865" y="782" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">evidence</text><polyline points="2150,798 2205,798 2205,800 2260,800" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="2260.00,800.00 2250.00,796.00 2250.00,804.00" fill="#555" /><polyline points="2500,800 2550,800" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="2550.00,800.00 2540.00,796.00 2540.00,804.00" fill="#555" /><rect x="2484.0" y="764" width="82" height="22" fill="white" opacity=".96" /><text x="2525" y="780" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">known</text><polyline points="2380,845 2380,870" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="2380.00,870.00 2384.00,860.00 2376.00,860.00" fill="#555" /><rect x="2414.0" y="845" width="82" height="22" fill="white" opacity=".96" /><text x="2455" y="861" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">unknown</text><polyline points="2260,913 2185,913 2185,860 2025,860 2025,841" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="2025.00,841.00 2021.00,851.00 2029.00,851.00" fill="#555" /><rect x="2056.0" y="884" width="148" height="22" fill="white" opacity=".96" /><text x="2130" y="900" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">recheck original</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2" /><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-01</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Request API access</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Consumer, environment, capability</text><rect x="630" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="745.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-01</text><text x="745.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Qualify consumer</text><text x="745.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Contract, security, conformance</text><rect x="950" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="1065.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-02</text><text x="1065.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Reuse entity + grant</text><text x="1065.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Separate customer authority</text><rect x="1270" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="1385.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-02</text><text x="1385.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Check connection</text><text x="1385.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Direction, profile, trust, evidence</text><polygon points="1710.0,350 1830,395.0 1710.0,440 1590,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2" /><text x="1710.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1710.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Capability ready?</text><text x="1710.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Ready for this scope</text><rect x="1900" y="350" width="250" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="2025.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-03</text><text x="2025.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Authorise each action</text><text x="2025.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Principal, entity, scope and time</text><ellipse cx="2550.0" cy="221.0" rx="140.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2" /><text x="2550.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2550.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Capability available</text><text x="2550.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Current routes stay unchanged</text><polygon points="654,755 836,755 860,798.0 836,841 654,841 630,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" /><text x="745.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-01 / 12</text><text x="745.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Correct qualification</text><text x="745.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">No access or route activation</text><polygon points="1294,755 1496,755 1520,798.0 1496,841 1294,841 1270,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" /><text x="1395.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-02</text><text x="1395.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight