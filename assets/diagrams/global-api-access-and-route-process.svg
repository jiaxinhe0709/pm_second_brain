<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Global API: consumer access, connection readiness and routing</title><desc id="desc">Proposed design. Product and partner permissions differ; a ready connection does not change the active route. Solid arrows: request or controlled result. Dashed: exception, evidence or separately authorised action. Unknown activation never permits blind repetition.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555" /></marker></defs><rect width="2800" height="1000" fill="white" /><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Global API: consumer access, connection readiness and routing</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">Proposed design. Product and partner permissions differ; a ready connection does not change the active route.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa" /><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa" /><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">PRODUCT / PARTNER</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa" /><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa" /><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">GLOBAL API / DOMAIN</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa" /><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa" /><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">AUTHORITY / EXECUTOR</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa" /><rect x="25" y="695" width=