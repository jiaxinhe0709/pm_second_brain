 fill="#111">Activation known?</text><text x="2380.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Original evidence</text><rect x="2550" y="755" width="200" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="2650.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-09</text><text x="2650.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Commit scoped route</text><text x="2650.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Old invoice context retained</text><polygon points="2284,870 2476,870 2500,913.0 2476,956 2284,956 2260,913.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" /><text x="2380.0" y="892" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-09 / 12</text><text x="2380.0" y="917" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Reconcile activation</text><text x="2380.0" y="939" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Hold unknown; original reference</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">Solid arrows: request or controlled result. Dashed: exception, evidence or separately authorised action. Unknown activation never permits blind repetition.</text></svg>