<svg aria-label="Spain public discovery and separate file recovery" xmlns="http://www.w3.org/2000/svg" width="1415" height="1861" viewBox="0 0 1415 1861" role="img"><title>Spain public discovery and separate file recovery</title><desc>Supplied PRE transport; business formats, authority and complete coverage remain gated. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time. Existing: supplied guide/transport evidence. To qualify: logical handoff or missing contract; no deployment decision.</desc><rect width="1415" height="1861" fill="white" /><rect x="8" y="8" width="1399" height="1845" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Spain public discovery and separate file recovery</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Supplied PRE transport; business formats, authority and complete coverage remain gated</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1758" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,1758" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice Service</text><path d="M 900,216 L 900,1758" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Public platform</text><path d="M 1285,216 L 1285,1758" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Records</text><rect x="24" y="765" width="1367" height="245" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1040" width="1367" height="430" fill="none" stroke="#777777" rx="0" /><rect x="507" y="440" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="625" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="870" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="1168" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="1353" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="765" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="788" fill="#222222">opt | Identity or final-state consultation is required</text><rect x="24" y="1040" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1063" fill="#222222">loop | Every covered item; locator OR identity recovery</text><rect x="38" y="258" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#222222">A qualified automatic schedule is the public collection baseline. Optional refresh joins scoped work. Check</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#222222">current recipient authority, environment and source binding before protected calls.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="336" fill="#888888">RSD-01/02; SPFE-S02 Articles 9-11</text><rect x="38" y="1500" width="1339" height="112" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1524" fill="#222222">Receiving saves classification or pending handoff. Commit covered progress only when every item has source</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1547" fill="#222222">plus durable classification, or an approved ignore outcome. Pending handoff or failed download keeps the</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1570" fill="#222222">boundary incomplete.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1600" fill="#888888">RSD-05/06; RCV-01-09; RET-G03/09</text><rect x="38" y="1636" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1660" fill="#222222">SECUENCE_ID spelling is preserved. Query/download business formats remain pending in the supplied formats PDF;</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1683" fill="#222222">a WSDL operation is not complete schema or production-readiness evidence.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1714" fill="#888888">SPFE-S03/S08; RET-API-A06</text><rect x="142" y="354" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="372" fill="#888888">[To qualify] RRI-Q02; no new endpoint implied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="396" fill="#222222">Optional refresh for the represented</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="419" fill="#222222">business</text><path d="M 130,440 L 507,440" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,434 L 507,440 L 495,446 Z" fill="#444444" stroke="#444444" /><rect x="142" y="458" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="476" fill="#888888">[To qualify] RRI-Q02; no new endpoint implied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="500" fill="#222222">Current scoped work and result; physical</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="523" fill="#222222">API to qualify</text><path d="M 507,544 L 130,544" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,538 L 130,544 L 142,550" fill="none" stroke="#444444" /><rect x="527" y="562" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="580" fill="#888888">[Existing transport] SPFE-S03/S15; [To qualify] RET-G06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="604" fill="#222222">GetRegisteredInvoice / QUERYBYFILTER</text><path d="M 515,625 L 892,625" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,619 L 892,625 L 880,631 Z" fill="#444444" stroke="#444444" /><rect x="527" y="643" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="661" fill="#888888">[Existing transport] SPFE-S03/S15; [To qualify] RET-G06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="685" fill="#222222">Presentation-date results; qualified</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="708" fill="#222222">continuation evidence</text><path d="M 892,729 L 515,729" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,723 L 515,729 L 527,735" fill="none" stroke="#444444" /><rect x="527" y="807" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="825" fill="#888888">[Existing transport] SPFE-S03/S14</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="849" fill="#222222">GetInvoices / QUERYBYID</text><path d="M 515,870 L 892,870" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,864 L 892,870 L 880,876 Z" fill="#444444" stroke="#444444" /><rect x="527" y="888" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="906" fill="#888888">[Existing transport] SPFE-S03/S14</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="930" fill="#222222">Scoped identity/status metadata; not</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="953" fill="#222222">invoice-file capture</text><path d="M 892,974 L 515,974" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,968 L 515,974 L 527,980" fill="none" stroke="#444444" /><rect x="527" y="1082" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1100" fill="#888888">[Existing transport] SPFE-S03/S12/S13; RET-G06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1124" fill="#222222">DownloadInvoicesByLOC OR</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1147" fill="#222222">DownloadInvoicesByID</text><path d="M 515,1168 L 892,1168" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1162 L 892,1168 L 880,1174 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1186" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1204" fill="#888888">[Existing transport] SPFE-S03/S12/S13; RET-G06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1228" fill="#222222">Invoice bytes with separate per-item</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1251" fill="#222222">success/failure</text><path d="M 892,1272 L 515,1272" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1266 L 515,1272 L 527,1278" fill="none" stroke="#444444" /><rect x="527" y="1290" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1308" fill="#888888">[To qualify] RSD-04; RET-G05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1332" fill="#222222">Capture exact source, role and context</text><path d="M 515,1353 L 1277,1353" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,1347 L 1277,1353 L 1265,1359 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1371" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1389" fill="#888888">[To qualify] RSD-04; RET-G05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1413" fill="#222222">Verified source reference/hash, or incomplete/restricted state</text><path d="M 1277,1434 L 515,1434" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1428 L 515,1434 L 527,1440" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1798" fill="#888888">Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1821" fill="#888888">Existing: supplied guide/transport evidence. To qualify: logical handoff or missing contract; no deployment decision.</text></svg>