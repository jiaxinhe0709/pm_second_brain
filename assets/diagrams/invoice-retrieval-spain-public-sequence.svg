<svg xmlns="http://www.w3.org/2000/svg" aria-label="Public collection: find, download and save invoices" width="1030" height="1381" viewBox="0 0 1030 1381" role="img"><title>Public collection: find, download and save invoices</title><desc>Phase 1: required SPFE collection; view and user download follow capture. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid: request. Dashed: result. Grey bars show handling, not elapsed time. Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</desc><rect width="1030" height="1381" fill="white" /><rect x="8" y="8" width="1014" height="1365" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Public collection: find, download and save invoices</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Phase 1: required SPFE collection; view and user download follow capture</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1278" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#626262">E-Invoice Service</text><path d="M 515,216 L 515,1278" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#626262">Public platform</text><path d="M 900,216 L 900,1278" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#626262">Records / receiving</text><rect x="24" y="557" width="982" height="222" fill="none" stroke="#1565C0" rx="0" /><rect x="507" y="417" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="662" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="877" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="1039" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="557" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="580" fill="#1565C0">opt | Invoice identity or final status needs consultation</text><rect x="38" y="258" width="954" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Automatic collection is the baseline. A customer refresh joins the same work. Check recipient permission</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">before protected calls.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="336" fill="#626262">RSD-01/02; SPFE-S02 Articles 9–11</text><rect x="38" y="1156" width="954" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1180" fill="#626262">Commit only the covered items with saved source/classification or approved ignore results. Preserve</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1203" fill="#626262">SECUENCE_ID; exact continuation, authority and business formats still need confirmation.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1234" fill="#626262">RET-G03/06; SPFE-S08</text><rect x="142" y="354" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="372" fill="#1565C0">[Spain] SPFE-S03/S15; RET-G06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="396" fill="#1565C0">GetRegisteredInvoice / QUERYBYFILTER</text><path d="M 130,417 L 507,417" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,411 L 507,417 L 495,423 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="435" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="453" fill="#1565C0">[Spain] SPFE-S03/S15; RET-G06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="477" fill="#1565C0">Presentation-date results and</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="500" fill="#1565C0">continuation evidence</text><path d="M 507,521 L 130,521" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,515 L 130,521 L 142,527" fill="none" stroke="#1565C0" /><rect x="142" y="599" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="617" fill="#1565C0">[Spain] SPFE-S03/S14</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="641" fill="#1565C0">GetInvoices / QUERYBYID</text><path d="M 130,662 L 507,662" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,656 L 507,662 L 495,668 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="680" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="698" fill="#1565C0">[Spain] SPFE-S03/S14</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="722" fill="#1565C0">Invoice identity/status metadata</text><path d="M 507,743 L 130,743" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,737 L 130,743 L 142,749" fill="none" stroke="#1565C0" /><rect x="142" y="791" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="809" fill="#1565C0">[Spain] SPFE-S03/S12/S13</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="833" fill="#1565C0">DownloadInvoicesByLOC OR</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="856" fill="#1565C0">DownloadInvoicesByID</text><path d="M 130,877 L 507,877" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,871 L 507,877 L 495,883 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="895" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="913" fill="#1565C0">[Spain] SPFE-S03/S12/S13</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="937" fill="#1565C0">Files and separate item failures</text><path d="M 507,958 L 130,958" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,952 L 130,958 L 142,964" fill="none" stroke="#1565C0" /><rect x="142" y="976" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="994" fill="#1565C0">[Proposed] RSD-04–06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="1018" fill="#1565C0">Save source files and receiving classification</text><path d="M 130,1039 L 892,1039" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1033 L 892,1039 L 880,1045 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="1057" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="1075" fill="#1565C0">[Proposed] RSD-04–06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="1099" fill="#1565C0">Saved results; incomplete items keep progress pending</text><path d="M 892,1120 L 130,1120" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1114 L 130,1120 L 142,1126" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1318" fill="#626262">Solid: request. Dashed: result. Grey bars show handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1341" fill="#626262">Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>