<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Protected certificate use and evidence</title><desc id="desc">Freeze the exact actor, policy, material version and input before key use; reconcile an uncertain result. A timeout after possible key use is not a fresh signing request. Reconcile the original operation; only durable evidence permits success.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Protected certificate use and evidence</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">Freeze the exact actor, policy, material version and input before key use; reconcile an uncertain result.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE ORCHESTRATION</text><text x="145" y="374" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">TRUST</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">IDENTITY / CUSTODY</text><text x="145" y="569" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">EXTERNAL</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SECURITY / OPERATIONS</text><text x="145" y="759" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">EVIDENCE</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; CONTEXT</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">POLICY &amp; AUTHORITY</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">MATERIAL &amp; VALIDATION</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">RESULT &amp; CONTINUITY</text><polyline points="425,264 425,393 625,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="855,393 940,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1180,393 1220,393 1220,591 1270,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1174.0" y="441" width="82" height="22" fill="white" opacity=".96"/><text x="1215" y="457" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">pass</text><polyline points="1500,591 1580,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1820,591 1850,591 1850,798 1900,798" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1808.0" y="643" width="92" height="22" fill="white" opacity=".96"/><text x="1854" y="659" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">confirmed</text><polyline points="1700,548 1700,475 2170,475 2170,393 2220,393" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1923.0" y="443" width="84" height="22" fill="white" opacity=".96"/><text x="1965" y="459" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">rejected</text><polyline points="2130,798 2170,798 2170,393 2220,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="2450,393 2490,393 2490,221 2540,221" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1060,350 1060,264" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1064.0" y="277" width="82" height="22" fill="white" opacity=".96"/><text x="1105" y="293" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">blocked</text><polyline points="1700,638 1700,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1699.0" y="682" width="82" height="22" fill="white" opacity=".96"/><text x="1740" y="698" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">unknown</text><polyline points="1820,798 1900,798" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1814.0" y="766" width="92" height="22" fill="white" opacity=".96"/><text x="1860" y="782" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">if proven</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">START</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Final representation</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Exact bytes and input hash</text><rect x="625" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="740.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-06</text><text x="740.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Freeze trust plan</text><text x="740.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Actor, authority, policy, version</text><polygon points="1060.0,350 1180,395.0 1060.0,440 940,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2"/><text x="1060.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1060.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Use-time checks pass?</text><text x="1060.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Scope, status and suspension</text><rect x="1270" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1385.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">INT-06</text><text x="1385.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Invoke protected use</text><text x="1385.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Same operation ID and hash</text><polygon points="1700.0,548 1820,593.0 1700.0,638 1580,593.0" fill="#d7d7d7" stroke="#333333" stroke-width="2"/><text x="1700.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1700.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Outcome known?</text><text x="1700.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Confirmed, rejected or unknown</text><rect x="1900" y="755" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2015.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-07</text><text x="2015.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Persist evidence</text><text x="2015.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Signed bytes, chain, time, policy</text><rect x="2220" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2335.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">RESULT</text><text x="2335.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Return trust result</text><text x="2335.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Evidence reference, no key</text><ellipse cx="2655.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2655.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2655.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Show safe status</text><text x="2655.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Signing is not delivery</text><polygon points="964,178 1156,178 1180,221.0 1156,264 964,264 940,221.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1060.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">BLOCK</text><text x="1060.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Stop affected use</text><text x="1060.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Reason and owner; no key operation</text><polygon points="1604,755 1796,755 1820,798.0 1796,841 1604,841 1580,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1700.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-09</text><text x="1700.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Reconcile original</text><text x="1700.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Query custodian operation ID</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">A timeout after possible key use is not a fresh signing request. Reconcile the original operation; only durable evidence permits success.</text></svg>