<svg xmlns="http://www.w3.org/2000/svg" aria-label="Private setup: reuse or connect an account" width="1030" height="1892" viewBox="0 0 1030 1892" role="img"><title>Private setup: reuse or connect an account</title><desc>Later phase: keep the chosen provider; add only missing Sage setup. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services. Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</desc><rect width="1030" height="1892" fill="white" /><rect x="8" y="8" width="1014" height="1876" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Private setup: reuse or connect an account</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Later phase: keep the chosen provider; add only missing Sage setup</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1766" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">ERP / product</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">Setup screen</text><path d="M 515,216 L 515,1766" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#626262">Sage</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,1766" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Private provider</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">Customer account</text><rect x="24" y="348" width="982" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="677" width="982" height="499" fill="none" stroke="#1565C0" rx="0" /><rect x="507" y="514" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="828" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="1059" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1320" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1528" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="348" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="371" fill="#1565C0">ref | First: reuse the SXS dataset; permission and required credential checks pass (2.1)</text><rect x="24" y="677" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="700" fill="#1565C0">opt | Connect only for missing setup; confirm provider support, permission and earlier-invoice access</text><rect x="38" y="258" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Start: the customer keeps a supported private provider. Inputs: datasetId, accessPointId and the provider</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">account.</text><rect x="38" y="1668" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1692" fill="#626262">End: reuse matching setup; otherwise follow each address status. IN_PROGRESS/RETRYING means wait and observe.</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1715" fill="#626262">Route activation is separate.</text><rect x="142" y="428" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="446" fill="#626262">[Existing] API-02 / FR-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="470" fill="#626262">Find this dataset's connections</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="493" fill="#626262">GET /datasets/{datasetId}/accesspoints</text><path d="M 130,514 L 507,514" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,508 L 507,514 L 495,520 Z" fill="#626262" stroke="#626262" /><rect x="142" y="532" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="550" fill="#626262">FR-02 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="574" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="597" fill="#626262">Entries per access point</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="620" fill="#626262">Each status + connectionId (or null)</text><path d="M 507,641 L 130,641" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,635 L 130,641 L 142,647" fill="none" stroke="#626262" /><rect x="142" y="719" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="737" fill="#626262">[Existing] API-03 / FR-03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="761" fill="#626262">Create the missing connection</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="784" fill="#626262">POST /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="807" fill="#626262">datasets/{datasetId}/connect</text><path d="M 130,828 L 507,828" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,822 L 507,828 L 495,834 Z" fill="#626262" stroke="#626262" /><rect x="142" y="846" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="864" fill="#626262">FR-03 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="888" fill="#626262">201 Created</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="911" fill="#626262">Save data.id as connectionId</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="934" fill="#626262">Setup may still be IN_PROGRESS</text><path d="M 507,955 L 130,955" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,949 L 130,955 L 142,961" fill="none" stroke="#626262" /><rect x="527" y="973" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="991" fill="#1565C0">[To confirm] Provider contract / timing</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1015" fill="#1565C0">Link the chosen provider account</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1038" fill="#1565C0">Provider method still to confirm</text><path d="M 515,1059 L 892,1059" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1053 L 892,1059 L 880,1065 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1077" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1095" fill="#1565C0">[To confirm] Provider contract / timing</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1119" fill="#1565C0">Account linked, pending or failed</text><path d="M 892,1140 L 515,1140" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1134 L 515,1140 L 527,1146" fill="none" stroke="#1565C0" /><rect x="142" y="1188" width="361" height="123" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1206" fill="#626262">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1230" fill="#626262">Read each address's setup status</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1253" fill="#626262">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1276" fill="#626262">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1299" fill="#626262">{connectionId}/</text><path d="M 130,1320 L 507,1320" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1314 L 507,1320 L 495,1326 Z" fill="#626262" stroke="#626262" /><rect x="142" y="1338" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1356" fill="#626262">FR-04 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1380" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1403" fill="#626262">Each address: status + errorCode</text><path d="M 507,1424 L 130,1424" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1418 L 130,1424 L 142,1430" fill="none" stroke="#626262" /><rect x="142" y="1442" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1460" fill="#1565C0">[To confirm] Setup request; ONB-06/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1484" fill="#1565C0">Check whether setup is complete</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1507" fill="#1565C0">for the requested functions</text><path d="M 130,1528 L 507,1528" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1522 L 507,1528 L 495,1534 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="1546" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1564" fill="#1565C0">[Setup result] ONB-06/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1588" fill="#1565C0">Setup result + missing item/owner</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1611" fill="#1565C0">Route activation is separate</text><path d="M 507,1632 L 130,1632" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1626 L 130,1632 L 142,1638" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1806" fill="#626262">Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1829" fill="#626262">Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1852" fill="#626262">activation is separate.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>