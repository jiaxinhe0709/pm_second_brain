<svg xmlns="http://www.w3.org/2000/svg" aria-label="Private setup: reuse or connect an account" width="1030" height="2498" viewBox="0 0 1030 2498" role="img"><title>Private setup: reuse or connect an account</title><desc>Later phase: keep the chosen provider; add only missing Sage setup. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services. Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</desc><rect width="1030" height="2498" fill="white" /><rect x="8" y="8" width="1014" height="2482" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Private setup: reuse or connect an account</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Later phase: keep the chosen provider; add only missing Sage setup</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,2372" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">ERP / product</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">Setup screen</text><path d="M 515,216 L 515,2372" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#626262">Sage</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,2372" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Private provider</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">Selected account</text><rect x="24" y="348" width="982" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="446" width="982" height="291" fill="none" stroke="#626262" rx="0" /><rect x="24" y="879" width="982" height="172" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1081" width="982" height="499" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1610" width="982" height="314" fill="none" stroke="#1565C0" rx="0" /><rect x="507" y="574" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1232" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="1463" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1784" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="2134" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="348" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="371" fill="#1565C0">ref | First: reuse the SXS dataset; permission and required credential checks pass (3.1)</text><rect x="24" y="446" width="982" height="34" fill="#FAFAFA" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="469" fill="#626262">opt | Read saved connections only for missing, stale or changed setup evidence</text><rect x="24" y="879" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="902" fill="#1565C0">opt | No account on the chosen platform: complete qualified provider onboarding first</text><rect x="24" y="1081" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1104" fill="#1565C0">opt | Connect only for missing setup; confirm provider support, permission and earlier-invoice access</text><rect x="24" y="1610" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1633" fill="#1565C0">opt | Read progress only for pending work or missing/stale connection evidence</text><rect x="38" y="258" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Start: the selected business/client uses a chosen supported private platform. Keep a valid account or complete</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">its qualified onboarding; then connect to Sage. Inputs: resolved dataset, chosen service and account evidence.</text><rect x="38" y="767" width="954" height="88" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="791" fill="#626262">Assess the account on the chosen platform for the selected business/client. An existing provider account may</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="814" fill="#626262">need a Sage connection; a valid Sage connection is reused. An accountant account must cover that client under</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="837" fill="#626262">the qualified provider/authority model.</text><rect x="38" y="939" width="954" height="88" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="963" fill="#626262">ERP/product presents required provider onboarding or a customer/provider handoff, then resumes the same</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="986" fill="#626262">request with completion evidence. GAP-02/06/08 must qualify the method and owner. Unknown account status or</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1009" fill="#626262">unsupported onboarding remains pending; do not assume account absence or a create-account API. ONB-05.</text><rect x="38" y="1954" width="954" height="88" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1978" fill="#626262">Assess access evidence for each requested function before confirming readiness. Reuse matching current</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2001" fill="#626262">evidence; obtain only missing or stale evidence through qualified checks. A connection or provider-account</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2024" fill="#626262">result alone is insufficient. ONB-06; GAP-05/06.</text><rect x="38" y="2274" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2298" fill="#626262">End: reuse matching setup; otherwise follow each address status. IN_PROGRESS/RETRYING means wait and observe.</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2321" fill="#626262">Route activation is separate.</text><rect x="142" y="488" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="506" fill="#626262">[Existing] API-02 / FR-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="530" fill="#626262">Find this dataset's connections</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="553" fill="#626262">GET /datasets/{datasetId}/accesspoints</text><path d="M 130,574 L 507,574" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,568 L 507,574 L 495,580 Z" fill="#626262" stroke="#626262" /><rect x="142" y="592" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="610" fill="#626262">FR-02 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="634" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="657" fill="#626262">Entries per access point</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="680" fill="#626262">Each status + connectionId (or null)</text><path d="M 507,701 L 130,701" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,695 L 130,701 L 142,707" fill="none" stroke="#626262" /><rect x="142" y="1123" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1141" fill="#626262">[Existing] API-03 / FR-03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1165" fill="#626262">Create the missing connection</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1188" fill="#626262">POST /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1211" fill="#626262">datasets/{datasetId}/connect</text><path d="M 130,1232 L 507,1232" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1226 L 507,1232 L 495,1238 Z" fill="#626262" stroke="#626262" /><rect x="142" y="1250" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1268" fill="#626262">FR-03 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1292" fill="#626262">201 Created</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1315" fill="#626262">Save data.id as connectionId</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1338" fill="#626262">Setup may still be IN_PROGRESS</text><path d="M 507,1359 L 130,1359" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1353 L 130,1359 L 142,1365" fill="none" stroke="#626262" /><rect x="527" y="1377" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1395" fill="#1565C0">[To confirm] Provider contract / timing</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1419" fill="#1565C0">Link the chosen provider account</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1442" fill="#1565C0">Provider method still to confirm</text><path d="M 515,1463 L 892,1463" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1457 L 892,1463 L 880,1469 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1481" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1499" fill="#1565C0">[To confirm] Provider contract / timing</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1523" fill="#1565C0">Account linked, pending or failed</text><path d="M 892,1544 L 515,1544" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1538 L 515,1544 L 527,1550" fill="none" stroke="#1565C0" /><rect x="142" y="1652" width="361" height="123" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1670" fill="#626262">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1694" fill="#626262">Read each address's setup status</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1717" fill="#626262">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1740" fill="#626262">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1763" fill="#626262">{connectionId}/</text><path d="M 130,1784 L 507,1784" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1778 L 507,1784 L 495,1790 Z" fill="#626262" stroke="#626262" /><rect x="142" y="1802" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1820" fill="#626262">FR-04 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1844" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1867" fill="#626262">Each address: status + errorCode</text><path d="M 507,1888 L 130,1888" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1882 L 130,1888 L 142,1894" fill="none" stroke="#626262" /><rect x="142" y="2048" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2066" fill="#1565C0">[To confirm] Setup request; ONB-06/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2090" fill="#1565C0">Check whether setup is complete</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2113" fill="#1565C0">for the requested functions</text><path d="M 130,2134 L 507,2134" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,2128 L 507,2134 L 495,2140 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="2152" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2170" fill="#1565C0">[Setup result] ONB-06/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2194" fill="#1565C0">Setup result + missing item/owner</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2217" fill="#1565C0">Route activation is separate</text><path d="M 507,2238 L 130,2238" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2232 L 130,2238 L 142,2244" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2412" fill="#626262">Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2435" fill="#626262">Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2458" fill="#626262">activation is separate.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>