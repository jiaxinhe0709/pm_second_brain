<svg aria-label="French lifecycle request, completion and history" xmlns="http://www.w3.org/2000/svg" width="1030" height="1565" viewBox="0 0 1030 1565" role="img"><title>French lifecycle request, completion and history</title><desc>Guide-evidenced product calls; selected build and Spain coverage remain unqualified. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests or deliveries. Dashed arrows: paired results. Grey bars show handling, not elapsed time. Guide/PRE transport: supplied evidence. Proposed/To qualify: design or missing contract, not deployed coverage.</desc><rect width="1030" height="1565" fill="white" /><rect x="8" y="8" width="1014" height="1549" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">French lifecycle request, completion and history</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Guide-evidenced product calls; selected build and Spain coverage remain unqualified</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1022,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1462" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,1462" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1462" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Notifications</text><rect x="892" y="417" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="602" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="122" y="901" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1200" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="38" y="258" width="954" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#222222">Precondition: connected dataset, existing invoice at the selected access point, correct environment and</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#222222">current represented-business/action authority. Country-specific commands still need qualification.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="336" fill="#888888">INT-LCS01/02; LCS-R04/13; LIF-G01/04</text><rect x="38" y="742" width="954" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="766" fill="#222222">POST statusCode is a UUID. The request uses e-InvoiceStatus and the matching statusAttributes shape. Preserve</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="789" fill="#222222">the required Idempotency-Key; its scope/retention/replay semantics need qualification.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="820" fill="#888888">INT-LCS01; LIF-G04/06</text><rect x="38" y="1018" width="954" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1042" fill="#222222">Finished processing can mean ERROR. Notification data.id is a workflow-status UUID, not proven operation</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1065" fill="#222222">correlation. Do not assume delivery order or successful business/reporting completion.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1096" fill="#888888">INT-LCS02/05; LIF-G05</text><rect x="38" y="1340" width="954" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1364" fill="#222222">Missed notification: recover saved history under the qualified read strategy. External evidence not yet</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1387" fill="#222222">captured needs a separate source consultation. Full history schema and correlation remain open.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1418" fill="#888888">LCS-A10/15/26; LIF-G02/05/06</text><rect x="142" y="354" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="372" fill="#888888">[Guide] INT-LCS02 section 1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="396" fill="#222222">POST /internal/events/subscriptions</text><path d="M 130,417 L 892,417" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,411 L 892,417 L 880,423 Z" fill="#444444" stroke="#444444" /><rect x="142" y="435" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="453" fill="#888888">[Guide] INT-LCS02 section 1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="477" fill="#222222">201: subscription for scoped statusupdated events</text><path d="M 892,498 L 130,498" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,492 L 130,498 L 142,504" fill="none" stroke="#444444" /><rect x="142" y="516" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="534" fill="#888888">[Guide] INT-LCS01 section 1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="558" fill="#222222">POST /datasets/{datasetId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="581" fill="#222222">e-invoices/{e-invoiceId}/status</text><path d="M 130,602 L 507,602" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,596 L 507,602 L 495,608 Z" fill="#444444" stroke="#444444" /><rect x="142" y="620" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="638" fill="#888888">[Guide] INT-LCS01 section 1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="662" fill="#222222">201 Created: operation data.id and</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="685" fill="#222222">echoed status attributes</text><path d="M 507,706 L 130,706" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,700 L 130,706 L 142,712" fill="none" stroke="#444444" /><rect x="142" y="838" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="856" fill="#888888">[Guide] INT-LCS02 section 2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="880" fill="#222222">statusupdated notification; subject = invoice ID</text><path d="M 900,901 L 138,901" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 150,895 L 138,901 L 150,907 Z" fill="#444444" stroke="#444444" /><rect x="142" y="919" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="937" fill="#888888">[To qualify] LIF-G05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="961" fill="#222222">Webhook receipt; authentication and receipt response to qualify</text><path d="M 138,982 L 900,982" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 888,976 L 900,982 L 888,988" fill="none" stroke="#444444" /><rect x="142" y="1114" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1132" fill="#888888">[Guide] INT-LCS02 section 3; INT-ERR01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1156" fill="#222222">GET /datasets/{datasetId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1179" fill="#222222">e-invoices/{e-invoiceId}</text><path d="M 130,1200 L 507,1200" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1194 L 507,1200 L 495,1206 Z" fill="#444444" stroke="#444444" /><rect x="142" y="1218" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1236" fill="#888888">[Guide] INT-LCS02 section 3; INT-ERR01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1260" fill="#222222">Read currentStatus and correlated</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1283" fill="#222222">history outcome/error</text><path d="M 507,1304 L 130,1304" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1298 L 130,1304 L 142,1310" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1502" fill="#888888">Solid arrows: requests or deliveries. Dashed arrows: paired results. Grey bars show handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1525" fill="#888888">Guide/PRE transport: supplied evidence. Proposed/To qualify: design or missing contract, not deployed coverage.</text></svg>