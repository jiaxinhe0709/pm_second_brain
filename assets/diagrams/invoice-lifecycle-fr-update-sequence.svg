<svg xmlns="http://www.w3.org/2000/svg" aria-label="Change invoice status: request and read the result" width="1030" height="1314" viewBox="0 0 1030 1314" role="img"><title>Change invoice status: request and read the result</title><desc>Existing E-Invoice API; Spain actions and fields need confirmation. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid: request. Dashed: result. Grey bars show handling, not elapsed time. Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</desc><rect width="1030" height="1314" fill="white" /><rect x="8" y="8" width="1014" height="1298" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Change invoice status: request and read the result</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Existing E-Invoice API; Spain actions and fields need confirmation</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1211" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#626262">ERP / product</text><path d="M 515,216 L 515,1211" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,1211" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#626262">Events</text><rect x="892" y="417" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="602" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="122" y="764" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="949" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="38" y="258" width="954" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Start with an existing invoice, dataset/platform binding and current business/action permission. Use the</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">selected action UUID and fields.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="336" fill="#626262">LCS-R04/13; LIF-G01/04</text><rect x="38" y="1089" width="954" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1113" fill="#626262">A completion event can report failure. Match the original attempt before recovery; a missed event uses saved</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1136" fill="#626262">history. Keep Idempotency-Key semantics and full correlation open.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1167" fill="#626262">LCS-R14; LIF-G05/06</text><rect x="142" y="354" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="372" fill="#626262">[Existing] INT-LCS02 §1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="396" fill="#626262">POST /internal/events/subscriptions</text><path d="M 130,417 L 892,417" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,411 L 892,417 L 880,423 Z" fill="#626262" stroke="#626262" /><rect x="142" y="435" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="453" fill="#626262">[Existing] INT-LCS02 §1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="477" fill="#626262">Subscription for scoped statusupdated events</text><path d="M 892,498 L 130,498" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,492 L 130,498 L 142,504" fill="none" stroke="#626262" /><rect x="142" y="516" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="534" fill="#626262">[Existing] INT-LCS01 §1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="558" fill="#626262">POST /datasets/{datasetId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="581" fill="#626262">e-invoices/{e-invoiceId}/status</text><path d="M 130,602 L 507,602" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,596 L 507,602 L 495,608 Z" fill="#626262" stroke="#626262" /><rect x="142" y="620" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="638" fill="#626262">[Existing] INT-LCS01 §1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="662" fill="#626262">201 Created: save operation data.id</text><path d="M 507,683 L 130,683" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,677 L 130,683 L 142,689" fill="none" stroke="#626262" /><rect x="142" y="701" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="719" fill="#626262">[Existing] INT-LCS02 §2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="743" fill="#626262">Status-updated event: subject = invoice ID</text><path d="M 900,764 L 138,764" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 150,758 L 138,764 L 150,770 Z" fill="#626262" stroke="#626262" /><rect x="142" y="782" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="800" fill="#626262">[Existing] INT-LCS02 §2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="824" fill="#626262">Event receipt; exact response to confirm</text><path d="M 138,845 L 900,845" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 888,839 L 900,845 L 888,851" fill="none" stroke="#626262" /><rect x="142" y="863" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="881" fill="#626262">[Existing] INT-LCS02 §3; INT-ERR01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="905" fill="#626262">GET /datasets/{datasetId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="928" fill="#626262">e-invoices/{e-invoiceId}</text><path d="M 130,949 L 507,949" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,943 L 507,949 L 495,955 Z" fill="#626262" stroke="#626262" /><rect x="142" y="967" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="985" fill="#626262">[Existing] INT-LCS02 §3; INT-ERR01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1009" fill="#626262">Current status and the matching history</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1032" fill="#626262">attempt/error</text><path d="M 507,1053 L 130,1053" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1047 L 130,1053 L 142,1059" fill="none" stroke="#626262" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1251" fill="#626262">Solid: request. Dashed: result. Grey bars show handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1274" fill="#626262">Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>