ll="#222222">Valid setup</text><text x="380" y="490" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Public</text><text x="720" y="490" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Private</text><text x="1060" y="490" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Needs action</text><text x="28" y="875" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Return a result for each function, including partial results and remaining actions.</text><text x="28" y="1050" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Phase 1 checks public readiness. Later-phase private work requires qualified contracts and approved scope.</text><text x="28" y="1074" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Activation requires current readiness, explicit authority and an approved effective boundary.</text><text x="28" y="1098" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Preserve valid unaffected functions. Invoice features enforce required public-copy and reporting dependencies.</text></svg>