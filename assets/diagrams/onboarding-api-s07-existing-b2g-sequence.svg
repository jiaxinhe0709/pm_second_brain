e" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2126 L 130,2132 L 142,2138" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2330" fill="#888888">Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2353" fill="#888888">Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be qualified.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2376" fill="#888888">HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects under ONB-08.</text></svg>