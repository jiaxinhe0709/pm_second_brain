y="688" width="1728" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="711" fill="#222222">opt | A known connection needs detail</text><rect x="24" y="443" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="466" fill="#222222">opt | Known authorised dataset; inspect Sage setup only</text><rect x="24" y="1328" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1351" fill="#222222">opt | Certificate required for the selected purpose; use current evidence</text><rect x="38" y="1707" width="1724" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1731" fill="#222222">Continue dependent checks only after valid NIF, current action authority and required certificate readiness</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1754" fill="#222222">pass.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1785" fill="#888888">ONB-02/03/08 | Unconfirmed evidence holds only dependent work</text><rect x="38" y="2168" width="1724" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2192" fill="#222222">Keep B2G intact. Missing B2B setup follows S01/S03 within its own phase and route gates; B2G credentials do</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2215" fill="#222222">not prove B2B fitness.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="2246" fill="#888888">ONB-S07 | No B2G update or disconnection in this sequence</text><rect x="142" y="240" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="258" fill="#888888">[Existing] API-01 / FR-01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="282" fill="#222222">GET /accesspoints</text><path d="M 130,303 L 507,303" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,297 L 507,303 L 495,309 Z" fill="#444444" stroke="#444444" /><rect x="142" y="321" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="339" fill="#888888">FR-01 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="363" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="386" fill="#222222">Access-point IDs and names</text><path d="M 507,407 L 130,407" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,401 L 130,407 L 142,413" fill="none" stroke="#444444" /><rect x="142" y="485" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="503" fill="#888888">[Existing] API-02 / FR-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="527" fill="#222222">GET /datasets/{datasetId}/accesspoints</text><path d="M 130,548 L 507,548" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,542 L 507,548 L 495,554 Z" fill="#444444" stroke="#444444" /><rect x="142" y="566" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="584" fill="#888888">FR-02 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="608" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="631" fill="#222222">Status + connectionId (or null)</text><path d="M 507,652 L 130,652" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,646 L 130,652 L 142,658" fill="none" stroke="#444444" /><rect x="142" y="730" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="748" fill="#888888">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="772" fill="#222222">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="795" fill="#222222">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="818" fill="#222222">{connectionId}/</text><path d="M 130,839 L 507,839" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,833 L 507,839 L 495,845 Z" fill="#444444" stroke="#444444" /><rect x="142" y="857" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="875" fill="#888888">FR-04 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="899" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="922" fill="#222222">Per-address status and errors</text><path d="M 507,943 L 130,943" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,937 L 130,943 L 142,949" fill="none" stroke="#444444" /><rect x="142" y="1021" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1039" fill="#888888">[To qualify] Logical request; ONB-02/03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1063" fill="#222222">Assess prerequisites</text><path d="M 130,1084 L 507,1084" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1078 L 507,1084 L 495,1090 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1102" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1120" fill="#888888">[To qualify] Identity contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1144" fill="#222222">Check business NIF</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1167" fill="#222222">and action authority</text><path d="M 523,1188 L 892,1188" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1182 L 892,1188 L 880,1194 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1206" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1224" fill="#888888">[To qualify] Identity contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1248" fill="#222222">NIF + authority evidence</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1271" fill="#222222">or an owned action</text><path d="M 892,1292 L 523,1292" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1286 L 523,1292 L 535,1298" fill="none" stroke="#444444" /><rect x="527" y="1370" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1388" fill="#888888">[To qualify] Tax Service; CERT-05</text><text 