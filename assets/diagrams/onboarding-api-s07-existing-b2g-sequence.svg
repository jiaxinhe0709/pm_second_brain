<svg aria-label="ONB-S07 - Existing B2G use" xmlns="http://www.w3.org/2000/svg" width="1800" height="2416" viewBox="0 0 1800 2416" role="img"><title>ONB-S07 - Existing B2G use</title><desc>Assess B2B independently and keep the B2G service intact. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale. Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be qualified. HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects under ONB-08.</desc><rect width="1800" height="2416" fill="white" /><rect x="8" y="8" width="1784" height="2400" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">ONB-S07 - Existing B2G use</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Assess B2B independently and keep the B2G service intact</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1792,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,2290" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">Product</text><path d="M 515,216 L 515,2290" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" 