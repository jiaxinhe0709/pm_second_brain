<svg xmlns="http://www.w3.org/2000/svg" aria-label="Change setup: keep what already works" width="1030" height="3117" viewBox="0 0 1030 3117" role="img"><title>Change setup: keep what already works</title><desc>Add a supported function or make an enabled change; Private A to Private B is disabled. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services. Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</desc><rect width="1030" height="3117" fill="white" /><rect x="8" y="8" width="1014" height="3101" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Change setup: keep what already works</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Add a supported function or make an enabled change; Private A to Private B is disabled</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,2991" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">ERP / product</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">Setup screen</text><path d="M 515,216 L 515,2991" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#626262">Sage</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,2991" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Routing owner</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">Future invoice route</text><rect x="24" y="348" width="982" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="550" width="982" height="268" fill="none" stroke="#1565C0" rx="0" /><rect x="36" y="989" width="958" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="36" y="1087" width="958" height="337" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="929" width="982" height="525" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1484" width="982" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1582" width="982" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="36" y="2276" width="958" height="268" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1904" width="982" height="774" fill="none" stroke="#1565C0" rx="0" /><rect x="892" y="678" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="514" width="16" height="379" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1261" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="2136" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="2404" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="2032" width="16" height="610" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="2753" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="348" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="371" fill="#1565C0">ref | First: keep the SXS dataset; recheck only affected permission/credential evidence (3.1)</text><rect x="24" y="550" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="573" fill="#1565C0">opt | If the change affects routing or access to earlier invoices</text><rect x="36" y="989" width="958" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="1012" fill="#1565C0">ref | Private target: use setup (3.3) only if its connection is missing</text><rect x="36" y="1087" width="958" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="1110" fill="#1565C0">opt | Update only if this provider/API supports the requested edit</text><rect x="24" y="929" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="952" fill="#1565C0">opt | Missing or changed configuration; apply only allowed, supported setup work</text><rect x="24" y="1484" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1507" fill="#1565C0">ref | If public functions are selected: confirm target access using public readiness (3.2)</text><rect x="24" y="1582" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1605" fill="#1565C0">ref | If private functions are selected: confirm target access using private setup (3.3)</text><rect x="36" y="2276" width="958" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="2299" fill="#1565C0">opt | Current checks pass; reject stale or competing changes</text><rect x="24" y="1904" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1927" fill="#1565C0">opt | Platform use requested, enabled and confirmed; required target readiness passed</text><rect x="38" y="258" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Start: the customer requests a setup or platform-use change. Inputs: business, requested functions,</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">environment and existing setup references where present.</text><rect x="38" y="1680" width="954" height="88" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1704" fill="#626262">Assess target readiness after any setup edit. Reuse valid setup and matching current evidence; do not repeat</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1727" fill="#626262">completed work. Failed or pending dependencies block affected activation. Keep independent successful results.</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1750" fill="#626262">ONB-04/06/08.</text><rect x="38" y="1792" width="954" height="88" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1816" fill="#626262">ERP/product presents the platform choice, scope, agreed start and earlier-invoice impact for confirmation.</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1839" fill="#626262">Setup-only requests return results without activation. A ready target can proceed without another</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1862" fill="#626262">configuration edit. Private A to Private B stays disabled. ONB-07/11.</text><rect x="38" y="2893" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2917" fill="#626262">End: retain unchanged setup or return the confirmed change and its effective boundary. Keep earlier-invoice</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2940" fill="#626262">access; hold unknown results.</text><rect x="142" y="428" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="446" fill="#1565C0">[To confirm] Setup request; ONB-05/07</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="470" fill="#1565C0">Check the requested setup change</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="493" fill="#1565C0">Business + connection + change</text><path d="M 130,514 L 507,514" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,508 L 507,514 L 495,520 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="592" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="610" fill="#1565C0">[To confirm] Change permission / earlier access</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="634" fill="#1565C0">Check permission, required readiness,</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="657" fill="#1565C0">start and earlier-invoice access</text><path d="M 523,678 L 892,678" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,672 L 892,678 L 880,684 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="696" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="714" fill="#1565C0">[To confirm] Change permission / earlier access</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="738" fill="#1565C0">Change allowed or blocked</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="761" fill="#1565C0">with reason + action owner</text><path d="M 892,782 L 523,782" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,776 L 523,782 L 535,788" fill="none" stroke="#1565C0" /><rect x="142" y="830" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="848" fill="#1565C0">[Setup result] ONB-07/09</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="872" fill="#1565C0">Allowed change or reason + owner</text><path d="M 507,893 L 130,893" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,887 L 130,893 L 142,899" fill="none" stroke="#1565C0" /><rect x="142" y="1129" width="361" height="123" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1147" fill="#626262">[Existing] API-05 / FR-05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1171" fill="#626262">Update supported setup details</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1194" fill="#626262">PUT /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1217" fill="#626262">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1240" fill="#626262">{connectionId}/</text><path d="M 130,1261 L 507,1261" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1255 L 507,1261 L 495,1267 Z" fill="#626262" stroke="#626262" /><rect x="142" y="1279" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1297" fill="#626262">FR-05 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1321" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1344" fill="#626262">Updated connection/address details</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1367" fill="#626262">Route activation is separate</text><path d="M 507,1388 L 130,1388" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1382 L 130,1388 L 142,1394" fill="none" stroke="#626262" /><rect x="142" y="1946" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1964" fill="#1565C0">[To confirm] Platform-use request; ONB-07</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1988" fill="#1565C0">Submit confirmed platform use</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2011" fill="#1565C0">Requested scope + agreed start</text><path d="M 130,2032 L 507,2032" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,2026 L 507,2032 L 495,2038 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="2050" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="2068" fill="#1565C0">[To confirm] Activation controls; ONB-07/09</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="2092" fill="#1565C0">Recheck permission, readiness,</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="2115" fill="#1565C0">start and earlier-invoice access</text><path d="M 523,2136 L 892,2136" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,2130 L 892,2136 L 880,2142 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="2154" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="2172" fill="#1565C0">[To confirm] Activation controls; ONB-07/09</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="2196" fill="#1565C0">Allowed or blocked</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="2219" fill="#1565C0">with reason + action owner</text><path d="M 892,2240 L 523,2240" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,2234 L 523,2240 L 535,2246" fill="none" stroke="#1565C0" /><rect x="527" y="2318" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="2336" fill="#1565C0">[To confirm] Route change method</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="2360" fill="#1565C0">Apply the authorised route change</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="2383" fill="#1565C0">and check what actually changed</text><path d="M 523,2404 L 892,2404" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,2398 L 892,2404 L 880,2410 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="2422" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="2440" fill="#1565C0">[To confirm] Route change method</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="2464" fill="#1565C0">Effective boundary + earlier access</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="2487" fill="#1565C0">or result still unknown</text><path d="M 892,2508 L 523,2508" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,2502 L 523,2508 L 535,2514" fill="none" stroke="#1565C0" /><rect x="142" y="2556" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2574" fill="#1565C0">[Setup result] ONB-07/08/09/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2598" fill="#1565C0">Confirmed effective start</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2621" fill="#1565C0">or blocked/pending + action owner</text><path d="M 507,2642 L 130,2642" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2636 L 130,2642 L 142,2648" fill="none" stroke="#1565C0" /><rect x="142" y="2690" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2708" fill="#1565C0">[To confirm] Setup request; ONB-11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2732" fill="#1565C0">Read the result of this change</text><path d="M 130,2753 L 507,2753" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,2747 L 507,2753 L 495,2759 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="2771" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2789" fill="#1565C0">[Setup result] ONB-07/09/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2813" fill="#1565C0">Confirmed result or pending action</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2836" fill="#1565C0">with its owner</text><path d="M 507,2857 L 130,2857" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2851 L 130,2857 L 142,2863" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="3031" fill="#626262">Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="3054" fill="#626262">Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="3077" fill="#626262">activation is separate.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>