<svg xmlns="http://www.w3.org/2000/svg" aria-label="Change setup: keep what already works" width="1030" height="2281" viewBox="0 0 1030 2281" role="img"><title>Change setup: keep what already works</title><desc>Add a supported function or make an enabled change; Private A to Private B is disabled. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services. Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</desc><rect width="1030" height="2281" fill="white" /><rect x="8" y="8" width="1014" height="2265" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Change setup: keep what already works</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Add a supported function or make an enabled change; Private A to Private B is disabled</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,2155" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">ERP / product</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">Setup screen</text><path d="M 515,216 L 515,2155" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#626262">Sage</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,2155" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Routing owner</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">Future invoice route</text><rect x="24" y="326" width="982" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="528" width="982" height="268" fill="none" stroke="#1565C0" rx="0" /><rect x="36" y="1079" width="958" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="36" y="1177" width="958" height="337" fill="none" stroke="#1565C0" rx="0" /><rect x="36" y="1544" width="958" height="268" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1019" width="982" height="823" fill="none" stroke="#1565C0" rx="0" /><rect x="892" y="656" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="492" width="16" height="379" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1351" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="1672" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1917" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="326" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="349" fill="#1565C0">ref | First: keep the SXS dataset; recheck only affected permission/credential evidence (2.1)</text><rect x="24" y="528" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="551" fill="#1565C0">opt | If the change affects routing or access to earlier invoices</text><rect x="36" y="1079" width="958" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="1102" fill="#1565C0">ref | Use private setup (2.3) only for a missing target connection</text><rect x="36" y="1177" width="958" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="1200" fill="#1565C0">opt | Update only if this provider/API supports the requested edit</text><rect x="36" y="1544" width="958" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="1567" fill="#1565C0">opt | If an authorised routing change is needed and its result can be checked</text><rect x="24" y="1019" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1042" fill="#1565C0">opt | Apply only an allowed change; skip unchanged setup; Private A to Private B disabled</text><rect x="38" y="258" width="954" height="44" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Start: the customer requests a setup change. Inputs: business, existing connection and the requested change.</text><rect x="38" y="907" width="954" height="88" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="931" fill="#626262">ERP/product presents the allowed scope, start and earlier-invoice impact. Submit platform use only if</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="954" fill="#626262">requested, enabled and confirmed. Setup-only work keeps any selection unchanged; if none exists, it activates</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="977" fill="#626262">none. ONB-07/11.</text><rect x="38" y="2057" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2081" fill="#626262">End: retain unchanged setup or return the confirmed change and its effective boundary. Keep earlier-invoice</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2104" fill="#626262">access; hold unknown results.</text><rect x="142" y="406" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="424" fill="#1565C0">[To confirm] Setup request; ONB-05/07</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="448" fill="#1565C0">Check the requested setup change</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="471" fill="#1565C0">Business + connection + change</text><path d="M 130,492 L 507,492" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,486 L 507,492 L 495,498 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="570" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="588" fill="#1565C0">[To confirm] Change permission / earlier access</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="612" fill="#1565C0">Check change permission, when it</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="635" fill="#1565C0">takes effect and earlier access</text><path d="M 523,656 L 892,656" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,650 L 892,656 L 880,662 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="674" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="692" fill="#1565C0">[To confirm] Change permission / earlier access</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="716" fill="#1565C0">Change allowed or blocked</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="739" fill="#1565C0">with reason + action owner</text><path d="M 892,760 L 523,760" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,754 L 523,760 L 535,766" fill="none" stroke="#1565C0" /><rect x="142" y="808" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="826" fill="#1565C0">[Setup result] ONB-07/09</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="850" fill="#1565C0">Allowed change or reason + owner</text><path d="M 507,871 L 130,871" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,865 L 130,871 L 142,877" fill="none" stroke="#1565C0" /><rect x="142" y="1219" width="361" height="123" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1237" fill="#626262">[Existing] API-05 / FR-05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1261" fill="#626262">Update supported setup details</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1284" fill="#626262">PUT /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1307" fill="#626262">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1330" fill="#626262">{connectionId}/</text><path d="M 130,1351 L 507,1351" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1345 L 507,1351 L 495,1357 Z" fill="#626262" stroke="#626262" /><rect x="142" y="1369" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1387" fill="#626262">FR-05 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1411" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1434" fill="#626262">Updated connection/address details</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1457" fill="#626262">Route activation is separate</text><path d="M 507,1478 L 130,1478" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1472 L 130,1478 L 142,1484" fill="none" stroke="#626262" /><rect x="527" y="1586" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1604" fill="#1565C0">[To confirm] Route change method</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1628" fill="#1565C0">Apply the authorised route change</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1651" fill="#1565C0">and check what actually changed</text><path d="M 515,1672 L 892,1672" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1666 L 892,1672 L 880,1678 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1690" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1708" fill="#1565C0">[To confirm] Route change method</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1732" fill="#1565C0">Effective boundary + earlier access</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1755" fill="#1565C0">or result still unknown</text><path d="M 892,1776 L 515,1776" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1770 L 515,1776 L 527,1782" fill="none" stroke="#1565C0" /><rect x="142" y="1854" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1872" fill="#1565C0">[To confirm] Setup request; ONB-11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1896" fill="#1565C0">Read the result of this change</text><path d="M 130,1917 L 507,1917" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1911 L 507,1917 L 495,1923 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="1935" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1953" fill="#1565C0">[Setup result] ONB-07/09/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1977" fill="#1565C0">Confirmed result or pending action</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2000" fill="#1565C0">with its owner</text><path d="M 507,2021 L 130,2021" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2015 L 130,2021 L 142,2027" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2195" fill="#626262">Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2218" fill="#626262">Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2241" fill="#626262">activation is separate.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>