<svg aria-label="Expired-link recovery and independent stored-file access" xmlns="http://www.w3.org/2000/svg" width="1415" height="1633" viewBox="0 0 1415 1633" role="img"><title>Expired-link recovery and independent stored-file access</title><desc>Keep invoice/file identity; temporary source links are separate from records access. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time. Existing: supplied guide/transport evidence. To qualify: logical handoff or missing contract; no deployment decision.</desc><rect width="1415" height="1633" fill="white" /><rect x="8" y="8" width="1399" height="1617" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Expired-link recovery and independent stored-file access</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Keep invoice/file identity; temporary source links are separate from records access</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1530" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,1530" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1530" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">File source</text><path d="M 1285,216 L 1285,1530" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Records</text><rect x="24" y="258" width="1367" height="754" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1156" width="1367" height="222" fill="none" stroke="#777777" rx="0" /><rect x="892" y="363" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="548" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="733" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="895" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="1261" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="258" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#222222">opt | Capture is incomplete and the original link has expired</text><rect x="24" y="1156" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1179" fill="#222222">opt | A customer requests an already captured file</text><rect x="38" y="1042" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1066" fill="#222222">Do not assume every 403 is expiry or that renewal proves byte immutability. Verify source role/content</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1089" fill="#222222">binding. Discard capability URLs; retain saved file references and integrity evidence.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1120" fill="#888888">RRI-A03/06; RET-G04</text><rect x="38" y="1408" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1432" fill="#222222">Mapping or ERP failure does not undo verified capture or permitted conservation access. This saved read</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1455" fill="#222222">neither calls the source nor requests format=facturx, creates another invoice or asserts buyer acceptance.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1486" fill="#888888">RRI-A05; RCV-A23; RET-API-A05/08</text><rect x="142" y="300" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="318" fill="#888888">[Existing] INT-RCV01 section 4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="342" fill="#222222">GET {original downloadUrl}</text><path d="M 130,363 L 892,363" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,357 L 892,363 L 880,369 Z" fill="#444444" stroke="#444444" /><rect x="142" y="381" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="399" fill="#888888">[Existing] INT-RCV01 section 4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="423" fill="#222222">403: classify against the actual expiry/error contract</text><path d="M 892,444 L 130,444" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,438 L 130,444 L 142,450" fill="none" stroke="#444444" /><rect x="142" y="462" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="480" fill="#888888">[Existing] INT-RCV01 section 3.1; [To qualify] binding</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="504" fill="#222222">GET /datasets/{datasetId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="527" fill="#222222">e-invoices/{e-invoiceId}</text><path d="M 130,548 L 507,548" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,542 L 507,548 L 495,554 Z" fill="#444444" stroke="#444444" /><rect x="142" y="566" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="584" fill="#888888">[Existing] INT-RCV01 section 3.1; [To qualify] binding</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="608" fill="#222222">200: fresh link for the same intended</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="631" fill="#222222">source-file role</text><path d="M 507,652 L 130,652" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,646 L 130,652 L 142,658" fill="none" stroke="#444444" /><rect x="142" y="670" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="688" fill="#888888">[Existing] INT-RCV01 section 4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="712" fill="#222222">GET {fresh downloadUrl}; no Sage bearer header</text><path d="M 130,733 L 892,733" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,727 L 892,733 L 880,739 Z" fill="#444444" stroke="#444444" /><rect x="142" y="751" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="769" fill="#888888">[Existing] INT-RCV01 section 4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="793" fill="#222222">200: complete bytes; failure keeps capture incomplete</text><path d="M 892,814 L 130,814" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,808 L 130,814 L 142,820" fill="none" stroke="#444444" /><rect x="142" y="832" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="850" fill="#888888">[To qualify] RSD-04; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="874" fill="#222222">Verify/capture bytes under the existing item identity</text><path d="M 130,895 L 1277,895" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,889 L 1277,895 L 1265,901 Z" fill="#444444" stroke="#444444" /><rect x="142" y="913" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="931" fill="#888888">[To qualify] RSD-04; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="955" fill="#222222">Verified receipt or incomplete/conflict state; no second invoice</text><path d="M 1277,976 L 130,976" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,970 L 130,976 L 142,982" fill="none" stroke="#444444" /><rect x="142" y="1198" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1216" fill="#888888">[To qualify] RSD-07/09; no physical endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1240" fill="#222222">Read selected saved file under current action authority</text><path d="M 130,1261 L 1277,1261" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,1255 L 1277,1261 L 1265,1267 Z" fill="#444444" stroke="#444444" /><rect x="142" y="1279" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1297" fill="#888888">[To qualify] RSD-07/09; no physical endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1321" fill="#222222">Labelled safe bytes and audited result, or owned denial/failure</text><path d="M 1277,1342 L 130,1342" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1336 L 130,1342 L 142,1348" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1570" fill="#888888">Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1593" fill="#888888">Existing: supplied guide/transport evidence. To qualify: logical handoff or missing contract; no deployment decision.</text></svg>