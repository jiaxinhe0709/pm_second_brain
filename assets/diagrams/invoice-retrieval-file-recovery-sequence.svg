<svg xmlns="http://www.w3.org/2000/svg" aria-label="Recover a file link or read a saved file" width="1415" height="1334" viewBox="0 0 1415 1334" role="img"><title>Recover a file link or read a saved file</title><desc>Keep the same invoice and file role; recover only missing work. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid: request. Dashed: result. Grey bars show handling, not elapsed time. Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</desc><rect width="1415" height="1334" fill="white" /><rect x="8" y="8" width="1399" height="1318" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Recover a file link or read a saved file</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Keep the same invoice and file role; recover only missing work</text><path d="M 8,124 L 1407,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1231" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#626262">ERP / product</text><path d="M 515,216 L 515,1231" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,1231" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#626262">File source</text><path d="M 1285,216 L 1285,1231" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#626262">Records</text><rect x="24" y="258" width="1367" height="569" fill="none" stroke="#626262" rx="0" /><rect x="24" y="857" width="1367" height="222" fill="none" stroke="#626262" rx="0" /><rect x="507" y="363" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="548" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1277" y="710" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1277" y="962" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="258" width="1367" height="34" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#626262">case | Required file is missing; link expiry is confirmed</text><rect x="24" y="857" width="1367" height="34" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="880" fill="#626262">case | Customer requests an already saved file</text><rect x="38" y="1109" width="1339" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1133" fill="#626262">Not every 403 means expiry. Verify renewed content and retain good files. Saved reads do not refetch or</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1156" fill="#626262">generate Factur-X; mapping/product failure has its own recovery.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1187" fill="#626262">RRI-A03/05/06; RET-G04/05/08</text><rect x="142" y="300" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="318" fill="#626262">[Existing] INT-RCV01 §3.1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="342" fill="#626262">GET existing invoice details</text><path d="M 130,363 L 507,363" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,357 L 507,363 L 495,369 Z" fill="#626262" stroke="#626262" /><rect x="142" y="381" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="399" fill="#626262">[Existing] INT-RCV01 §3.1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="423" fill="#626262">Fresh link for the same required file</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="446" fill="#626262">role</text><path d="M 507,467 L 130,467" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,461 L 130,467 L 142,473" fill="none" stroke="#626262" /><rect x="142" y="485" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="503" fill="#626262">[Existing] INT-RCV01 §4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="527" fill="#626262">GET {fresh downloadUrl}; no Sage bearer</text><path d="M 130,548 L 892,548" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,542 L 892,548 L 880,554 Z" fill="#626262" stroke="#626262" /><rect x="142" y="566" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="584" fill="#626262">[Existing] INT-RCV01 §4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="608" fill="#626262">Complete bytes, or file still pending</text><path d="M 892,629 L 130,629" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,623 L 130,629 L 142,635" fill="none" stroke="#626262" /><rect x="142" y="647" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="665" fill="#1565C0">[Proposed] RSD-04; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="689" fill="#1565C0">Verify and save the missing file</text><path d="M 130,710 L 1277,710" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,704 L 1277,710 L 1265,716 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="728" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="746" fill="#1565C0">[Proposed] RSD-04; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="770" fill="#1565C0">Saved receipt, or content conflict to resolve</text><path d="M 1277,791 L 130,791" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,785 L 130,791 L 142,797" fill="none" stroke="#1565C0" /><rect x="142" y="899" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="917" fill="#1565C0">[Proposed] RSD-07/09; no endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="941" fill="#1565C0">Check current permission and read saved bytes</text><path d="M 130,962 L 1277,962" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,956 L 1277,962 L 1265,968 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="980" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="998" fill="#1565C0">[Proposed] RSD-07/09; no endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1022" fill="#1565C0">Labelled file and audit result, or denial/incident</text><path d="M 1277,1043 L 130,1043" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1037 L 130,1043 L 142,1049" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1271" fill="#626262">Solid: request. Dashed: result. Grey bars show handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1294" fill="#626262">Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>