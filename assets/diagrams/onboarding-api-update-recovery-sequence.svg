nt-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connections/{connectionId}/</text><text x="445.0" y="505" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-05 | Supported change only</text><path d="M 140,517 L 750,517" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,512.0 L 750,517 L 740.0,522.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="554" width="724" height="43" fill="white" stroke="none" rx="4" /><text x="1120.0" y="572" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">03  Validate Spain change and permissions</text><text x="1120.0" y="595" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Country pack | Before dependent external work</text><path d="M 750,607 L 1490,607" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1480.0,602.0 L 1490,607 L 1480.0,612.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="148" y="622" width="594" height="65" fill="white" stroke="none" rx="4" /><text x="445.0" y="640" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">04  API-04 GET /connectors/{accessPointId}/datasets/{datasetId}/</text><text x="445.0" y="662" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connections/{connectionId}/</text><text x="445.0" y="685" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-04 | Observe result when needed</text><path d="M 140,697 L 750,697" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,692.0 L 750,697 L 740.0,702.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="148" y="734" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="752" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">05  Return updated result or required action</text><text x="445.0" y="775" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">ONB-06/08/11 | No automatic route switch</text><path d="M 750,787 L 140,787" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,792.0 L 140,787 L 150.0,782.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="24" y="900" width="1752" height="144" fill="#f4f4f4" stroke="#aaaaaa" rx="4" /><text x="40" y="925" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Scope and interpretation</text><text x="40" y="952" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Agreed direction: reuse the FR API and tailor Spain through a country pack. Logical boundaries only.</text><text x="40" y="976" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Activity mapping: ONB-05/06/07/08/09/10/11. Concurrent changes retain expected-version controls.</text><text x="40" y="1000" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">A failed observation does not permit blind PUT repetition. Detailed errors, recovery and contract questions stay in SPEC-SEI-020.</text></svg>