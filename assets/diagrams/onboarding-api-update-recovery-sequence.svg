<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2861" viewBox="0 0 1800 2861" role="img" aria-label="Onboarding API view - Update a connection and handle uncertainty"><title>Onboarding API view - Update a connection and handle uncertainty</title><desc>ONB-S05/06 | API-05 and API-04; no approved Spain update semantics yet. FR date-only update is not a generic switch, cancellation, rollback or disconnect contract. No DELETE, operation-status or approval endpoint is invented from the five supplied files. Reconciliation owner and proof thresholds remain GAP-04/06 decisions.</desc><rect width="1800" height="2861" fill="white" /><text x="28" y="42" font-family="Arial, sans-serif" font-size="28" fill="#222222" text-anchor="start">Onboarding API view - Update a connection and handle uncertainty</text><text x="28" y="75" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">ONB-S05/06 | API-05 and API-04; no approved Spain update semantics yet.</text><text x="28" y="105" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Proposed logical sequence · Participants are responsibility groups; actual service placement and contracts remain open.</text><text x="28" y="132" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Solid filled arrow: request · Dashed open arrow: response · Solid open arrow: notification · Time runs down.</text><rect x="24" y="1023" width="1752" height="450" fill="none" stroke="#777777" rx="4" /><rect x="24" y="1753" width="1752" height="450" fill="none" stroke="#777777" rx="4" /><path d="M 140,246 L 140,2683" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="27" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="140" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">ERP / product</text><path d="M 750,246 L 750,2683" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="637" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="750" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Global API</text><text x="750" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">FR contract candidate</text><path d="M 1090,246 L 1090,2683" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="977" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1090" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Domain Service -</text><text x="1090" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">E-Invoice Service</text><text x="1090" y="224" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Proposed coordination</text><path d="M 1390,246 L 1390,2683" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="1277" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1390" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Domain Service -</text><text x="1390" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Other Services</text><text x="1390" y="224" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Identity / trust / routing</text><path d="M 1660,246 L 1660,2683" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="1547" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1660" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Public / private platforms</text><text x="1660" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Qualified integration</text><rect x="24" y="1023" width="1752" height="31" fill="#f1f1f1" stroke="#777777" rx="4" /><text x="36" y="1045" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="start">opt - Selected update is qualified; otherwise return an owned limitation</text><rect x="24" y="1753" width="1752" height="31" fill="#f1f1f1" stroke="#777777" rx="4" /><text x="36" y="1775" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="start">opt - Known connectionId and qualified read can observe relevant state</text><rect x="28" y="302" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="327" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">1 - Read current state and qualify the exact change</text><rect x="35" y="747" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="772" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Preserve the current plan and earlier obligations. FR update permits add or update; update changes address dates only. Same-SIREN grouping, country rules and expected-</text><text x="49" y="794" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">version protection need explicit qualification.</text><text x="49" y="827" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">FR-05 | ONB-05/07/09 | GAP-02/04/07</text><rect x="28" y="946" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="971" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">2 - Apply a supported, authorised change</text><rect x="28" y="1529" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="1554" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">3 - Handle a lost result without repeating a possible effect</text><rect x="35" y="1614" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="1639" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">The supplied PUT operation declares no Idempotency-Key or expected-version header. PUT naming alone cannot prove business repeat safety. Save the original intent and</text><text x="49" y="1661" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">keep uncertain work on hold.</text><text x="49" y="1694" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">OFR-01/05 | GAP-04</text><rect x="35" y="2207" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="2232" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Compare intended and observed state with source, time and operation evidence. A matching connection record may not prove the external effect or its executor. Failed/404</text><text x="49" y="2254" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">observations do not permit blind repetition. Escalate unresolved work.</text><text x="49" y="2287" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">ONB-08 | OFR-06/07 | GAP-04/05</text><rect x="28" y="2406" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="2431" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">4 - Resume the blocked check, not an automatic route change</text><rect x="35" y="2491" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="2516" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">A resolved change returns to ONB-06 or its exact parent check. ONB-07 separately qualifies activation/restoration. Cancellation and old-dependency release retain their</text><text x="49" y="2538" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">own evidence gates.</text><text x="49" y="2571" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">ONB-06/07/08/09/11 | OFR-R10</text><rect x="148" y="352" width="594" height="65" fill="white" stroke="none" rx="4" /><text x="445.0" y="370" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">01  API-04 GET /connectors/{accessPointId}/datasets/{datasetId}/</text><text x="445.0" y="392" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connections/{connectionId}/</text><text x="445.0" y="415" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-04 | ONB-10</text><path d="M 140,427 L 750,427" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,422.0 L 750,427 L 740.0,432.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="464" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="482" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">02  Dispatch scoped operation</text><text x="920.0" y="505" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,517 L 1090,517" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,512.0 L 1090,517 L 1080.0,522.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="532" width="324" height="65" fill="white" stroke="none" rx="4" /><text x="920.0" y="550" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">03  200 - current connection</text><text x="920.0" y="572" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">observations</text><text x="920.0" y="595" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,607 L 750,607" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,612.0 L 750,607 L 760.0,602.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="644" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="662" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">04  200 - current connection observations</text><text x="445.0" y="685" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-04</text><path d="M 750,697 L 140,697" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,702.0 L 140,697 L 150.0,692.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1066" width="594" height="65" fill="white" stroke="none" rx="4" /><text x="445.0" y="1084" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">05  API-05 PUT /connectors/{accessPointId}/datasets/{datasetId}/</text><text x="445.0" y="1106" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connections/{connectionId}/</text><text x="445.0" y="1129" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-05 | ONB-05/06</text><path d="M 140,1141 L 750,1141" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,1136.0 L 750,1141 L 740.0,1146.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1178" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="1196" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">06  Dispatch scoped operation</text><text x="920.0" y="1219" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,1231 L 1090,1231" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,1226.0 L 1090,1231 L 1080.0,1236.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1246" width="324" height="65" fill="white" stroke="none" rx="4" /><text x="920.0" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">07  200 - updated resource and</text><text x="920.0" y="1286" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">address status</text><text x="920.0" y="1309" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,1321 L 750,1321" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,1326.0 L 750,1321 L 760.0,1316.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1358" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="1376" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">08  200 - updated resource and address status</text><text x="445.0" y="1399" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-05</text><path d="M 750,1411 L 140,1411" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,1416.0 L 140,1411 L 150.0,1406.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1796" width="594" height="65" fill="white" stroke="none" rx="4" /><text x="445.0" y="1814" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">09  API-04 GET /connectors/{accessPointId}/datasets/{datasetId}/</text><text x="445.0" y="1836" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connections/{connectionId}/</text><text x="445.0" y="1859" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-04 | OFR-06</text><path d="M 140,1871 L 750,1871" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,1866.0 L 750,1871 L 740.0,1876.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1908" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="1926" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">10  Dispatch scoped operation</text><text x="920.0" y="1949" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,1961 L 1090,1961" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,1956.0 L 1090,1961 L 1080.0,1966.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1976" width="324" height="65" fill="white" stroke="none" rx="4" /><text x="920.0" y="1994" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">11  200 - observed values and</text><text x="920.0" y="2016" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">address status</text><text x="920.0" y="2039" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,2051 L 750,2051" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,2056.0 L 750,2051 L 760.0,2046.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="2088" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="2106" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">12  200 - observed values and address status</text><text x="445.0" y="2129" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-04</text><path d="M 750,2141 L 140,2141" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,2146.0 L 140,2141 L 150.0,2136.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="24" y="2701" width="1752" height="144" fill="#f4f4f4" stroke="#aaaaaa" rx="4" /><text x="40" y="2726" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Scope and interpretation</text><text x="40" y="2753" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">FR date-only update is not a generic switch, cancellation, rollback or disconnect contract.</text><text x="40" y="2777" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">No DELETE, operation-status or approval endpoint is invented from the five supplied files.</text><text x="40" y="2801" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Reconciliation owner and proof thresholds remain GAP-04/06 decisions.</text></svg>