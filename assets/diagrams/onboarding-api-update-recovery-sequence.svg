<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-label="Onboarding API overview - Change existing setup"><title>Onboarding API overview - Change existing setup</title><desc>Authorised change | Country rules and exact supported edits still require qualification. Agreed direction: reuse the FR API and tailor Spain through a country pack. Logical boundaries only. Activity mapping: ONB-05/06/07/08/09/10/11. Concurrent changes retain expected-version controls. A failed observation does not permit blind PUT repetition. Detailed errors, recovery and contract questions stay in SPEC-SEI-020.</desc><rect width="1800" height="1060" fill="white" /><text x="28" y="42" font-family="Arial, sans-serif" font-size="28" fill="#222222" text-anchor="start">Onboarding API overview - Change existing setup</text><text x="28" y="75" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Authorised change | Country rules and exact supported edits still require qualification.</text><text x="28" y="105" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Proposed logical sequence · Participants are responsibility groups; actual service placement and contracts remain open.</text><text x="28" y="132" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Solid filled arrow: request · Dashed open arrow: response · Solid open arrow: notification · Time runs down.</text><path d="M 140,246 L 140,882" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="27" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="140" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Product / ERP</text><path d="M 750,246 L 750,882" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="637" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx=