<text x="1725.0" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Business and network</text>
<text x="1725.0" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">identity</text>
