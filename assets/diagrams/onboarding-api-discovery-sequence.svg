<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2491" viewBox="0 0 1800 2491" role="img" aria-label="Onboarding API view - Discover and inspect connections"><title>Onboarding API view - Discover and inspect connections</title><desc>ONB-01/02/10/11 | Documented FR operations; proposed Spain reuse only. Existing FR shapes are reuse candidates; deployment and Spain support remain unqualified. CONNECTED is a connection observation, not proof of per-function readiness or route activation. Related contract and identity gaps: GAP-01/03/05/07/08. No new endpoint is implied.</desc><rect width="1800" height="2491" fill="white" /><text x="28" y="42" font-family="Arial, sans-serif" font-size="28" fill="#222222" text-anchor="start">Onboarding API view - Discover and inspect connections</text><text x="28" y="75" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">ONB-01/02/10/11 | Documented FR operations; proposed Spain reuse only.</text><text x="28" y="105" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Proposed logical sequence · Participants are responsibility groups; actual service placement and contracts remain open.</text><text x="28" y="132" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Solid filled arrow: request · Dashed open arrow: response · Solid open arrow: notification · Time runs down.</text><rect x="24" y="1667" width="1752" height="450" fill="none" stroke="#777777" rx="4" /><path d="M 140,246 L 140,2313" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="27" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="140" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">ERP / product</text><path d="M 750,246 L 750,2313" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="637" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="750" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Global API</text><text x="750" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">FR contract candidate</text><path d="M 1090,246 L 1090,2313" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="977" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1090" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Domain Service -</text><text x="1090" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">E-Invoice Service</text><text x="1090" y="224" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Proposed coordination</text><path d="M 1390,246 L 1390,2313" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="1277" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1390" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Domain Service -</text><text x="1390" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Other Services</text><text x="1390" y="224" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Identity / trust / routing</text><path d="M 1660,246 L 1660,2313" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="1547" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1660" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Public / private platforms</text><text x="1660" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Qualified integration</text><rect x="24" y="1667" width="1752" height="31" fill="#f1f1f1" stroke="#777777" rx="4" /><text x="36" y="1689" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="start">opt - A permitted connectionId is available</text><rect x="28" y="302" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="327" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">1 - Bind the business and allowed access</text><rect x="35" y="387" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="412" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Resolve the authenticated caller, represented business and dataset mapping before protected reads. M2M authentication alone does not establish delegated authority. No</text><text x="49" y="434" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">dataset-to-business equivalence is assumed.</text><text x="49" y="467" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">GAP-01/03 | ONB-02 | ONB-R01/19</text><rect x="28" y="586" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="611" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">2 - List available options and existing dataset connections</text><rect x="35" y="1031" width="1160" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="1056" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">FR-01 declares datasetId as a path parameter but /accesspoints has no matching placeholder. Confirm the canonical signature before</text><text x="49" y="1078" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">client generation. Listing is not selection, readiness or activation.</text><text x="49" y="1111" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">GAP-07 | FR-01</text><rect x="28" y="1590" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="1615" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">3 - Inspect only a known authorised connection</text><rect x="35" y="2121" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="2146" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Compare requested functions with observed evidence. A failed read or 404 does not prove external absence. Valid unchanged setup uses no POST or PUT. Return missing</text><text x="49" y="2168" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">checks and their owner.</text><text x="49" y="2201" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">ONB-S02/03/05/08 | ONB-R11/12/13</text><rect x="148" y="658" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="676" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">01  API-01 GET /accesspoints</text><text x="445.0" y="699" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-01 | ONB-10</text><path d="M 140,711 L 750,711" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,706.0 L 750,711 L 740.0,716.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="748" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="766" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">02  Dispatch scoped operation</text><text x="920.0" y="789" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,801 L 1090,801" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,796.0 L 1090,801 L 1080.0,806.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="838" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="856" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">03  200 - AccessPoint resources</text><text x="920.0" y="879" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,891 L 750,891" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,896.0 L 750,891 L 760.0,886.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="928" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="946" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">04  200 - AccessPoint resources</text><text x="445.0" y="969" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-01</text><path d="M 750,981 L 140,981" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,986.0 L 140,981 L 150.0,976.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1165" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="1183" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">05  API-02 GET /datasets/{datasetId}/accesspoints</text><text x="445.0" y="1206" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-02 | ONB-10</text><path d="M 140,1218 L 750,1218" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,1213.0 L 750,1218 L 740.0,1223.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1255" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="1273" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">06  Dispatch scoped operation</text><text x="920.0" y="1296" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,1308 L 1090,1308" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,1303.0 L 1090,1308 L 1080.0,1313.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1323" width="324" height="65" fill="white" stroke="none" rx="4" /><text x="920.0" y="1341" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">07  200 - access points and</text><text x="920.0" y="1363" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connectionId</text><text x="920.0" y="1386" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,1398 L 750,1398" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,1403.0 L 750,1398 L 760.0,1393.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1435" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="1453" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">08  200 - access points and connectionId</text><text x="445.0" y="1476" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-02</text><path d="M 750,1488 L 140,1488" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,1493.0 L 140,1488 L 150.0,1483.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1710" width="594" height="65" fill="white" stroke="none" rx="4" /><text x="445.0" y="1728" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">09  API-04 GET /connectors/{accessPointId}/datasets/{datasetId}/</text><text x="445.0" y="1750" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connections/{connectionId}/</text><text x="445.0" y="1773" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-04 | ONB-10/11</text><path d="M 140,1785 L 750,1785" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,1780.0 L 750,1785 L 740.0,1790.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1822" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="1840" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">10  Dispatch scoped operation</text><text x="920.0" y="1863" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,1875 L 1090,1875" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,1870.0 L 1090,1875 L 1080.0,1880.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="1890" width="324" height="65" fill="white" stroke="none" rx="4" /><text x="920.0" y="1908" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">11  200 - address status and</text><text x="920.0" y="1930" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">errorCode</text><text x="920.0" y="1953" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,1965 L 750,1965" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,1970.0 L 750,1965 L 760.0,1960.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="2002" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="2020" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">12  200 - address status and errorCode</text><text x="445.0" y="2043" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-04</text><path d="M 750,2055 L 140,2055" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,2060.0 L 140,2055 L 150.0,2050.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="24" y="2331" width="1752" height="144" fill="#f4f4f4" stroke="#aaaaaa" rx="4" /><text x="40" y="2356" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Scope and interpretation</text><text x="40" y="2383" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Existing FR shapes are reuse candidates; deployment and Spain support remain unqualified.</text><text x="40" y="2407" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">CONNECTED is a connection observation, not proof of per-function readiness or route activation.</text><text x="40" y="2431" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Related contract and identity gaps: GAP-01/03/05/07/08. No new endpoint is implied.</text></svg>