<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-label="Onboarding API overview - Discover and inspect setup"><title>Onboarding API overview - Discover and inspect setup</title><desc>Authorised product and dataset | Key calls only; intermediate responses are omitted. Agreed direction: reuse the FR API and tailor Spain through a country pack. Logical boundaries only. Activity mapping: ONB-02/05/10/11. API-04 uses a known authorised connectionId. Failed discovery cannot establish external absence. Detailed errors, recovery and contract questions stay in SPEC-SEI-020.</desc><rect width="1800" height="1060" fill="white" /><text x="28" y="42" font-family="Arial, sans-serif" font-size="28" fill="#222222" text-anchor="start">Onboarding API overview - Discover and inspect setup</text><text x="28" y="75" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Authorised product and dataset | Key calls only; intermediate responses are omitted.</text><text x="28" y="105" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Proposed logical sequence · Participants are responsibility groups; actual service placement and contracts remain open.</text><text x="28" y="132" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Solid filled arrow: request · Dashed open arrow: response · Solid open arrow: notification · Time runs down.</text><path d="M 140,246 L 140,882" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="27" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="140" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Product / ERP</text><path d="M 750,246 L 750,882" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="637" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="750" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Existing FR API</text><text x="750" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Reused for Spain</text><path d="M 1490,246 L 1490,882" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="1377" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1490" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Spain country pack</text><text x="1490" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Rules and integrations</text><rect x="28" y="302" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="327" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">Discover supported services and inspect existing setup</text><rect x="148" y="374" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="392" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">01  API-01 GET /accesspoints</text><text x="445.0" y="415" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-01 | Available services</text><path d="M 140,427 L 750,427" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,422.0 L 750,427 L 740.0,432.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="464" width="724" height="43" fill="white" stroke="none" rx="4" /><text x="1120.0" y="482" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">02  Apply Spain service and access rules</text><text x="1120.0" y="505" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Country pack | GAP-01/02/03</text><path d="M 750,517 L 1490,517" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1480.0,512.0 L 1490,517 L 1480.0,522.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="148" y="554" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="572" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">03  API-02 GET /datasets/{datasetId}/accesspoints</text><text x="445.0" y="595" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-02 | Existing dataset connections</text><path d="M 140,607 L 750,607" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,602.0 L 750,607 L 740.0,612.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="148" y="622" width="594" height="65" fill="white" stroke="none" rx="4" /><text x="445.0" y="640" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">04  API-04 GET /connectors/{accessPointId}/datasets/{datasetId}/</text><text x="445.0" y="662" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connections/{connectionId}/</text><text x="445.0" y="685" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-04 | Only when connection detail is needed</text><path d="M 140,697 L 750,697" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,692.0 L 750,697 L 740.0,702.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="148" y="734" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="752" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">05  Return options and current setup</text><text x="445.0" y="775" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">ONB-10/11 | No change for valid existing setup</text><path d="M 750,787 L 140,787" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,792.0 L 140,787 L 150.0,782.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="24" y="900" width="1752" height="144" fill="#f4f4f4" stroke="#aaaaaa" rx="4" /><text x="40" y="925" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Scope and interpretation</text><text x="40" y="952" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Agreed direction: reuse the FR API and tailor Spain through a country pack. Logical boundaries only.</text><text x="40" y="976" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Activity mapping: ONB-02/05/10/11. API-04 uses a known authorised connectionId.</text><text x="40" y="1000" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Failed discovery cannot establish external absence. Detailed errors, recovery and contract questions stay in SPEC-SEI-020.</text></svg>