<svg aria-label="ONB-S02 - Existing public service" xmlns="http://www.w3.org/2000/svg" width="1800" height="2209" viewBox="0 0 1800 2209" role="img"><title>ONB-S02 - Existing public service</title><desc>Confirm public access through Sage; reuse current evidence. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale. Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be qualified. HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects under ONB-08.</desc><rect width="1800" height="2209" fill="white" /><rect x="8" y="8" width="1784" height="2193" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">ONB-S02 - Existing public service</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Confirm public access through Sage; reuse current evidence</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1792,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,2083" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">Product</text><path d="M 515,216 L 515,2083" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,2083" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Identity</text><path d="M 1285,216 L 1285,2083" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Tax Service</text><path d="M 1670,216 L 1670,2083" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1562" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1670" y="190" fill="#222222">Public platform</text><rect x="36" y="503" width="1728" height="291" fill="none" stroke="#777777" rx="0" /><rect x="24" y="258" width="1752" height="566" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1143" width="1752" height="268" fill="none" stroke="#777777" rx="0" /><rect x="507" y="363" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="654" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="1003" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="1271" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="899" width="16" height="587" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1662" y="1762" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1681" width="16" height="266" fill="#dddddd" stroke="#777777" rx="0" /><rect x="36" y="503" width="1728" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="526" fill="#222222">opt | A known connection needs detail</text><rect x="24" y="258" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#222222">opt | Known authorised dataset; inspect Sage setup only</text><rect x="24" y="1143" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1166" fill="#222222">opt | Certificate required for the selected purpose; use current evidence</text><rect x="38" y="1522" width="1724" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1546" fill="#222222">Continue dependent checks only after valid NIF, current action authority and required certificate readiness</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1569" fill="#222222">pass.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1600" fill="#888888">ONB-02/03/08 | Unconfirmed evidence holds only dependent work</text><rect x="38" y="1983" width="1724" height="68" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2007" fill="#222222">An existing public account does not establish Sage access. No external enrolment or test invoice is inferred.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="2039" fill="#888888">ONB-S02 | GAP-01/02/06</text><rect x="142" y="300" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="318" fill="#888888">[Existing] API-02 / FR-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="342" fill="#222222">GET /datasets/{datasetId}/accesspoints</text><path d="M 130,363 L 507,363" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,357 L 507,363 L 495,369 Z" fill="#444444" stroke="#444444" /><rect x="142" y="381" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="399" fill="#888888">FR-02 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="423" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="446" fill="#222222">Status + connectionId (or null)</text><path d="M 507,467 L 130,467" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,461 L 130,467 L 142,473" fill="none" stroke="#444444" /><rect x="142" y="545" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="563" fill="#888888">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="587" fill="#222222">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="610" fill="#222222">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="633" fill="#222222">{connectionId}/</text><path d="M 130,654 L 507,654" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,648 L 507,654 L 495,660 Z" fill="#444444" stroke="#444444" /><rect x="142" y="672" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="690" fill="#888888">FR-04 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="714" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="737" fill="#222222">Per-address status and errors</text><path d="M 507,758 L 130,758" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,752 L 130,758 L 142,764" fill="none" stroke="#444444" /><rect x="142" y="836" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="854" fill="#888888">[To qualify] Logical request; ONB-02/03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="878" fill="#222222">Assess prerequisites</text><path d="M 130,899 L 507,899" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,893 L 507,899 L 495,905 Z" fill="#444444" stroke="#444444" /><rect x="527" y="917" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="935" fill="#888888">[To qualify] Identity contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="959" fill="#222222">Check business NIF</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="982" fill="#222222">and action authority</text><path d="M 523,1003 L 892,1003" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,997 L 892,1003 L 880,1009 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1021" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1039" fill="#888888">[To qualify] Identity contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1063" fill="#222222">NIF + authority evidence</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1086" fill="#222222">or an owned action</text><path d="M 892,1107 L 523,1107" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1101 L 523,1107 L 535,1113" fill="none" stroke="#444444" /><rect x="527" y="1185" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1203" fill="#888888">[To qualify] Tax Service; CERT-05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1227" fill="#222222">Check certificate is in date</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1250" fill="#222222">and suitable for this purpose</text><path d="M 523,1271 L 1277,1271" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,1265 L 1277,1271 L 1265,1277 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1289" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1307" fill="#888888">[To qualify] Tax Service; CERT-05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1331" fill="#222222">Readiness + protected reference</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1354" fill="#222222">or reason / unconfirmed</text><path d="M 1277,1375 L 523,1375" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1369 L 523,1375 L 535,1381" fill="none" stroke="#444444" /><rect x="142" y="1423" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1441" fill="#888888">[Logical outcome] ONB-02/03/08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1465" fill="#222222">Gate decision + action owner</text><path d="M 507,1486 L 130,1486" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1480 L 130,1486 L 142,1492" fill="none" stroke="#444444" /><rect x="142" y="1618" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1636" fill="#888888">[To qualify] Logical request; ONB-03/04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1660" fill="#222222">Assess selected public functions</text><path d="M 130,1681 L 507,1681" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1675 L 507,1681 L 495,1687 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1699" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1717" fill="#888888">[To qualify] Selected public contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1741" fill="#222222">Check purpose-specific access</text><path d="M 523,1762 L 1662,1762" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1650,1756 L 1662,1762 L 1650,1768 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1780" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1798" fill="#888888">[To qualify] Selected public contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1822" fill="#222222">Public evidence / limitation</text><path d="M 1662,1843 L 523,1843" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1837 L 523,1843 L 535,1849" fill="none" stroke="#444444" /><rect x="142" y="1861" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1879" fill="#888888">[Logical outcome] ONB-04/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1903" fill="#222222">Per-function public findings</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1926" fill="#222222">+ required actions</text><path d="M 507,1947 L 130,1947" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1941 L 130,1947 L 142,1953" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2123" fill="#888888">Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2146" fill="#888888">Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be qualified.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2169" fill="#888888">HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects under ONB-08.</text></svg>