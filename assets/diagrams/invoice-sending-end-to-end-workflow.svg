voice"><rect x="55" y="430" width="270" height="125" rx="9" fill="#f1f1f1" stroke="#555" /></g><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="190.0" y="475.5" fill="#222">1. Provide final invoice</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="190.0" y="500.5" fill="#444">Final candidate or existing</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="190.0" y="521.5" fill="#444">issued proof</text><g data-source="../../specs/invoice-sending/SPEC-SEI-023-invoice-sending-logical-feature-specification.md#3-process-and-activity-order" id="ready"><rect x="385" y="430" width="310" height="125" rx="9" fill="#f1f1f1" stroke="#555" /></g><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="540.0" y="475.5" fill="#222">2. Confirm sending readiness</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="540.0" y="500.5" fill="#444">Authority, final validation and</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="540.0" y="521.5" fill="#444">required files, including PDF</text><g data-source="../../specs/invoice-sending/SPEC-SEI-023-invoice-sending-logical-feature-specification.md#3-process-and-activity-order" id="route"><path d="M 915.0,420 L 1040,492.5 L 915.0,565 L 790,492.5 Z" fill="#e6e6e6" stroke="#555" /></g><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="915.0" y="496.5" fill="#222">Recipient route?</text><g data-source="../../specs/invoice-sending/SPEC-SEI-023-invoice-sending-logical-feature-specification.md#3-process-and-activity-order" id="private"><rect x="1120" y="350" width="430" height="115" rx="9" fill="#f1f1f1" stroke="#555" /></g><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1335.0" y="390.5" fill="#222">Private recipient delivery</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1335.0" y="415.5" fill="#444">Structured invoice to the recipient's private</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1335.0" y="436.5" fill="#444">platform</text><g data-source="../../specs/invoice-sending/SPEC-SEI-023-invoice-sending-logical-feature-specification.md#3-process-and-activity-order" id="copy"><rect x="1120" y="520" width="430" height="115" rx="9" fill="#f1f1f1" stroke="#555" /></g><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1335.0" y="571.0" fill="#222">Faithful copy to public</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1335.0" y="596.0" fill="#444">Separate action, coordinated with ERP issuance</text><g data-source="../../specs/invoice-sending/SPEC-SEI-023-invoice-sending-logical-feature-specification.md#3-process-and-activity-order" id="public"><rect x="1120" y="690" width="430" height="115" rx="9" fill="#f1f1f1" stroke="#555" /></g><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1335.0" y="730.5" fill="#222">Public recipient delivery</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1335.0" y="755.5" fill="#444">Structured invoice through public platform; no</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1335.0" y="776.5" fill="#444">extra copy</text><g data-source="../../specs/invoice-sending/SPEC-SEI-023-invoice-sending-logical-feature-specification.md#3-process-and-activity-order" id="results"><rect x="1640" y="490" width="305" height="200" rx="40" fill="#e6e6e6" stroke="#555" /></g><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1792.5" y="562.5" fill="#222">Separate results</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1792.5" y="587.5" fill="#444">Recipient delivery, public copy</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1792.5" y="608.5" fill="#444">and PDF delivery each keep their</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1792.5" y="629.5" fill="#444">own result</text><g data-source="../../specs/invoice-sending/SPEC-SEI-023-invoice-sending-logical-feature-specification.md#3-process-and-activity-order" id="pdf"><rect x="55" y="680" width="640" height="125" rx="9" fill="#fafafa" stroke="#555" /></g><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="375.0" y="725.5" fill="#222">Local product generates PDF when required</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="375.0" y="750.5" fill="#444">Send to buyer via a qualified private attachment or a separate channel.</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="375.0" y="771.5" fill="#444">Never send this PDF to the public platform.</text><text font-family="Arial, sans-serif" font-size="18" text-anchor="start" x="55" y="855" fill="#444">ERP owns issuance. Coordinate the required public copy with issuance, not with successful private delivery (OUT-Q03).</text><text font-family="Arial, sans-serif" font-size="18" text-anchor="start" x="55" y="885" fill="#444">Unresolved route: hold dispatch. Action observations are independent; the results box is not a completion join.</text><text font-family="Arial, sans-serif" font-size="18" text-anchor="start" x="55" y="915" fill="#444">Already-issued paths retain proof. Late-copy recovery does not redefine the normal issuance boundary.</text><rect x="55" y="960" width="1890" height="90" rx="8" fill="#f5f5f5" stroke="#aaa" /><text font-family="Arial, sans-serif" font-size="21" text-anchor="start" x="80" y="993" fill="#222">If work is blocked or uncertain</text><text font-family="Arial, sans-serif" font-size="18" text-anchor="start" x="80" y="1028" fill="#222">Hold the affected action, preserve known results and return an owned next step. Reconcile possible external effects before repetition.</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="55" y="1085" fill="#555">One invoice for a business user or authorised accountant. Detailed rules and PDF applicability remain in SEI023 / PRD-SEI-246.</text></svg>