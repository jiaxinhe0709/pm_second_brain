<svg aria-label="Single-invoice sending: private delivery and separate public copy, or public delivery; local product generates the recipient PDF" xmlns="http://www.w3.org/2000/svg" width="2000" height="1110" viewBox="0 0 2000 1110" role="img"><title>Invoice sending: private and public routes</title><desc>A business user or authorised accountant sends one invoice. Private delivery and faithful public copy are independent actions; public delivery needs no extra copy. Local Product generates any required transitional PDF for the recipient only. Draft preparation remains inside a red dashed TBC boundary. One invoice for a business user or authorised accountant. Detailed rules and PDF applicability remain in SEI023 / PRD-SEI-246.</desc><rect width="2000" height="1110" fill="white" /><text font-family="Arial, sans-serif" font-size="30" text-anchor="start" x="55" y="50" fill="#222">Invoice sending: private and public routes</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="55" y="88" fill="#555">Red dashed frame: TBC · Solid arrows: action flow · Grey dashed arrows: conditional handoff or independent observations</text><path stroke-width="2.5" id="draft-tbc-boundary" d="M 55.0,140.0 L 66.0,140.0 M 73.0,140.0 L 84.0,140.0 M 91.0,140.0 L 102.0,140.0 M 109.0,140.0 L 120.0,140.0 M 127.0,140.0 L 138.0,140.0 M 145.0,140.0 L 156.0,140.0 M 163.0,140.0 L 174.0,140.0 M 181.0,140.0 L 192.0,140.0 M 199.0,140.0 L 210.0,140.0 M 217.0,140.0 L 228.0,140.0 M 235.0,140.0 L 246.0,140.0 M 253.0,140.0 L 264.0,140.0 M 271.0,140.0 L 282.0,140.0 M 289.0,140.0 L 300.0,140.0 M 307.0,140.0 L 318.0,140.0 M 325.0,140.0 L 336.0,140.0 M 343.0,140.0 L 354.0,140.0 M 361.0,140.0 L 372.0,140.0 M 379.0,140.0 L 390.0,140.0 M 397.0,140.0 L 408.0,140.0 M 415.0,140.0 L 426.0,140.0 M 433.0,140.0 L 444.0,140.0 M 451.0,140.0 L 462.0,140.0 M 469.0,140.0 L 480.0,140.0 M 487.0,140.0 L 498.0,140.0 M 505.0,140.0 L 516.0,140.0 M 523.0,140.0 L 534.0,140.0 M 541.0,140.0 L 552.0,140.0 M 559.