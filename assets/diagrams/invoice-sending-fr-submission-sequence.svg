<svg aria-label="FR submission and observation" xmlns="http://www.w3.org/2000/svg" width="1415" height="1566" viewBox="0 0 1415 1566" role="img"><title>FR submission and observation</title><desc>Existing guide flow; Spain contracts and implementation remain to qualify. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time. Existing labels identify supplied evidence; To qualify labels do not define new endpoints or deployed service boundaries.</desc><rect width="1415" height="1566" fill="white" /><rect x="8" y="8" width="1399" height="1550" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">FR submission and observation</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Existing guide flow; Spain contracts and implementation remain to qualify</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1463" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,1463" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1463" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">File upload</text><path d="M 1285,216 L 1285,1463" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Events</text><rect x="24" y="719" width="1367" height="222" fill="none" stroke="#777777" rx="0" /><rect x="1277" y="417" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="579" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="824" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="122" y="1130" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1315" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="719" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="742" fill="#222222">loop | Each required file in the qualified manifest</text><rect x="38" y="258" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#222222">Precondition: current business/action authority, qualified CONNECTED setup and approved final files. HTTP</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#222222">intake is separate from processing, delivery and buyer acceptance.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="336" fill="#888888">OUT-08/11/12; INT-SND01 prerequisites</text><rect x="38" y="971" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="995" fill="#222222">Upload completion remains to qualify. INT-ERR01 says notification follows attempt handling; ERROR is final for</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1018" fill="#222222">that attempt. Follow platform retry ownership, not a fresh product POST.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1049" fill="#888888">INT-SND01; INT-ERR01; SND-G04/05</text><rect x="142" y="354" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="372" fill="#888888">[Existing] INT-SND01 step 1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="396" fill="#222222">POST /internal/events/subscriptions</text><path d="M 130,417 L 1277,417" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,411 L 1277,417 L 1265,423 Z" fill="#444444" stroke="#444444" /><rect x="142" y="435" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="453" fill="#888888">[Existing] INT-SND01 step 1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="477" fill="#222222">Subscription result; success code/schema not supplied</text><path d="M 1277,498 L 130,498" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,492 L 130,498 L 142,504" fill="none" stroke="#444444" /><rect x="142" y="516" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="534" fill="#888888">[Existing] INT-SND01 step 2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="558" fill="#222222">POST /datasets/{datasetId}/e-invoices</text><path d="M 130,579 L 507,579" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,573 L 507,579 L 495,585 Z" fill="#444444" stroke="#444444" /><rect x="142" y="597" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="615" fill="#888888">[Existing] INT-SND01 step 2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="639" fill="#222222">201 Created: e-invoice ID and uploadUrl</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="662" fill="#222222">per file</text><path d="M 507,683 L 130,683" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,677 L 130,683 L 142,689" fill="none" stroke="#444444" /><rect x="142" y="761" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="779" fill="#888888">[Existing] INT-SND01 step 3</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="803" fill="#222222">PUT {uploadUrl}: exact binary file</text><path d="M 130,824 L 892,824" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,818 L 892,824 L 880,830 Z" fill="#444444" stroke="#444444" /><rect x="142" y="842" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="860" fill="#888888">[Existing] INT-SND01 step 3</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="884" fill="#222222">200 OK: upload result</text><path d="M 892,905 L 130,905" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,899 L 130,905 L 142,911" fill="none" stroke="#444444" /><rect x="142" y="1067" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1085" fill="#888888">[Existing] INT-SND01 step 4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1109" fill="#222222">Status-updated webhook; subject = e-invoice ID</text><path d="M 1285,1130 L 138,1130" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 150,1124 L 138,1130 L 150,1136 Z" fill="#444444" stroke="#444444" /><rect x="142" y="1148" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1166" fill="#888888">[To qualify] SND-G05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1190" fill="#222222">Webhook receipt; exact response contract to qualify</text><path d="M 138,1211 L 1285,1211" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 1273,1205 L 1285,1211 L 1273,1217" fill="none" stroke="#444444" /><rect x="142" y="1229" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1247" fill="#888888">[Existing] INT-SND01 step 5</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1271" fill="#222222">GET /datasets/{datasetId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1294" fill="#222222">e-invoices/{e-invoiceId}</text><path d="M 130,1315 L 507,1315" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1309 L 507,1315 L 495,1321 Z" fill="#444444" stroke="#444444" /><rect x="142" y="1333" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1351" fill="#888888">[Existing] INT-SND01 step 5</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1375" fill="#222222">200 OK: currentStatus and history;</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1398" fill="#222222">retain actual meaning</text><path d="M 507,1419 L 130,1419" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1413 L 130,1419 L 142,1425" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1503" fill="#888888">Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1526" fill="#888888">Existing labels identify supplied evidence; To qualify labels do not define new endpoints or deployed service boundaries.</text></svg>