<svg aria-label="Replace a certificate and protect earlier evidence" xmlns="http://www.w3.org/2000/svg" width="2800" height="770" viewBox="0 0 2800 770" role="img"><title>Replace a certificate and protect earlier evidence</title><desc>New versions cut over only after validation; compromised material is contained without erasing historic proof. Rotation changes future selection, not an in-flight operation. Revocation/compromise stops affected new use; key destruction and evidence retention are separate gates. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</desc><rect width="2800" height="770" fill="white" /><foreignObject x="25" y="15" width="2750" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:26px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Replace a certificate and protect earlier evidence</b></div></div></foreignObject><foreignObject x="25" y="58" width="2750" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="285" y="98" width="585" height="28" rx="8" /><foreignObject x="287" y="100" width="581" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">RECEIVE THE REQUEST</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="880" y="98" width="585" height="28" rx="8" /><foreignObject x="882" y="100" width="581" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">CHECK RULES &amp; PERMISSION</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="1475" y="98" width="605" height="28" rx="8" /><foreignObject x="1477" y="100" width="601" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">CHECK CERTIFICATES</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="2090" y="98" width="680" height="28" rx="8" /><foreignObject x="2092" y="100" width="676" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">SAVE RESULTS &amp; KEEP HISTORY</div></div></foreignObject><rect x="25" y="170" width="2750" height="294" fill="#fafafa" stroke="#aaa" /><rect x="25" y="170" width="250" height="294" fill="#e5e5e5" stroke="#aaa" /><foreignObject x="41" y="186" width="218" height="262"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:15px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Domain Service -<br />Other Services</b></div></div></foreignObject><rect x="25" y="478" width="2750" height="174" fill="#fafafa" stroke="#aaa" /><rect x="25" y="478" width="250" height="174" fill="#e5e5e5" stroke="#aaa" /><foreignObject x="41" y="494" width="218" height="142"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:15px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Operations / support</b></div></div></foreignObject><path d="M 540,560 L 550,560 L 550,252 L 625,252" fill="none" stroke="#555" stroke-width="2" /><polygon points="625.0,252.0 616.0,248.0 616.0,256.0" fill="#555" /><path d="M 855,252 L 940,252" fill="none" stroke="#555" stroke-width="2" /><polygon points="940.0,252.0 931.0,248.0 931.0,256.0" fill="#555" /><path d="M 1170,252 L 1260,252" fill="none" stroke="#555" stroke-width="2" /><polygon points="1260.0,252.0 1251.0,248.0 1251.0,256.0" fill="#555" /><path d="M 1490,252 L 1500,252 L 1500,565 L 1580,565" fill="none" stroke="#555" stroke-width="2" /><polygon points="1580.0,565.0 1571.0,561.0 1571.0,569.0" fill="#555" /><path d="M 1820,565 L 1830,565 L 1830,252 L 1900,252" fill="none" stroke="#555" stroke-width="2" /><polygon points="1900.0,252.0 1891.0,248.0 1891.0,256.0" fill="#555" /><rect x="1837" y="397.5" width="52" height="22" fill="white" /><foreignObject x="1837" y="397.5" width="52" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:11px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">approved</div></div></foreignObject><path d="M 2130,252 L 2220,252" fill="none" stroke="#555" stroke-width="2" /><polygon points="2220.0,252.0 2211.0,248.0 2211.0,256.0" fill="#555" /><path d="M 2450,252 L 2540,252" fill="none" stroke="#555" stroke-width="2" /><polygon points="2540.0,252.0 2531.0,248.0 2531.0,256.0" fill="#555" /><path d="M 540,560 L 550,560 L 550,382 L 625,382" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 5" /><polygon points="625.0,382.0 616.0,378.0 616.0,386.0" fill="#555" /><rect x="557" y="460" width="68.5" height="22" fill="white" /><foreignObject x="557" y="460" width="68.5" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:11px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">compromised</div></div></foreignObject><path d="M 1375,302 L 1375,510" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 5" /><polygon points="1375.0,510.0 1379.0,501.0 1371.0,501.0" fill="#555" /><rect x="1382" y="395" width="96" height="22" fill="white" /><foreignObject x="1382" y="395" width="96" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:11px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">failed / unknown</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="625" y="202" width="230" height="100" rx="8" /><foreignObject x="631" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Find work using this certificate</b><br /><span style="font-size:12px">Owners, routes, pending work and history</span><br /><span style="font-size:11px;color:#555">CERT-08</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="940" y="202" width="230" height="100" rx="8" /><foreignObject x="946" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Create the replacement version</b><br /><span style="font-size:12px">Keep the new material protected</span><br /><span style="font-size:11px;color:#555">CERT-08</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1260" y="202" width="230" height="100" rx="8" /><foreignObject x="1266" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check and test the replacement</b><br /><span style="font-size:12px">Trust checks and platform test evidence</span><br /><span style="font-size:11px;color:#555">CERT-04</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1900" y="202" width="230" height="100" rx="8" /><foreignObject x="1906" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Use the new version for future work</b><br /><span style="font-size:12px">Keep earlier attempts on their version</span><br /><span style="font-size:11px;color:#555">CERT-08</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2220" y="202" width="230" height="100" rx="8" /><foreignObject x="2226" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Retire the old key safely</b><br /><span style="font-size:12px">Check dependent work and required holds</span><br /><span style="font-size:11px;color:#555">CERT-10</span></div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="2655" cy="252" rx="115" ry="50" /><foreignObject x="2546" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Keep the earlier signing evidence</b><br /><span style="font-size:12px">Earlier signed records remain available</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="647.0,332.0 833.0,332.0 855.0,382.0 833.0,432.0 647.0,432.0 625.0,382.0" /><foreignObject x="631" y="338" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Stop unsafe certificate use</b><br /><span style="font-size:12px">Affected use after compromise or revocation</span><br /><span style="font-size:11px;color:#555">CERT-09</span></div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="425" cy="560" rx="115" ry="50" /><foreignObject x="316" y="516" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Detect a certificate change</b><br /><span style="font-size:12px">Expiry, revocation or compromise</span></div></div></foreignObject><polygon fill="#d7d7d7" stroke="#333333" stroke-width="2" points="1700.0,510.0 1820.0,565.0 1700.0,620.0 1580.0,565.0" /><foreignObject x="1596" y="526" width="208" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Is the change approved?</b><br /><span style="font-size:12px">Rules, overlap and effective time</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="1282.0,510.0 1468.0,510.0 1490.0,560.0 1468.0,610.0 1282.0,610.0 1260.0,560.0" /><foreignObject x="1266" y="516" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Resolve the failed test</b><br /><span style="font-size:12px">Use the old version only while safe</span></div></div></foreignObject><foreignObject x="25" y="695" width="2750" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">New versions cut over only after validation; compromised material is contained without erasing historic proof. Rotation changes future selection, not an in-flight operation. Revocation/compromise stops affected new use; key destruction and evidence retention are separate gates.</div></div></foreignObject></svg>