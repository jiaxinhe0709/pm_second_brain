flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">CERT-09<br /><b>Contain affected scope</b><br />Compromise or revoked trust</div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="425" cy="560" rx="115" ry="50" /><foreignObject x="322" y="522" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">START<br /><b>Detect change</b><br />Expiry, revocation or compromise</div></div></foreignObject><polygon fill="#d7d7d7" stroke="#333333" stroke-width="2" points="1700.0,510.0 1820.0,565.0 1700.0,620.0 1580.0,565.0" /><foreignObject x="1598" y="528" width="204" height="74"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">DECISION<br /><b>Cutover approved?</b><br />Policy, overlap and effective time</div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="1282.0,510.0 1468.0,510.0 1490.0,560.0 1468.0,610.0 1282.0,610.0 1260.0,560.0" /><foreignObject x="1272" y="522" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">HOLD<br /><b>Resolve failed test</b><br />Old use only if still safe</div></div></foreignObject><foreignObject x="25" y="695" width="2750" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">New versions cut over only after validation; compromised material is contained without erasing historic proof. Rotation changes future selection, not an in-flight operation. Revocation/compromise stops affected new use; key destruction and evidence retention are separate gates.</div></div></foreignObject></svg>