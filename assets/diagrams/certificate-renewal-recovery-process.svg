<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Certificate renewal, containment and retirement</title><desc id="desc">New versions cut over only after validation; compromised material is contained without erasing historic proof. Rotation changes future selection, not an in-flight operation. Revocation/compromise stops affected new use; key destruction and evidence retention are separate gates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Certificate renewal, containment and retirement</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">New versions cut over only after validation; compromised material is contained without erasing historic proof.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE ORCHESTRATION</text><text x="145" y="374" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">TRUST</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">IDENTITY / CUSTODY</text><text x="145" y="569" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">EXTERNAL</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SECURITY / OPERATIONS</text><text x="145" y="759" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">EVIDENCE</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; CONTEXT</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">POLICY &amp; AUTHORITY</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">MATERIAL &amp; VALIDATION</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">RESULT &amp; CONTINUITY</text><polyline points="425,264 425,393 625,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="855,393 890,393 890,591 940,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1170,591 1260,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1490,591 1530,591 1530,393 1580,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1820,393 1900,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1816.0" y="359" width="84" height="22" fill="white" opacity=".96"/><text x="1858" y="375" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">approved</text><polyline points="2130,393 2170,393 2170,798 2220,798" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="2450,798 2540,798" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="310,221 285,221 285,895 625,895 625,798" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="366.0" y="863" width="108" height="22" fill="white" opacity=".96"/><text x="420" y="879" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">compromised</text><polyline points="1375,634 1375,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1361.0" y="682" width="148" height="22" fill="white" opacity=".96"/><text x="1435" y="698" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">failed / unknown</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">START</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Detect change</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Expiry, revocation or compromise</text><rect x="625" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="740.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-08</text><text x="740.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Map dependencies</text><text x="740.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Owner, routes, queues and history</text><rect x="940" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1055.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-08</text><text x="1055.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Create replacement</text><text x="1055.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">New protected material version</text><rect x="1260" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1375.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-04</text><text x="1375.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Validate and test</text><text x="1375.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Trust checks and counterpart proof</text><polygon points="1700.0,350 1820,395.0 1700.0,440 1580,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2"/><text x="1700.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1700.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Cutover approved?</text><text x="1700.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Policy, overlap and effective time</text><rect x="1900" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2015.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-08</text><text x="2015.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Select new version</text><text x="2015.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Future work only; freeze old attempts</text><rect x="2220" y="755" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2335.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-10</text><text x="2335.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Retire old key</text><text x="2335.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Dependency and hold checks</text><ellipse cx="2655.0" cy="798.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2655.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2655.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Preserve proof</text><text x="2655.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Old signed evidence remains</text><polygon points="649,755 831,755 855,798.0 831,841 649,841 625,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="740.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">CERT-09</text><text x="740.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Contain affected scope</text><text x="740.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Compromise or revoked trust</text><polygon points="1284,755 1466,755 1490,798.0 1466,841 1284,841 1260,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1375.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">HOLD</text><text x="1375.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Resolve failed test</text><text x="1375.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Old use only if still safe</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">Rotation changes future selection, not an in-flight operation. Revocation/compromise stops affected new use; key destruction and evidence retention are separate gates.</text></svg>