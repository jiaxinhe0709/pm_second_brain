<svg aria-label="Spain final plan and independent actions" xmlns="http://www.w3.org/2000/svg" width="1415" height="2291" viewBox="0 0 1415 2291" role="img"><title>Spain final plan and independent actions</title><desc>Proposed logical handoffs; OUT-Q03 must prove issuance/copy coordination. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time. Read each status label: Existing is source evidence; Proposed and red handoffs are not approved wire contracts or proof of Spain support.</desc><rect width="1415" height="2291" fill="white" /><rect x="8" y="8" width="1399" height="2275" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Spain final plan and independent actions</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Proposed logical handoffs; OUT-Q03 must prove issuance/copy coordination</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#666666">Grey: Existing documented calls</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="350" y="104" fill="#1565C0">Blue: Proposed Spain handoffs</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="680" y="104" fill="#B42318">Red: Open / Assumption / Gap / Source conflict</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,2188" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,2188" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice Service</text><path d="M 900,216 L 900,2188" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Public platform</text><path d="M 1285,216 L 1285,2188" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Private platform</text><rect x="48" y="862" width="1319" height="382" fill="none" stroke="#B42318" rx="0" /><rect x="36" y="640" width="1343" height="910" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="580" width="1367" height="1000" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1610" width="1367" height="404" fill="none" stroke="#1565C0" rx="0" /><rect x="507" y="326" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="745" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="1104" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1319" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="1874" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="48" y="862" width="1319" height="34" fill="#fafafa" stroke="#B42318" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="60" y="885" fill="#B42318">ref | [Open] ERP issuance + copy boundary; OUT-Q03</text><rect x="36" y="640" width="1343" height="34" fill="#fafafa" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="663" fill="#1565C0">par | [Proposed] Independent copy and recipient actions; no shared completion</text><rect x="24" y="580" width="1367" height="34" fill="#fafafa" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="603" fill="#1565C0">alt | [Proposed] Qualified private route with a required public copy</text><rect x="24" y="1610" width="1367" height="34" fill="#fafafa" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1633" fill="#1565C0">else | [Proposed] Eligible public recipient route under OUT-09</text><rect x="38" y="466" width="1339" height="90" fill="#fafafa" stroke="#B42318" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="490" fill="#B42318">Qualify authority, recipient eligibility, final files and trust. Freeze one recipient route and separate</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="513" fill="#B42318">action identities. Per-invoice choice does not change the active route; onboarding confirmation remains open.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="544" fill="#B42318">[Open] Final handoff and route selection; OUT-08–11; OUT-Q01/03; SND-G09</text><rect x="38" y="922" width="1339" height="90" fill="#fafafa" stroke="#B42318" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="946" fill="#B42318">The selected private platform sends the copy. Its capability is expected but unconfirmed. When Sage operates</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="969" fill="#B42318">as the private platform, Sage performs that role. Qualify coordination with ERP issuance under OUT-Q03.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1000" fill="#B42318">[Assumption] Platform copy capability; OUT-SPFE-R01; SPFE-S02 Article 4</text><rect x="38" y="1436" width="1339" height="90" fill="#fafafa" stroke="#B42318" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1460" fill="#B42318">Qualify how the private platform reports copy results and errors to Sage, and who retries a failed copy. A</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1483" fill="#B42318">missing report leaves that action unresolved; it must not repeat completed recipient delivery.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1514" fill="#B42318">[Gap] Result reporting and failed-copy retry owner; SND-G05; OUT-13</text><rect x="38" y="1670" width="1339" height="112" fill="#fafafa" stroke="#B42318" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1694" fill="#B42318">Use the six-case OUT-09 rule. A no-match alone does not authorise public delivery. Product and Spain</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1717" fill="#B42318">Compliance must resolve the communicated-address source conflict; hold dispatch when the rule or evidence is</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1740" fill="#B42318">unresolved.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1770" fill="#B42318">[Source conflict] Public-route eligibility; OUT-09; SND-G02</text><rect x="38" y="2044" width="1339" height="112" fill="#fafafa" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2068" fill="#1565C0">Retain actual ERP issuance evidence and independent action results. Public issuance/interconnection needs no</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2091" fill="#1565C0">extra copy. The frames show logical coordination, not an atomic transaction, approved API timing or a</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2114" fill="#1565C0">delivery-success trigger for the copy.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="2144" fill="#1565C0">[Proposed] Action coordination; OUT-Q03; OUT-SPFE-R01; OUT-09/13</text><rect x="142" y="240" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="258" fill="#1565C0">[Proposed] OUT-07–11; SND-G01/03/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="282" fill="#1565C0">Final candidate: stable identity,</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="305" fill="#1565C0">revision and business scope</text><path d="M 130,326 L 507,326" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,320 L 507,326 L 495,332 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="344" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="362" fill="#1565C0">[Proposed] OUT-07–11; SND-G01/03/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="386" fill="#1565C0">Qualified plan or owned hold; no</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="409" fill="#1565C0">issuance on a failed check</text><path d="M 507,430 L 130,430" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,424 L 130,430 L 142,436" fill="none" stroke="#1565C0" /><rect x="527" y="682" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="700" fill="#1565C0">[Proposed] OUT-12/13; SND-G02/04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="724" fill="#1565C0">Hand off exact invoice for private recipient delivery</text><path d="M 515,745 L 1277,745" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,739 L 1277,745 L 1265,751 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="763" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="781" fill="#1565C0">[Proposed] OUT-12/13; SND-G02/04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="805" fill="#1565C0">Independent recipient-delivery result or outcome unknown</text><path d="M 1277,826 L 515,826" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,820 L 515,826 L 527,832" fill="none" stroke="#1565C0" /><rect x="912" y="1018" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1036" fill="#B42318">[Assumption] Platform capability; SPFE-S16</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1060" fill="#B42318">SendInvoice: faithful-copy Invoice</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1083" fill="#B42318">attachment</text><path d="M 1285,1104 L 908,1104" fill="none" stroke="#B42318" stroke-width="1.6" /><path stroke-width="1.6" d="M 920,1098 L 908,1104 L 920,1110 Z" fill="#B42318" stroke="#B42318" /><rect x="912" y="1122" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1140" fill="#B42318">[Assumption] Platform capability; SPFE-S16</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1164" fill="#B42318">Transport / request / item result;</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1187" fill="#B42318">retain copy evidence</text><path d="M 908,1208 L 1285,1208" fill="none" stroke="#B42318" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 1273,1202 L 1285,1208 L 1273,1214" fill="none" stroke="#B42318" /><rect x="527" y="1256" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1274" fill="#B42318">[Gap] Copy-result contract; SND-G05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1298" fill="#B42318">Report the original copy result or error to Sage</text><path d="M 1285,1319 L 523,1319" fill="none" stroke="#B42318" stroke-width="1.6" /><path stroke-width="1.6" d="M 535,1313 L 523,1319 L 535,1325 Z" fill="#B42318" stroke="#B42318" /><rect x="527" y="1337" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1355" fill="#B42318">[Gap] Copy-result contract; SND-G05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1379" fill="#B42318">Report acknowledgement contract remains open</text><path d="M 523,1400 L 1285,1400" fill="none" stroke="#B42318" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 1273,1394 L 1285,1400 L 1273,1406" fill="none" stroke="#B42318" /><rect x="527" y="1788" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1806" fill="#1565C0">[Proposed] Spain binding; SPFE-S16 transport</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1830" fill="#1565C0">SendInvoice: qualified public original /</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1853" fill="#1565C0">interconnection action</text><path d="M 515,1874 L 892,1874" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1868 L 892,1874 L 880,1880 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1892" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1910" fill="#1565C0">[Proposed] Spain binding; SPFE-S16 transport</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1934" fill="#1565C0">Independent recipient-action result; no</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1957" fill="#1565C0">redundant public copy</text><path d="M 892,1978 L 515,1978" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1972 L 515,1978 L 527,1984" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2228" fill="#888888">Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2251" fill="#888888">Read each status label: Existing is source evidence; Proposed and red handoffs are not approved wire contracts or proof of Spain support.</text></svg>