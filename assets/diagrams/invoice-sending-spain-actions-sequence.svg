<svg aria-label="Spain final plan and independent actions" xmlns="http://www.w3.org/2000/svg" width="1415" height="1993" viewBox="0 0 1415 1993" role="img"><title>Spain final plan and independent actions</title><desc>Proposed logical handoffs; OUT-Q03 must prove issuance/copy coordination. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time. Existing labels identify supplied evidence; To qualify labels do not define new endpoints or deployed service boundaries.</desc><rect width="1415" height="1993" fill="white" /><rect x="8" y="8" width="1399" height="1977" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Spain final plan and independent actions</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Proposed logical handoffs; OUT-Q03 must prove issuance/copy coordination</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1890" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,1890" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice Service</text><path d="M 900,216 L 900,1890" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Public platform</text><path d="M 1285,216 L 1285,1890" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Private platform</text><rect x="48" y="700" width="1319" height="382" fill="none" stroke="#777777" rx="0" /><rect x="36" y="640" width="1343" height="634" fill="none" stroke="#777777" rx="0" /><rect x="24" y="580" width="1367" height="724" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1334" width="1367" height="382" fill="none" stroke="#777777" rx="0" /><rect x="507" y="326" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="942" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="1157" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="1576" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="48" y="700" width="1319" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="60" y="723" fill="#222222">ref | Logical ERP issuance + copy boundary; no physical atomicity claim</text><rect x="36" y="640" width="1343" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="663" fill="#222222">par | Independent copy and recipient actions; no shared completion</text><rect x="24" y="580" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="603" fill="#222222">alt | Qualified private route with a required public copy</text><rect x="24" y="1334" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1357" fill="#222222">else | Proven no private entry point; qualified public recipient route</text><rect x="38" y="466" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="490" fill="#222222">Complete current authority/approval, recipient eligibility, final-byte validation and trust. Freeze</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="513" fill="#222222">independent action identities before external execution.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="544" fill="#888888">OUT-08–11; OUT-Q01/03</text><rect x="38" y="760" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="784" fill="#222222">ERP issuance and copy transmission must meet the qualified boundary together. The call below shows public</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="807" fill="#222222">transport, not an approved scheduling or issuance API.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="838" fill="#888888">OUT-06/12; OUT-Q03; SPFE-S02 Article 4</text><rect x="38" y="1394" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1418" fill="#222222">Retain ERP issuance evidence for the qualified public-original path. This branch does not invoke the Article 4</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1441" fill="#222222">private-issuance copy boundary.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1472" fill="#888888">OUT-06/07/12; SND-G01/06</text><rect x="38" y="1746" width="1339" height="112" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1770" fill="#222222">The ref frame states a coordination obligation, not call timing. Private delivery success is not the copy</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1793" fill="#222222">trigger. Failed/stale/ambiguous lookup holds dispatch; reconcile each unknown action against its original</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1816" fill="#222222">context.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1846" fill="#888888">OUT-SPFE-R01; SPFE-S02 Article 4; OUT-09/13</text><rect x="142" y="240" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="258" fill="#888888">[To qualify] OUT-07–11; SND-G01/03/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="282" fill="#222222">Final candidate: stable identity,</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="305" fill="#222222">revision and business scope</text><path d="M 130,326 L 507,326" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,320 L 507,326 L 495,332 Z" fill="#444444" stroke="#444444" /><rect x="142" y="344" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="362" fill="#888888">[To qualify] OUT-07–11; SND-G01/03/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="386" fill="#222222">Qualified plan or owned hold; no</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="409" fill="#222222">issuance on a failed check</text><path d="M 507,430 L 130,430" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,424 L 130,430 L 142,436" fill="none" stroke="#444444" /><rect x="527" y="856" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="874" fill="#888888">[Existing transport] SPFE-S16; [To qualify] Spain binding</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="898" fill="#222222">SendInvoice: qualified faithful-copy</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="921" fill="#222222">Invoice attachment</text><path d="M 515,942 L 892,942" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,936 L 892,942 L 880,948 Z" fill="#444444" stroke="#444444" /><rect x="527" y="960" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="978" fill="#888888">[Existing transport] SPFE-S16; [To qualify] Spain binding</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1002" fill="#222222">Transport / request / item result; copy</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1025" fill="#222222">action evidence</text><path d="M 892,1046 L 515,1046" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1040 L 515,1046 L 527,1052" fill="none" stroke="#444444" /><rect x="527" y="1094" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1112" fill="#888888">[To qualify] OUT-12/13; SND-G02/04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1136" fill="#222222">Deliver exact invoice on the frozen recipient route</text><path d="M 515,1157 L 1277,1157" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,1151 L 1277,1157 L 1265,1163 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1175" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1193" fill="#888888">[To qualify] OUT-12/13; SND-G02/04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1217" fill="#222222">Independent recipient-delivery result or outcome unknown</text><path d="M 1277,1238 L 515,1238" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1232 L 515,1238 L 527,1244" fill="none" stroke="#444444" /><rect x="527" y="1490" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1508" fill="#888888">[Existing transport] SPFE-S16; OUT-09/12; SPFE-S02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1532" fill="#222222">SendInvoice: qualified public original /</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1555" fill="#222222">interconnection action</text><path d="M 515,1576 L 892,1576" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1570 L 892,1576 L 880,1582 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1594" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1612" fill="#888888">[Existing transport] SPFE-S16; OUT-09/12; SPFE-S02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1636" fill="#222222">Independent recipient-action result; no</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1659" fill="#222222">redundant public copy</text><path d="M 892,1680 L 515,1680" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1674 L 515,1680 L 527,1686" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1930" fill="#888888">Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1953" fill="#888888">Existing labels identify supplied evidence; To qualify labels do not define new endpoints or deployed service boundaries.</text></svg>