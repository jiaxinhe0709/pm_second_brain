gram-text" style="max-width:100%;overflow-wrap:break-word;">UV-02<br /><b>Resolve current pack</b><br />Activated profile and versions</div></div></foreignObject><polygon fill="#d7d7d7" stroke="#333333" stroke-width="2" points="1480.0,202 1600.0,257.0 1480.0,312.0 1360.0,257.0" /><foreignObject x="1378" y="220" width="204" height="74"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">DECISION<br /><b>Final pass?</b><br />No stale preview or loss</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1710" y="202" width="230" height="100" rx="8" /><foreignObject x="1722" y="214" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">UV-08<br /><b>Bind send intent</b><br />Hash, rules, route and trust</div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="2175" cy="252" rx="115" ry="50" /><foreignObject x="2072" y="214" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">END<br /><b>Return evidence</b><br />Exchange owns actual send</div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray