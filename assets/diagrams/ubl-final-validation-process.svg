<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">UBL final validation before dispatch</title><desc id="desc">The final signed or sent representation must match current route, profile, rules and trust plan. Preview is never a send authorisation. A blocking or undetermined final check stops the external mutation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">UBL final validation before dispatch</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">The final signed or sent representation must match current route, profile, rules and trust plan.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE COORDINATION</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">VALIDATION / ADAPTER</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">OPERATIONS / RECORDS</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; CONTEXT</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">ASSESS &amp; VALIDATE</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">DECIDE &amp; EXECUTE</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">EVIDENCE &amp; RECOVER</text><polyline points="540,221 600,221 600,393 660,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="890,393 950,393 950,591 1010,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1240,591 1300,591 1300,393 1360,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1600,393 1710,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1609.0" y="357" width="82" height="22" fill="white" opacity=".96"/><text x="1650" y="373" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">pass</text><polyline points="1940,393 2000,393 2000,221 2060,221" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1480,440 1480,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1502.0" y="634" width="156" height="22" fill="white" opacity=".96"/><text x="1580" y="650" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">blocked / unknown</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-07</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Request final check</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Exact bytes, route and revision</text><rect x="660" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="775.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-02</text><text x="775.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Resolve current pack</text><text x="775.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Activated profile and versions</text><rect x="1010" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1125.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-04</text><text x="1125.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Revalidate bytes</text><text x="1125.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Final target representation</text><polygon points="1480.0,350 1600,395.0 1480.0,440 1360,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2"/><text x="1480.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1480.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Final pass?</text><text x="1480.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">No stale preview or loss</text><rect x="1710" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1825.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-08</text><text x="1825.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Bind send intent</text><text x="1825.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Hash, rules, route and trust</text><ellipse cx="2175.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2175.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2175.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Return evidence</text><text x="2175.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Exchange owns actual send</text><polygon points="1384,755 1576,755 1600,798.0 1576,841 1384,841 1360,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1480.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-05</text><text x="1480.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Return blocking issue</text><text x="1480.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Customer or Sage action</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">Preview is never a send authorisation. A blocking or undetermined final check stops the external mutation.</text></svg>