<svg aria-label="Public readiness" xmlns="http://www.w3.org/2000/svg" width="1030" height="1775" viewBox="0 0 1030 1775" role="img"><title>Public readiness</title><desc>Phase 1: assess selected functions through qualified checks. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid requests; dashed paired responses; grey activation bars. Timing and service placement remain proposed. Current business access is required. HTTP success is separate from readiness and activation. Unknown evidence holds dependent work.</desc><rect width="1030" height="1775" fill="white" /><rect x="8" y="8" width="1014" height="1759" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Public readiness</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Phase 1: assess selected functions through qualified checks</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1022,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1649" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">Product</text><path d="M 515,216 L 515,1649" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1649" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Public platform</text><rect x="24" y="258" width="982" height="68" fill="none" stroke="#777777" rx="0" /><rect x="24" y="356" width="982" height="245" fill="none" stroke="#777777" rx="0" /><rect x="36" y="876" width="958" height="291" fill="none" stroke="#777777" rx="0" /><rect x="24" y="631" width="982" height="566" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1308" width="982" height="222" fill="none" stroke="#777777" rx="0" /><rect x="507" y="461" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="736" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1027" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="1413" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1272" width="16" height="333" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="258" width="982" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#222222">ref | Shared prerequisites (2.1); only missing/stale work; pass before dependent checks</text><rect x="24" y="356" width="982" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="379" fill="#222222">opt | A supported service choice is needed</text><rect x="36" y="876" width="958" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="899" fill="#222222">opt | Known connection needs detail</text><rect x="24" y="631" width="982" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start"