e="17" text-anchor="middle" x="322.5" y="1110" fill="#222222">Per-address status and errors</text><path d="M 507,1131 L 130,1131" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1125 L 130,1131 L 142,1137" fill="none" stroke="#444444" /><rect x="142" y="1209" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1227" fill="#888888">[To qualify] Logical request; ONB-03/04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1251" fill="#222222">Assess selected public functions</text><path d="M 130,1272 L 507,1272" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1266 L 507,1272 L 495,1278 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1350" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1368" fill="#888888">[To qualify] Selected public contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1392" fill="#222222">Check selected public access</text><path d="M 523,1413 L 892,1413" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1407 L 892,1413 L 880,1419 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1431" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1449" fill="#888888">[To qualify] Selected public contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1473" fill="#222222">Public evidence / limitation</text><path d="M 892,1494 L 523,1494" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1488 L 523,1494 L 535,1500" fill="none" stroke="#444444" /><rect 