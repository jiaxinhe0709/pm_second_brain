<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1100" viewBox="0 0 3200 1100" role="img" aria-labelledby="title desc"><title id="title">Public platform connector: controlled calls and recovery</title><desc id="desc">Proposed logical design. Solid arrows: execution. Dashed arrows: evidence, notification or original-operation recovery. Feature owners interpret business results. Readiness does not activate routes. Unknown effects remain held until proven safe to resume.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="3200" height="1100" fill="white"/><text x="25" y="45" text-anchor="start" font-family="Arial" font-size="27" font-weight="700" fill="#111">Public platform connector: controlled calls and recovery</text><text x="25" y="75" text-anchor="start" font-family="Arial" font-size="15" font-weight="400" fill="#444">Proposed logical design. Solid arrows: execution. Dashed arrows: evidence, notification or original-operation recovery.</text><rect x="25" y="145" width="3150" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="3150" height="190" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="190" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE CONNECTOR</text><rect x="25" y="510" width="3150" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="510" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="552" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">AUTHORITY</text><text x="145" y="574" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">PUBLIC PLATFORM</text><rect x="25" y="705" width="3150" height="350" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="705" width="240" height="350" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="750" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">OPERATIONS / RECORDS</text><rect x="285" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="625.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; CONTEXT</text><rect x="975" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="1315.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">ASSESS &amp; QUALIFY</text><rect x="1665" y="98" width="740" height="28" rx="6" fill="#d7d7d7"/><text x="2035.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">INTENT &amp; EXECUTE</text><rect x="2415" y="98" width="760" height="28" rx="6" fill="#d7d7d7"/><text x="2795.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">EVIDENCE &amp; RECOVER</text><polyline points="570,221 595,221 595,393 620,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="880,393 905,393 905,591 930,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="881.25" y="466" width="47.5" height="19" fill="white"/><text x="905" y="480" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">check</text><polyline points="1190,591 1215,591 1215,393 1240,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="1153.45" y="469" width="123.1" height="19" fill="white"/><text x="1215" y="483" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">decision evidence</text><polyline points="1500,393 1540,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1660,438 1660,755" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1611.05" y="672" width="97.89999999999999" height="19" fill="white"/><text x="1660" y="686" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">no: safe hold</text><polyline points="1780,393 1820,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1782.55" y="361" width="34.9" height="19" fill="white"/><text x="1800" y="375" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">yes</text><polyline points="2080,393 2105,393 2105,591 2130,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="2074.95" y="471" width="60.1" height="19" fill="white"/><text x="2105" y="485" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">execute</text><polyline points="2390,591 2415,591 2415,393 2440,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="2347.15" y="469" width="135.7" height="19" fill="white"/><text x="2415" y="483" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">correlated response</text><polyline points="2390,611 2430,611 2430,775 2440,775" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="2399.95" y="677" width="60.1" height="19" fill="white"/><text x="2430" y="691" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">unknown</text><polyline points="2570,436 2570,755" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="2524.2" y="666" width="91.6" height="19" fill="white"/><text x="2570" y="680" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">evidence gap</text><polyline points="2700,393 2800,393 2800,221 2840,221" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="2747.9" y="301" width="104.2" height="19" fill="white"/><text x="2800" y="315" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">durable result</text><polyline points="2440,810 2410,810 2410,675 2260,675 2260,634" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="2245.3" y="653" width="129.39999999999998" height="19" fill="white"/><text x="2310" y="667" text-anchor="middle" font-family="Arial" font-size="11" font-weight="400" fill="#333">reconcile original</text><ellipse cx="440.0" cy="221.0" rx="130.0" ry="43.0" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="440.0" y="205.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-01</text><text x="440.0" y="225.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Accept feature intent</text><text x="440.0" y="245.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Stable operation and digest</text><rect x="620" y="350" width="260" height="86" rx="7" fill="#e8e8e8" stroke="#333" stroke-width="2"/><text x="750.0" y="377.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-02</text><text x="750.0" y="397.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Resolve trusted scope</text><text x="750.0" y="417.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Tenant, entity, environment</text><rect x="930" y="548" width="260" height="86" rx="7" fill="#e8e8e8" stroke="#333" stroke-width="2"/><text x="1060.0" y="575.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-03</text><text x="1060.0" y="595.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Check authority / credentials</text><text x="1060.0" y="615.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Exact action and purpose</text><rect x="1240" y="350" width="260" height="86" rx="7" fill="#e8e8e8" stroke="#333" stroke-width="2"/><text x="1370.0" y="377.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-04</text><text x="1370.0" y="397.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Select qualified capability</text><text x="1370.0" y="417.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Exact contract and readiness</text><polygon points="1660.0,348 1780,393.0 1660.0,438 1540,393.0" fill="#d7d7d7" stroke="#333" stroke-width="2"/><text x="1660.0" y="397.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">All gates pass?</text><polygon points="1550.8,755 1769.2,755 1790,805.0 1769.2,855 1550.8,855 1530,805.0" fill="#f6f6f6" stroke="#333" stroke-width="2" stroke-dasharray="7 5"/><text x="1660.0" y="789.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">HELD</text><text x="1660.0" y="809.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Denied or unsupported</text><text x="1660.0" y="829.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">No external effect</text><rect x="1820" y="350" width="260" height="86" rx="7" fill="#e8e8e8" stroke="#333" stroke-width="2"/><text x="1950.0" y="377.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-05</text><text x="1950.0" y="397.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Save intent / claim attempt</text><text x="1950.0" y="417.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Original identity and versions</text><rect x="2130" y="548" width="260" height="86" rx="7" fill="#e8e8e8" stroke="#333" stroke-width="2"/><text x="2260.0" y="575.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-06</text><text x="2260.0" y="595.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Execute public operation</text><text x="2260.0" y="615.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Bounded call, fixed target</text><rect x="2440" y="350" width="260" height="86" rx="7" fill="#e8e8e8" stroke="#333" stroke-width="2"/><text x="2570.0" y="377.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-07</text><text x="2570.0" y="397.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Commit correlated evidence</text><text x="2570.0" y="417.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Item result and capture receipt</text><ellipse cx="2970.0" cy="221.0" rx="130.0" ry="43.0" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="2970.0" y="205.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-08</text><text x="2970.0" y="225.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Return / notify feature</text><text x="2970.0" y="245.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Known, pending or unknown</text><polygon points="2461.6,755 2688.4,755 2710,812.5 2688.4,870 2461.6,870 2440,812.5" fill="#f6f6f6" stroke="#333" stroke-width="2" stroke-dasharray="7 5"/><text x="2575.0" y="786.5" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-09</text><text x="2575.0" y="806.5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Recover original operation</text><text x="2575.0" y="826.5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Query before unsafe repeat</text><text x="2575.0" y="846.5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Unresolved stays owned</text><rect x="1820" y="920" width="280" height="108" rx="7" fill="#e8e8e8" stroke="#333" stroke-width="2"/><text x="1960.0" y="948.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#111">PCN-10</text><text x="1960.0" y="968.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#111">Change profile / disable</text><text x="1960.0" y="988.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Prospective, scoped and audited</text><text x="1960.0" y="1008.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#111">Preserve pending/history</text><text x="25" y="1082" text-anchor="start" font-family="Arial" font-size="12" font-weight="400" fill="#444">Feature owners interpret business results. Readiness does not activate routes. Unknown effects remain held until proven safe to resume.</text></svg>