<text x="2425.0" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Checkpoint or scan coverage</text>
<rect x="2660" y="390" width="280" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="2800.0" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Publish availability</text>
<text x="2800.0" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">One business invoice; source age</text>
<polygon points="644,900 846,900 870,947.5 846,995 644,995 620,947.5" fill="#f4f4f4" stroke="#222" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="745.0" y="933" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Hold ineligible scope</text>
<text x="745.0" y="957" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Keep checkpoint and explain</text>
<text x="745.0" y="973" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">action</text>
<polygon points="1244,900 1446,900 1470,947.5 1446,995 1244,995 1220,947.5" fill="#f4f4f4" stroke="#222" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1345.0" y="933" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Retry or bounded rescan</text>
<text x="1345.0" y="957" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Backoff or invalid-cursor</text>
<text x="1345.0" y="973" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">recovery</text>
<polygon points="1694,900 1896,900 1920,947.5 1896,995 1694,995 1670,947.5" fill="#f4f4f4" stroke="#222" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1795.0" y="933" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Quarantine conflict</text>
<text x="1795.0" y="957" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Preserve identity and</text>
<text x="1795.0" y="973" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">evidence</text>
<polygon points="2024,900 2226,900 2250,947.5 2226,995 2024,995 2000,947.5" fill="#f4f4f4" stroke="#222" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="2125.0" y="933" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Resume incomplete page</text>
<text x="2125.0" y="957" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Do not advance past unsafe</text>
<text x="2125.0" y="973" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">items</text>
<text x="35" y="1130" font-family="Arial,sans-serif" font-size="13" fill="#444">Solid arrows = process; dashed arrows = hold or correction. Country and provider details require source evidence.</text>
