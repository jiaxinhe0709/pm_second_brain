<text x="425.0" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Consultation due</text>
<text x="425.0" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Scheduled baseline; controlled</text>
<text x="425.0" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">refresh</text>
<ellipse cx="745.0" cy="217.5" rx="125.0" ry="47.5" fill="#fff" stroke="#222" stroke-width="2.2"/>
<text x="745.0" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Reconciliation due</text>
<text x="745.0" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Independent historical window</text>
<polygon points="2684,170 2940,170 2916,265 2660,265" fill="#fff" stroke="#222" stroke-width="2.2"/>
<text x="2800.0" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Invoice and freshness view</text>
<text x="2800.0" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">New items, no result, stale or</text>
<text x="2800.0" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">failed</text>
<rect x="620" y="390" width="250" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="745.0" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Check run scope</text>
<text x="745.0" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Route, authority and policy</text>
<rect x="920" y="390" width="250" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="1045.0" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Schedule and lease</text>
<text x="1045.0" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Coalesce triggers; rate limit</text>
<rect x="1220" y="390" width="250" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="1345.0" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Query safe window</text>
<text x="1345.0" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Checkpoint, overlap and page ID</text>
<polygon points="1242,660 1448,660 1470,760 1220,760" fill="#fff" stroke="#555" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1345.0" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Consult / download</text>
<text x="1345.0" y="717" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Page, cursor and correlation</text>
<rect x="1670" y="390" width="250" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="1795.0" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Classify and persist</text>
<text x="1795.0" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">New, duplicate, empty or invalid</text>
<polygon points="2125.0,390 2250,440.0 2125.0,490 2000,440.0" fill="#d1d1d1" stroke="#222" stroke-width="2.2"/>
<text x="2125.0" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Boundary durable?</text>
<text x="2125.0" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Every item classified</text>
<text x="2125.0" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">and stored</text>
<path d="M2300 403 V477 C2300 493 2550 493 2550 477 V403 Z" fill="#e0e0e0" stroke="#333" stroke-width="2.2"/>
