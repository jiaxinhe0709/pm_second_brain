<text x="725.0" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Retain and investigate</text>
<rect x="300" y="385" width="250" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="425.0" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Ingest observation</text>
<text x="425.0" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Authenticate source and identity</text>
<polygon points="725.0,385 850,435.0 725.0,485 600,435.0" fill="#d1d1d1" stroke="#222" stroke-width="2.2"/>
<text x="725.0" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Correlate to invoice</text>
<text x="725.0" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Original route, action</text>
<text x="725.0" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">and actor</text>
<path d="M900 398 V472 C900 488 1150 488 1150 472 V398 Z" fill="#e0e0e0" stroke="#333" stroke-width="2.2"/>
<ellipse cx="1025.0" cy="398" rx="125.0" ry="13" fill="#e0e0e0" stroke="#333" stroke-width="2.2"/>
<text x="1025.0" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Raw event ledger</text>
<text x="1025.0" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Code, reason, time and source</text>
<rect x="1200" y="385" width="250" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="1325.0" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Map business meaning</text>
<text x="1325.0" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Versioned country/network rules</text>
<path d="M1500 385 H1750 V472 Q1690 458 1630 472 T1500 472 Z" fill="#fff" stroke="#333" stroke-width="2.2"/>
<text x="1625.0" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Create obligations</text>
<text x="1625.0" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Recipient and authority independent</text>
<path d="M2200 398 V472 C2200 488 2450 488 2450 472 V398 Z" fill="#e0e0e0" stroke="#333" stroke-width="2.2"/>
<ellipse cx="2325.0" cy="398" rx="125.0" ry="13" fill="#e0e0e0" stroke="#333" stroke-width="2.2"/>
<text x="2325.0" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Track each result</text>
<text x="2325.0" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Ack, retry, conflict and freshness</text>
<polygon points="1224,690 1426,690 1450,735.0 1426,780 1224,780 1200,735.0" fill="#f4f4f4" stroke="#222" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1325.0" y="723" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Unknown code</text>
<text x="1325.0" y="747" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Preserve raw; do not guess</text>
<polygon points="1672,690 1898,690 1920,780 1650,780" fill="#fff" stroke="#555" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1785.0" y="723" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Counterparty update</text>
<text x="1785.0" y="747" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Original invoice route</text>
<polygon points="1972,690 2198,690 2220,780 1950,780" fill="#fff" stroke="#555" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="2085.0" y="723" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Authority report</text>
<text x="2085.0" y="747" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Only where required</text>
<polygon points="2224,920 2450,920 2426,1010 2200,1010" fill="#fff" stroke="#222" stroke-width="2.2"/>
<text x="2325.0" y="953" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Current lifecycle view</text>
<text x="2325.0" y="977" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Technical, commercial, payment,</text>
<text x="2325.0" y="993" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">report</text>
<text x="35" y="1030" font-family="Arial,sans-serif" font-size="13" fill="#444">Solid arrows = process; dashed arrows = hold or correction. Country and provider details require source evidence.</text>
</svg>