<rect x="712.5" y="320" width="75" height="18" rx="3" fill="#fff" opacity=".96"/>
<text x="750" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#333">Unmatched</text>
<rect x="1319.5" y="595" width="61" height="18" rx="3" fill="#fff" opacity=".96"/>
<text x="1350" y="608" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#333">Unknown</text>
<ellipse cx="425.0" cy="225.0" rx="125.0" ry="45.0" fill="#fff" stroke="#222" stroke-width="2.2"/>
<text x="425.0" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Event observed</text>
<text x="425.0" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Buyer, ERP or platform source</text>
<polygon points="624,180 826,180 850,225.0 826,270 624,270 600,225.0" fill="#f4f4f4" stroke="#222" stroke-width="2.2" stroke-dasharray="6 4"/>
