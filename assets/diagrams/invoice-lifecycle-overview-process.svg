<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1830" viewBox="0 0 1400 1830" role="img" aria-label="Invoice lifecycle: show what happened and what needs action"><title>Invoice lifecycle: show what happened and what needs action</title><desc>Business facts, status-change attempts and destination reporting have separate results.</desc><rect width="1400" height="1830" fill="white" /><text x="28" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222">Invoice lifecycle: show what happened and what needs action</text><text x="28" y="65" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">Business facts, status-change attempts and destination reporting have separate results.</text><text x="28" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Proposed design · Solid: saved evidence and results · Dashed: reporting only when applicable</text><text x="28" y="143" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Read top to bottom. Branches apply only to the selected source or required action.</text><path d="M 700,284 L 700,340" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 700,340 L 704.0,332.0 L 696.0,332.0 Z" fill="#555555" /><path d="M 700,444 L 700,500" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 700,500 L 704.0,492.0 L 696.0,492.0 Z" fill="#555555" /><path d="M 700,604 L 700,660" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 700,660 L 704.0,652.0 L 696.0,652.0 Z" fill="#555555" /><path d="M 700,764 L 700,820" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 700,820 L 704.0,812.0 L 696.0,812.0 Z" fill="#555555" /><path d="M 700,924 L 700,1050" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 4" /><path d="M 700,1050 L 704.0,1042.0 L 696.0,1042.0 Z" fill="#555555" /><path d="M 500,872 L 70,872 L 70,1470 L 700,1470 L 700,1530" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 4" /><path d="M 700,1530 L 704.0,1522.0 L 696.0,1522.0 Z" fill="#555555" /><path d="M 700,1154 L 700,1200 L 380,1200 L 380,1270" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 4" /><path d="M 380,1270 L 384.0,1262.0 L 376.0,1262.0 Z" fill="#555555" /><path d="M 700,1154 L 700,1200 L 1020,1200 L 1020,1270" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 4" /><path d="M 1020,1270 L 1024.0,1262.0 L 1016.0,1262.0 Z" fill="#555555" /><path d="M 380,1374 L 380,1430 L 700,1430 L 700,1530" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 700,1530 L 704.0,1522.0 L 696.0,1522.0 Z" fill="#555555" /><path d="M 1020,1374 L 1020,1430 L 700,1430 L 700,1530" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 700,1530 L 704.0,1522.0 L 696.0,1522.0 Z" fill="#555555" /><a href="../../specs/invoice-lifecycle/SPEC-SEI-029-invoice-lifecycle-logical-feature-specification.md" aria-label="LCS-01 Read platform evidence or an authorised business fact"><title>Existing invoice and its original source context</title><rect x="400" y="180" width="600" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="206" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Read platform evidence or an authorised business fact</text><text x="700.0" y="252" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Existing invoice and its original source context</text><text x="700.0" y="272" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">LCS-01</text></a><a href="../../specs/invoice-lifecycle/SPEC-SEI-029-invoice-lifecycle-logical-feature-specification.md" aria-label="LCS-02 Check invoice, business, actor and permission"><title>Hold unknown or unauthorised work</title><rect x="400" y="340" width="600" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="366" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Check invoice, business, actor and permission</text><text x="700.0" y="412" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Hold unknown or unauthorised work</text><text x="700.0" y="432" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">LCS-02</text></a><a href="../../specs/invoice-lifecycle/SPEC-SEI-029-invoice-lifecycle-logical-feature-specification.md" aria-label="LCS-03/04 Save evidence and apply country rules"><title>Keep raw codes, times and correction history</title><rect x="400" y="500" width="600" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="526" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Save evidence and apply country rules</text><text x="700.0" y="572" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Keep raw codes, times and correction history</text><text x="700.0" y="592" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">LCS-03/04</text></a><a href="../../specs/invoice-lifecycle/SPEC-SEI-029-invoice-lifecycle-logical-feature-specification.md" aria-label="LCS-05/06 Update the supported invoice facts"><title>Delivery, decisions, payment and reports stay separate</title><rect x="400" y="660" width="600" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="686" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Update the supported invoice facts</text><text x="700.0" y="732" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Delivery, decisions, payment and reports stay separate</text><text x="700.0" y="752" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">LCS-05/06</text></a><a href="../../specs/invoice-lifecycle/SPEC-SEI-029-invoice-lifecycle-logical-feature-specification.md" aria-label="LCS-07 Is an outgoing report required?"><title>Is an outgoing report required?</title><path d="M 700.0,820 L 900,872.0 L 700.0,924 L 500,872.0 Z" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="862" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222222">Is an outgoing report</text><text x="700.0" y="880" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222222">required?</text><text x="700.0" y="898" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">LCS-07</text></a><a href="../../specs/invoice-lifecycle/SPEC-SEI-029-invoice-lifecycle-logical-feature-specification.md" aria-label="LCS-07/08 Select each report and its execution owner"><title>Required fields, destination, original route and deadline</title><rect x="400" y="1050" width="600" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="1076" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Select each report and its execution owner</text><text x="700.0" y="1122" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Required fields, destination, original route and deadline</text><text x="700.0" y="1142" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">LCS-07/08</text></a><a href="../../specs/invoice-lifecycle/SPEC-SEI-029-invoice-lifecycle-logical-feature-specification.md" aria-label="LCS-09 Send the required public report"><title>Recipient or issuer contract; Spain fields confirmed</title><rect x="130" y="1270" width="500" height="104" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="380.0" y="1296" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Send the required public report</text><text x="380.0" y="1342" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Recipient or issuer contract; Spain fields confirmed</text><text x="380.0" y="1362" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">LCS-09</text></a><a href="../../specs/invoice-lifecycle/SPEC-SEI-029-invoice-lifecycle-logical-feature-specification.md" aria-label="LCS-09 Send the required private report"><title>Only where applicable; identify provider-owned reports</title><rect x="770" y="1270" width="500" height="104" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1020.0" y="1296" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Send the required private report</text><text x="1020.0" y="1342" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Only where applicable; identify provider-owned reports</text><text x="1020.0" y="1362" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">LCS-09</text></a><a href="../../specs/invoice-lifecycle/SPEC-SEI-029-invoice-lifecycle-logical-feature-specification.md" aria-label="LCS-06/10 Show facts, report results and next actions"><title>Each destination keeps its own result and action owner</title><rect x="400" y="1530" width="600" height="110" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="1556" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Show facts, report results and next actions</text><text x="700.0" y="1602" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Each destination keeps its own result and action owner</text><text x="700.0" y="1622" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">LCS-06/10</text></a><text x="720" y="992" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Yes</text><text x="90" y="1000" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">No outgoing report</text><text x="200" y="1240" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">If required</text><text x="840" y="1240" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">If required</text><text x="28" y="1740" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Unknown codes or conflicting evidence need review. Keep known facts and the last successful status when an attempt fails.</text><text x="28" y="1764" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">A timeout keeps the external result unknown. Check the original report before unsafe replay or cancellation replacement.</text><text x="28" y="1788" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Public and private reports can both apply. Incoming already-reported evidence does not automatically create another report.</text></svg>