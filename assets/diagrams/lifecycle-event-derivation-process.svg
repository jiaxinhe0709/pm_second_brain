<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Lifecycle status: capture, map and derive</title><desc id="desc">Raw source facts are preserved before country interpretation and independent customer views. A raw event may affect zero or several dimensions. Technical acknowledgement never proves buyer approval or payment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Lifecycle status: capture, map and derive</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">Raw source facts are preserved before country interpretation and independent customer views.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SOURCE / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">LIFECYCLE SERVICE</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">COUNTRY / ADAPTER</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">OPERATIONS / RECORDS</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">OBSERVE &amp; VERIFY</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">PRESERVE &amp; INTERPRET</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">DERIVE &amp; DELIVER</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">EXPLAIN &amp; RECOVER</text><polyline points="540,221 590,221 590,393 650,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="880,393 930,393 930,798 990,798" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1220,798 1270,798 1270,591 1330,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1560,591 1610,591 1610,393 1670,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1900,393 2010,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="2240,393 2380,393 2380,221 2440,221" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1445,634 1445,798 1670,798" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1509.0" y="764" width="82" height="22" fill="white" opacity=".96"/><text x="1550" y="780" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">unknown</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">LCS-01</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Receive event</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Platform, ERP or buyer source</text><rect x="650" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="765.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">LCS-02</text><text x="765.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Verify context</text><text x="765.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Actor, invoice and original route</text><rect x="990" y="755" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1105.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">LCS-03</text><text x="1105.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Preserve raw fact</text><text x="1105.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Namespace, time, hash and links</text><rect x="1330" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1445.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">LCS-04</text><text x="1445.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Map effective pack</text><text x="1445.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Country and provider versions</text><rect x="1670" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1785.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">LCS-05</text><text x="1785.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Derive dimensions</text><text x="1785.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Exchange, commercial, payment</text><rect x="2010" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2125.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">LCS-06</text><text x="2125.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Publish safe view</text><text x="2125.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Source, freshness, next action</text><ellipse cx="2555.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2555.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2555.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Show history</text><text x="2555.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Raw events remain available</text><polygon points="1694,755 1876,755 1900,798.0 1876,841 1694,841 1670,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1785.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">LCS-10</text><text x="1785.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Resolve unknown</text><text x="1785.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Unmapped or conflicting fact</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">A raw event may affect zero or several dimensions. Technical acknowledgement never proves buyer approval or payment.</text></svg>