r;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">END<br /><b>Show history</b><br />Raw events remain available</div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="765" cy="430" rx="115" ry="50" /><foreignObject x="662" y="392" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-01<br /><b>Receive status or event</b><br />Keep the source identity</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="990" y="380" width="230" height="100" rx="8" /><foreignObject x="1002" y="392" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-02<br /><b>Verify context</b><br />Actor, invoice and original route</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1330" y="380" width="230" height="100" rx="8" /><foreignObject x="1342" y="392" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-03<br /><b>Preserve raw fact</b><br />Namespace, time, hash and links</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2010" y="380" width="230" height="100" rx="8" /><foreignObject x="2022" y="392" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-05<br /><b>Update status view</b><br />Exchange, commercial, payment</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2350" y="380" width="230" height="100" rx="8" /><foreignObject x="2362" y="392" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-06<br /><b>Share status and history</b><br />Source, freshness, next action</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1670" y="558" width="230" height="100" rx="8" /><foreignObject x="1682" y="570" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-04<br /><b>Interpret source information</b><br />Country and provider rules</div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="2032.0,736.0 2218.0,736.0 2240.0,786.0 2218.0,836.0 2032.0,836.0 2010.0,786.0" /><foreignObject x="2022" y="748" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">LCS-10<br /><b>Resolve unknown</b><br />Unmapped or conflicting fact</div></div></foreignObject><rect fill="#ffffff" stroke="#333333" stroke-width="2" x="310" y="914" width="230" height="100" rx="8" /><foreignObject x="322" y="926" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">SOURCE<br /><b>Provide status information</b><br />Query result or supported notification</div></div></foreignObject><foreignObject x="25" y="1089" width="3090" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Public/private platform status information and authorised customer/ERP events are separate inputs. Public status queries are established in Article 10; automatic notifications require a confirmed contract. Technical acknowledgement does not prove buyer acceptance or payment.</div></div></foreignObject></svg>