t-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Show the invoice history</b><br /><span style="font-size:12px">Original events remain available</span></div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="765" cy="430" rx="115" ry="50" /><foreignObject x="656" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Receive status or a business event</b><br /><span style="font-size:12px">Keep the source identity</span><br /><span style="font-size:11px;color:#555">LCS-01</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="990" y="380" width="230" height="100" rx="8" /><foreignObject x="996" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check the event&#x27;s identity and context</b><br /><span style="font-size:12px">Actor, invoice and original route</span><br /><span style="font-size:11px;color:#555">LCS-02</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1330" y="380" width="230" height="100" rx="8" /><foreignObject x="1336" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Save the original event evidence</b><br /><span style="font-size:12px">Source codes, time, hash and links</span><br /><span style="font-size:11px;color:#555">LCS-03</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2010" y="380" width="230" height="100" rx="8" /><foreignObject x="2016" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Update the invoice status view</b><br /><span style="font-size:12px">Keep exchange, business and payment separate</span><br /><span style="font-size:11px;color:#555">LCS-05</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2350" y="380" width="230" height="100" rx="8" /><foreignObject x="2356" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Share status and history</b><br /><span style="font-size:12px">Source, freshness and next action</span><br /><span style="font-size:11px;color:#555">LCS-06</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1670" y="558" width="230" height="100" rx="8" /><foreignObject x="1676" y="564" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Interpret the source information</b><br /><span style="font-size:12px">Use country and provider rules</span><br /><span style="font-size:11px;color:#555">LCS-04</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="2032.0,736.0 2218.0,736.0 2240.0,786.0 2218.0,836.0 2032.0,836.0 2010.0,786.0" /><foreignObject x="2016" y="742" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Investigate unclear information</b><br /><span style="font-size:12px">Unknown code or conflicting event</span><br /><span style="font-size:11px;color:#555">LCS-10</span></div></div></foreignObject><rect fill="#ffffff" stroke="#333333" stroke-width="2" x="310" y="914" width="230" height="100" rx="8" /><foreignObject x="316" y="920" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Provide platform status information</b><br /><span style="font-size:12px">Query result or supported notification</span></div></div></foreignObject><foreignObject x="25" y="1089" width="3090" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Public/private platform status information and authorised customer/ERP events are separate inputs. Public status queries are established in Article 10; automatic notifications require a confirmed contract. Technical acknowledgement does not prove buyer acceptance or payment.</div></div></foreignObject></svg>