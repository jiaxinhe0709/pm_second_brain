<svg aria-label="Receive events and update invoice status" xmlns="http://www.w3.org/2000/svg" width="3140" height="1164" viewBox="0 0 3140 1164" role="img"><title>Receive events and update invoice status</title><desc>Raw source facts are preserved before country interpretation and independent customer views. A raw event may affect zero or several dimensions. Technical acknowledgement never proves buyer approval or payment. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</desc><rect width="3140" height="1164" fill="white" /><foreignObject x="25" y="15" width="3090" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:26px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Receive events and update invoice status</b></div></div></foreignObject><foreignObject x="25" y="58" width="3090" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="285" y="98" width="925" height="28" rx="8" /><foreignObject x="287" y