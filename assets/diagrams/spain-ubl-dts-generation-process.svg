<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230" role="img" aria-labelledby="title desc"><title id="title">Spain UBL: generate, retrieve and recover invoice files</title><desc id="desc">Proposed flow • one saved conversion request • DTS does not send an invoice Acceptance uncertainty reconciles the same operation. Technical replay retains the pinned mapper and rules. Invalid output has no successful download. Correction creates a new revision; downstream dispatch is separate.</desc><rect width="1600" height="1230" fill="white" /><text x="25" y="46" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#333">Spain UBL: generate, retrieve and recover invoice files</text><text x="25" y="80" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#333">Proposed flow • one saved conversion request • DTS does not send an invoice</text><rect x="25" y="115" width="440" height="1035" rx="8" fill="#f6f6f6" stroke="#ccc" /><rect x="25" y="115" width="440" height="60" rx="8" fill="#dedede" /><rect x="580" y="115" width="440" height="1035" rx="8" fill="#f6f6f6" stroke="#ccc" /><rect x="580" y="115" width="440" height="60" rx="8" fill="#dedede" /><rect x="1135" y="115" width="440" height="1035" rx="8" fill="#f6f6f6" stroke="#ccc" /><rect x="1135" y="115" width="440" height="60" rx="8" fill="#dedede" /><polyline points="420,224 625,224" fill="none" stroke="#4c555c" stroke-width="2.4" /><polygon points="625,224 615,219 615,229" fill="#4c555c" /><polyline points="800,268 800,365" fill="none" stroke="#4c555c" stroke-width="2.4" /><polygon points="800,365 795,355 805,355" fill="#4c555c" /><polyline points="975,409 1180,409" fill="none" stroke="#4c555c" stroke-width="2.4" stroke-dasharray="7 5" /><polygon points="1180,409 1170,404 1170,414" fill="#4c555c" /><rect x="1031.0" y="372" width="98" height="23" rx="3" fill="white" /><text x="1080" y="388" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#4c555c">async work</text><polyline points="1355,453 1355,550" fill="none" stroke="#4c555c" stroke-width="2.4" /><polygon points="1355,550 1350,540 1360,540" fill="#4c555c" /><polyline points="1355,638 1355,735" fill="none" stroke="#4c555c" stroke-width="2.4" /><polygon points="1355,735 1350,725 1360,725" fill="#4c555c" /><rect x="1375.0" y="677" width="50" height="23" rx="3" fill="white" /><text x="1400" y="693" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#4c555c">pass</text><polyline points="1180,779 975,779" fill="none" stroke="#4c555c" stroke-width="2.4" /><polygon points="975,779 985,774 985,784" fill="#4c555c" /><polyline points="625,779 420,779" fill="none" stroke="#4c555c" stroke-width="2.4" /><polygon points="420,779 430,774 430,784" fill="#4c555c" /><polyline points="625,409 420,409" fill="none" stroke="#956720" stroke-width="2.4" stroke-dasharray="7 5" /><polygon points="420,409 430,404 430,414" fill="#956720" /><rect x="436.0" y="372" width="178" height="23" rx="3" fill="white" /><text x="525" y="388" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#956720">acceptance uncertain</text><polyline points="245,365 245,315 800,315 800,365" fill="none" stroke="#956720" stroke-width="2.4" stroke-dasharray="7 5" /><polygon points="800,365 795,355 805,355" fill="#956720" /><rect x="439.0" y="288" width="162" height="23" rx="3" fill="white" /><text x="520" y="304" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#956720">original operation</text><polyline points="1355,823 1355,910 800,910 800,970" fill="none" stroke="#956720" stroke-width="2.4" stroke-dasharray="7 5" /><polygon points="800,970 795,960 805,960" fill="#956720" /><rect x="877.0" y="878" width="226" height="23" rx="3" fill="white" /><text x="990" y="894" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#956720">technical / partial commit</text><polyline points="1530,594 1560,594 1560,1014 1530,1014" fill="none" stroke="#a34141" stroke-width="2.4" stroke-dasharray="7 5" /><polygon points="1530,1014 1540,1009 1540,1019" fill="#a34141" /><rect x="1443.0" y="857" width="74" height="23" rx="3" fill="white" /><text x="1480" y="873" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#a34141">blocked</text><polyline points="1355,1058 1355,1110 245,1110 245,1058" fill="none" stroke="#a34141" stroke-width="2.4" stroke-dasharray="7 5" /><polygon points="245,1058 240,1068 250,1068" fill="#a34141" /><rect x="655.0" y="1120" width="290" height="23" rx="3" fill="white" /><text x="800" y="1136" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#a34141">correct source after known outcome</text><polyline points="70,1014 40,1014 40,224 70,224" fill="none" stroke="#a34141" stroke-width="2.4" stroke-dasharray="7 5" /><polygon points="70,224 60,219 60,229" fill="#a34141" /><rect x="70" y="180" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2" /><rect x="625" y="180" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2" /><rect x="625" y="365" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2" /><rect x="1180" y="365" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2" /><rect x="1180" y="550" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2" /><rect x="1180" y="735" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2" /><rect x="625" y="735" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2" /><rect x="70" y="735" width="350" height="88" rx="44" fill="#ffffff" stroke="#444" stroke-width="2" /><polygon points="90,365 400,365 420,385 420,433 400,453 90,453 70,433 70,385" fill="#fff5df" stroke="#956720" stroke-width="2" /><polygon points="645,970 955,970 975,990 975,1038 955,1058 645,1058 625,1038 625,990" fill="#fff5df" stroke="#956720" stroke-width="2" /><rect x="1180" y="970" width="350" height="88" rx="10" fill="#fff2f2" stroke="#a34141" stroke-width="2" /><rect x="70" y="970" width="350" height="88" rx="10" fill="#fff2f2" stroke="#a34141" stroke-width="2" /><text x="25" y="1180" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#333">Acceptance uncertainty reconciles the same operation. Technical replay retains the pinned mapper and rules.</text><text x="25" y="1206" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#333">Invalid output has no successful download. Correction creates a new revision; downstream dispatch is separate.</text><foreignObject x="28" y="118" width="434" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Domain Service -<br />E-Invoice Service</b><br /><span style="font-size:12px">Generation consumer / records</span></div></div></foreignObject><foreignObject x="583" y="118" width="434" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Domain Service -<br />Other Services</b><br /><span style="font-size:12px">DTS API / orchestration</span></div></div></foreignObject><foreignObject x="1138" y="118" width="434" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Domain Service -<br />Other Services</b><br /><span style="font-size:12px">DTS mapper / validation</span></div></div></foreignObject><foreignObject x="76" y="186" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Save the source revision</b><br /><span style="font-size:12px">Fixed source and declared input contract</span><br /><span style="font-size:11px;color:#555">UM-01</span></div></div></foreignObject><foreignObject x="631" y="186" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check permission and supported input</b><br /><span style="font-size:12px">Reject unsupported or unauthorised input</span><br /><span style="font-size:11px;color:#555">UM-02</span></div></div></foreignObject><foreignObject x="631" y="371" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Save and queue the conversion request</b><br /><span style="font-size:12px">Stable ID and fixed conversion capability</span><br /><span style="font-size:11px;color:#555">UM-03</span></div></div></foreignObject><foreignObject x="1186" y="371" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Generate the UBL invoice file</b><br /><span style="font-size:12px">Separate output; repeat-safe processing</span><br /><span style="font-size:11px;color:#555">UM-04</span></div></div></foreignObject><foreignObject x="1186" y="556" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Validate the file and invoice meaning</b><br /><span style="font-size:12px">Approved rules; preserve required meaning</span><br /><span style="font-size:11px;color:#555">UM-05</span></div></div></foreignObject><foreignObject x="1186" y="741" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Save one final conversion result</b><br /><span style="font-size:12px">Success requires a readable, valid file</span><br /><span style="font-size:11px;color:#555">UM-06</span></div></div></foreignObject><foreignObject x="631" y="741" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Provide access to progress and result</b><br /><span style="font-size:12px">200 / 303 with explicit success or error</span><br /><span style="font-size:11px;color:#555">UM-07</span></div></div></foreignObject><foreignObject x="76" y="741" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Save the exact conversion output</b><br /><span style="font-size:12px">The calling service owns retained storage</span><br /><span style="font-size:11px;color:#555">UM-08</span></div></div></foreignObject><foreignObject x="76" y="371" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check the original request acceptance</b><br /><span style="font-size:12px">Same key; no unverified fallback</span><br /><span style="font-size:11px;color:#555">UM-09</span></div></div></foreignObject><foreignObject x="631" y="976" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Recover the conversion failure</b><br /><span style="font-size:12px">Check saved state; resume the fixed work</span><br /><span style="font-size:11px;color:#555">UM-09</span></div></div></foreignObject><foreignObject x="1186" y="976" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Block an invalid conversion result</b><br /><span style="font-size:12px">Failed rules or loss of invoice meaning</span><br /><span style="font-size:11px;color:#555">UM-05 / 06</span></div></div></foreignObject><foreignObject x="76" y="976" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Create a corrected source revision</b><br /><span style="font-size:12px">New linked request; keep the original</span><br /><span style="font-size:11px;color:#555">UM-09 → UM-01</span></div></div></foreignObject></svg>