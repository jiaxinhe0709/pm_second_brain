erif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Inventory legacy baseline</text><text x="245.0" y="250" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Mapper, source contract and consumers</text><rect x="625" y="180" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2"/><text x="800.0" y="201" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">UM-11</text><text x="800.0" y="227" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Integrate DTS capability</text><text x="800.0" y="250" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Owned mapper, API, routing and XML result</text><rect x="625" y="365" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2"/><text x="800.0" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">UM-12</text><text x="800.0" y="412" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Qualify the release</text><text x="800.0" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Parity, old workloads, load and recovery</text><rect x="1180" y="365" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2"/><text x="1355.0" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">UM-13</text><text x="1355.0" y="412" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Compare and switch cohort</text><text x="1355.0" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Shadow never sends; switch only ready work</text><rect x="1180" y="550" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2"/><text x="1355.0" y="571" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">UM-14</text><text x="1355.0" y="597" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Observe and decide</text><text x="1355.0" y="620" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Expand, hold or roll back new admissions</text><rect x="625" y="735" width="350" height="88" rx="10" fill="#e8e8e8" stroke="#444" stroke-width="2"/><text x="800.0" y="756" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">UM-15</text><text x="800.0" y="782" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Accept ownership handover</text><text x="800.0" y="805" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">DTS release, support and maintenance</text><rect x="70" y="735" width="350" height="88" rx="44" fill="#ffffff" stroke="#444" stroke-width="2"/><text x="245.0" y="756" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">OUTCOME</text><text x="245.0" y="782" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Consumers migrated</text><text x="245.0" y="805" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Qualified capability and clear ownership</text><rect x="70" y="365" width="350" height="88" rx="10" fill="#fff2f2" stroke="#a34141" stroke-width="2"/><text x="245.0" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">UM-12 → UM-11</text><text x="245.0" y="412" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Resolve qualification gaps</text><text x="245.0" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">No activation after a failed gate</text><rect x="625" y="550" width="350" height="88" rx="10" fill="#fff2f2" stroke="#a34141" stroke-width="2"/><text x="800.0" y="571" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">GATE</text><text x="800.0" y="597" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Hold unapproved use</text><text x="800.0" y="620" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Contract, profile or consumer not ready</text><polygon points="1200,970 1510,970 1530,990 1530,1038 1510,1058 1200,1058 1180,1038 1180,990" fill="#fff5df" stroke="#956720" stroke-width="2"/><text x="1355.0" y="991" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">UM-14</text><text x="1355.0" y="1017" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Roll back new work safely</text><text x="1355.0" y="1040" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Reconcile first; select qualified prior path</text><rect x="625" y="970" width="350" height="88" rx="10" fill="#eef2f5" stroke="#5d7080" stroke-width="2" stroke-dasharray="7 5"/><text x="800.0" y="991" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">UM-03 / 09 / 14</text><text x="800.0" y="1017" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Preserve in-flight history</text><text x="800.0" y="1040" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Original operation, bundle and lookups</text><rect x="70" y="970" width="350" height="88" rx="10" fill="#eef2f5" stroke="#5d7080" stroke-width="2" stroke-dasharray="7 5"/><text x="245.0" y="991" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#333">SEPARATE DECISION</text><text x="245.0" y="1017" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333">Review legacy retirement</text><text x="245.0" y="1040" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#333">Drain, history and rollback gates first</text><text x="25" y="1180" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#333">Rollback changes new-work routing only after reconciliation. Existing jobs keep their pinned versions.</text><text x="25" y="1206" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#333">Future countries need their own qualification. Legacy retirement is an explicit decision after migration.</text></svg>