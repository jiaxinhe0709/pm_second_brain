oke-width="2" /><rect x="70" y="365" width="350" height="88" rx="10" fill="#fff2f2" stroke="#a34141" stroke-width="2" /><rect x="625" y="550" width="350" height="88" rx="10" fill="#fff2f2" stroke="#a34141" stroke-width="2" /><polygon points="1200,970 1510,970 1530,990 1530,1038 1510,1058 1200,1058 1180,1038 1180,990" fill="#fff5df" stroke="#956720" stroke-width="2" /><rect x="625" y="970" width="350" height="88" rx="10" fill="#eef2f5" stroke="#5d7080" stroke-width="2" stroke-dasharray="7 5" /><rect x="70" y="970" width="350" height="88" rx="10" fill="#eef2f5" stroke="#5d7080" stroke-width="2" stroke-dasharray="7 5" /><text x="25" y="1180" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#333">Rollback changes new-work routing only after reconciliation. Existing jobs keep their pinned versions.</text><text x="25" y="1206" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#333">Future countries need their own qualification. Legacy retirement is an explicit decision after migration.</text><foreignObject x="28" y="118" width="434" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Operations / support</b><br /><span style="font-size:12px">Spain / consumer owners</span></div></div></foreignObject><foreignObject x="583" y="118" width="434" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Domain Service -<b