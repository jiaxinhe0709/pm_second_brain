<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230" role="img" aria-labelledby="title desc"><title id="title">Spain UBL: qualification, consumer cutover and rollback</title><desc id="desc">Proposed flow • library ownership and service compatibility qualify together Rollback changes new-work routing only after reconciliation. Existing jobs keep their pinned versions. Future countries need their own qualification. Legacy retirement is an explicit decision after migration.</desc><rect width="1600" height="1230" fill="white"/><text x="25" y="46" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#333">Spain UBL: qualification, consumer cutover and rollback</text><text x="25" y="80" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#333">Proposed flow • library ownership and service compatibility qualify together</text><rect x="25" y="115" width="440" height="1035" rx="8" fill="#f6f6f6" stroke="#ccc"/><rect x="25" y="115" width="440" height="45" rx="8" fill="#dedede"/><text x="245.0" y="144" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#333">SPAIN / CONSUMER OWNERS</text><rect x="580" y="115" width="440" height="1035" rx="8" fill="#f6f6f6" stroke="#ccc"/><rect x="580" y="115" width="440" height="45" rx="8" fill="#dedede"/><text x="800.0" y="144" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#333">DTS ENGINEERING / QA</text><rect x="1135" y="115" width="440" height="1035" rx="8" fill="#f6f6f6" stroke="#ccc"/><rect x="1135" y="115" width="440" height="45" rx="8" fill="#dedede"/><text x="1355.0" y="144" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#333">DTS RELEASE / OPERATIONS</text><polyline points="420,224 625,224" fill="none" stroke="#4c555c" stroke-width="2.4"/><polygon points="625,224 615,219 615,229" fill="#4c55