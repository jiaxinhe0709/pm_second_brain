span><br /><span style="font-size:11px;color:#555">UM-15</span></div></div></foreignObject><foreignObject x="76" y="741" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Confirm the users have migrated</b><br /><span style="font-size:12px">Qualified conversion and clear ownership</span></div></div></foreignObject><foreignObject x="76" y="371" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Fix the failed readiness checks</b><br /><span style="font-size:12px">Do not activate after a failed check</span><br /><span style="font-size:11px;color:#555">UM-12 → UM-11</span></div></div></foreignObject><foreignObject x="631" y="556" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Hold unapproved conversion use</b><br /><span style="font-size:12px">Contract, profile or consumer not ready</span></div></div></foreignObject><foreignObject x="1186" y="976" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Roll back new work safely</b><br /><span style="font-size:12px">Check original work; use an approved prior path</span><br /><span style="font-size:11px;color:#555">UM-14</span></div></div></foreignObject><foreignObject x="631" y="976" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Keep pending work on its saved version</b><br /><span style="font-size:12px">Original request, rules and result lookups</span><br /><span style="font-size:11px;color:#555">UM-03 / 09 / 14</span></div></div></foreignObject><foreignObject x="76" y="976" width="338" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Review retirement of the old mapper</b><br /><span style="font-size:12px">Separate approval; finish work and keep history</span></div></div></foreignObject></svg>