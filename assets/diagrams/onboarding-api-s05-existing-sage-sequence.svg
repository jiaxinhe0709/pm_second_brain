<svg aria-label="ONB-S05 - Existing Sage setup" xmlns="http://www.w3.org/2000/svg" width="1415" height="2711" viewBox="0 0 1415 2711" role="img"><title>ONB-S05 - Existing Sage setup</title><desc>Confirm unchanged setup or make only the requested change. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale. Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be qualified. HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects under ONB-08.</desc><rect width="1415" height="2711" fill="white" /><rect x="8" y="8" width="1399" height="2695" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">ONB-S05 - Existing Sage setup</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Confirm unchanged setup or make only the requested change</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,2585" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">Product</text><path d="M 515,216 L 515,2585" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,2585" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Identity</text><path d="M 1285,216 L 1285,2585" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Tax Service</text><rect x="36" y="503" width="1343" height="291" fill="none" stroke="#777777" rx="0" /><rect x="24" y="258" width="1367" height="566" fill="none" stroke="#777777" rx="0" /><rect x="36" y="1203" width="1343" height="268" fill="none" stroke="#777777" rx="0" /><rect x="24" y="854" width="1367" height="842" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1840" width="1367" height="522" fill="none" stroke="#777777" rx="0" /><rect x="507" y="363" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="654" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="1063" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="1331" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="959" width="16" height="587" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1991" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="2222" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="2437" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="36" y="503" width="1343" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="526" fill="#222222">opt | A known connection needs detail</text><rect x="24" y="258" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#222222">opt | Known authorised dataset; inspect Sage setup only</text><rect x="36" y="1203" width="1343" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="1226" fill="#222222">opt | Certificate required for the selected purpose; use current evidence</text><rect x="24" y="854" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="877" fill="#222222">opt | Affected evidence is stale or a requested change needs new prerequisite checks</text><rect x="24" y="1840" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1863" fill="#222222">opt | Requested extension/correction only; update semantics qualified</text><rect x="38" y="1582" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1606" fill="#222222">Continue dependent checks only after valid NIF, current action authority and required certificate readiness</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1629" fill="#222222">pass.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1660" fill="#888888">ONB-02/03/08 | Unconfirmed evidence holds only dependent work</text><rect x="38" y="1726" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1750" fill="#222222">Valid unchanged setup skips mutation. A requested update needs current authority and qualified route/version</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1773" fill="#222222">effects.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1804" fill="#888888">ONB-A15/38 | Failed lookup is not missing setup</text><rect x="142" y="300" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="318" fill="#888888">[Existing] API-02 / FR-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="342" fill="#222222">GET /datasets/{datasetId}/accesspoints</text><path d="M 130,363 L 507,363" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,357 L 507,363 L 495,369 Z" fill="#444444" stroke="#444444" /><rect x="142" y="381" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="399" fill="#888888">FR-02 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="423" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="446" fill="#222222">Status + connectionId (or null)</text><path d="M 507,467 L 130,467" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,461 L 130,467 L 142,473" fill="none" stroke="#444444" /><rect x="142" y="545" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="563" fill="#888888">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="587" fill="#222222">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="610" fill="#222222">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="633" fill="#222222">{connectionId}/</text><path d="M 130,654 L 507,654" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,648 L 507,654 L 495,660 Z" fill="#444444" stroke="#444444" /><rect x="142" y="672" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="690" fill="#888888">FR-04 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="714" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="737" fill="#222222">Per-address status and errors</text><path d="M 507,758 L 130,758" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,752 L 130,758 L 142,764" fill="none" stroke="#444444" /><rect x="142" y="896" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="914" fill="#888888">[To qualify] Logical request; ONB-02/03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="938" fill="#222222">Assess prerequisites</text><path d="M 130,959 L 507,959" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,953 L 507,959 L 495,965 Z" fill="#444444" stroke="#444444" /><rect x="527" y="977" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="995" fill="#888888">[To qualify] Identity contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1019" fill="#222222">Check business NIF</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1042" fill="#222222">and action authority</text><path d="M 523,1063 L 892,1063" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1057 L 892,1063 L 880,1069 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1081" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1099" fill="#888888">[To qualify] Identity contract</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1123" fill="#222222">NIF + authority evidence</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1146" fill="#222222">or an owned action</text><path d="M 892,1167 L 523,1167" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1161 L 523,1167 L 535,1173" fill="none" stroke="#444444" /><rect x="527" y="1245" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1263" fill="#888888">[To qualify] Tax Service; CERT-05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1287" fill="#222222">Check certificate is in date</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1310" fill="#222222">and suitable for this purpose</text><path d="M 523,1331 L 1277,1331" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,1325 L 1277,1331 L 1265,1337 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1349" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1367" fill="#888888">[To qualify] Tax Service; CERT-05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1391" fill="#222222">Readiness + protected reference</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1414" fill="#222222">or reason / unconfirmed</text><path d="M 1277,1435 L 523,1435" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1429 L 523,1435 L 535,1441" fill="none" stroke="#444444" /><rect x="142" y="1483" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1501" fill="#888888">[Logical outcome] ONB-02/03/08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1525" fill="#222222">Gate decision + action owner</text><path d="M 507,1546 L 130,1546" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1540 L 130,1546 L 142,1552" fill="none" stroke="#444444" /><rect x="142" y="1882" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1900" fill="#888888">[Existing] API-05 / FR-05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1924" fill="#222222">PUT /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1947" fill="#222222">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1970" fill="#222222">{connectionId}/</text><path d="M 130,1991 L 507,1991" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1985 L 507,1991 L 495,1997 Z" fill="#444444" stroke="#444444" /><rect x="142" y="2009" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2027" fill="#888888">FR-05 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2051" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2074" fill="#222222">Updated connection/address details</text><path d="M 507,2095 L 130,2095" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2089 L 130,2095 L 142,2101" fill="none" stroke="#444444" /><rect x="142" y="2113" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2131" fill="#888888">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2155" fill="#222222">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2178" fill="#222222">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2201" fill="#222222">{connectionId}/</text><path d="M 130,2222 L 507,2222" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,2216 L 507,2222 L 495,2228 Z" fill="#444444" stroke="#444444" /><rect x="142" y="2240" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2258" fill="#888888">FR-04 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2282" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2305" fill="#222222">Per-address status and errors</text><path d="M 507,2326 L 130,2326" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2320 L 130,2326 L 142,2332" fill="none" stroke="#444444" /><rect x="142" y="2374" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2392" fill="#888888">[To qualify] Logical request; ONB-11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2416" fill="#222222">Assess current findings</text><path d="M 130,2437 L 507,2437" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,2431 L 507,2437 L 495,2443 Z" fill="#444444" stroke="#444444" /><rect x="142" y="2455" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2473" fill="#888888">[Logical outcome] ONB-11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2497" fill="#222222">Unchanged setup / affected findings</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2520" fill="#222222">+ action owner</text><path d="M 507,2541 L 130,2541" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2535 L 130,2541 L 142,2547" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2625" fill="#888888">Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2648" fill="#888888">Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be qualified.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2671" fill="#888888">HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects under ONB-08.</text></svg>