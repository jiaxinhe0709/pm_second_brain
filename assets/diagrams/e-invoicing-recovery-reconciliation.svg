<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2350 1100" role="img" aria-labelledby="title desc">
<title id="title">Recovery and reconciliation</title>
<desc id="desc">Classify mutation safety before choosing retry, reconciliation or manual control</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="2350" height="1100" fill="#fff"/>
<text x="35" y="44" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#111">Recovery and reconciliation</text>
<text x="35" y="76" font-family="Arial,sans-serif" font-size="15" fill="#444">Classify mutation safety before choosing retry, reconciliation or manual control</text>
<rect x="30" y="130" width="2290" height="170" fill="#fafafa" stroke="#aaa"/>
<rect x="30" y="130" width="245" height="170" fill="#e5e5e5" stroke="#aaa"/>
<text x="152" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">CUSTOMER / SUPPORT</text>
<text x="152" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">SIGNAL</text>
<rect x="30" y="310" width="2290" height="260" fill="#f1f1f1" stroke="#aaa"/>
<rect x="30" y="310" width="245" height="260" fill="#e5e5e5" stroke="#aaa"/>
<text x="152" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">SAGE OPERATIONS</text>
<rect x="30" y="580" width="2290" height="290" fill="#fafafa" stroke="#aaa"/>
<rect x="30" y="580" width="245" height="290" fill="#e5e5e5" stroke="#aaa"/>
<text x="152" y="624" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">CONTROLLED RECOVERY</text>
<text x="152" y="643" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">ACTION</text>
<rect x="30" y="880" width="2290" height="170" fill="#f1f1f1" stroke="#aaa"/>
<rect x="30" y="880" width="245" height="170" fill="#e5e5e5" stroke="#aaa"/>
<text x="152" y="924" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">EVIDENCE / CONTINUITY</text>
<rect x="1350" y="610" width="550" height="245" rx="12" fill="#f8f8f8" stroke="#555" stroke-width="2"/>
<text x="1625.0" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#222">Choose one permitted recovery action</text>
<path d="M550 210 H600 V425 H650" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M900 425 H1000" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1250 425 H1300 V635 H1350" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1900 635 H1975 V425 H2050" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M2190 375 V255" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M2190 475 V915" fill="none" stroke="#444" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M775 915 V540 H1125 V475" fill="none" stroke="#777" stroke-width="2.2" stroke-dasharray="2 5"/>
<rect x="2198.5" y="665" width="103" height="18" rx="3" fill="#fff" opacity=".96"/>
<text x="2250" y="678" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#333">Still unknown</text>
<ellipse cx="425.0" cy="210.0" rx="125.0" ry="45.0" fill="#fff" stroke="#222" stroke-width="2.2"/>
<text x="425.0" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Failure detected</text>
<text x="425.0" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Customer, telemetry or partner</text>
<rect x="650" y="375" width="250" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="775.0" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Contain affected scope</text>
<text x="775.0" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Protect completed legs and safe</text>
<text x="775.0" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">reads</text>
<polygon points="1125.0,375 1250,425.0 1125.0,475 1000,425.0" fill="#d1d1d1" stroke="#222" stroke-width="2.2"/>
<text x="1125.0" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">What is safe?</text>
<text x="1125.0" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Read, mutation or</text>
<text x="1125.0" y="456" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">unknown</text>
<rect x="1380" y="650" width="480" height="55" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="1620.0" y="678" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#111">Safe retry</text>
<text x="1620.0" y="697" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Bounded read or proven idempotency</text>
<rect x="1380" y="720" width="480" height="55" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="1620.0" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#111">Reconcile first</text>
<text x="1620.0" y="767" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Query original external operation</text>
<rect x="1380" y="790" width="480" height="55" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="1620.0" y="818" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#111">Manual approval</text>
<text x="1620.0" y="837" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Runbook, owner and audit reason</text>
<rect x="2050" y="375" width="280" height="100" rx="9" fill="#e8e8e8" stroke="#333" stroke-width="2.2"/>
<text x="2190.0" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Verify actual outcome</text>
<text x="2190.0" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">External truth, backlog, deadlines</text>
<polygon points="2074,165 2330,165 2306,255 2050,255" fill="#fff" stroke="#222" stroke-width="2.2"/>
<text x="2190.0" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Explain result</text>
<text x="2190.0" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Impact, evidence and next action</text>
<path d="M650 928 V992 C650 1008 900 1008 900 992 V928 Z" fill="#e0e0e0" stroke="#333" stroke-width="2.2"/>
<ellipse cx="775.0" cy="928" rx="125.0" ry="13" fill="#e0e0e0" stroke="#333" stroke-width="2.2"/>
<text x="775.0" y="955" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Original operation</text>
<text x="775.0" y="976" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Idempotency and route evidence</text>
<polygon points="2074,915 2306,915 2330,960.0 2306,1005 2074,1005 2050,960.0" fill="#f4f4f4" stroke="#222" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="2190.0" y="948" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Still unknown</text>
<text x="2190.0" y="972" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">Keep case open and escalate</text>
<text x="35" y="1080" font-family="Arial,sans-serif" font-size="13" fill="#444">Solid arrows = process; dashed arrows = hold or correction; dotted lines = supporting evidence.</text>
</svg>