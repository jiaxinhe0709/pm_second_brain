<svg xmlns="http://www.w3.org/2000/svg" aria-label="Public setup: check Sage access" width="1030" height="2139" viewBox="0 0 1030 2139" role="img"><title>Public setup: check Sage access</title><desc>Phase 1: confirm access for the selected business, action and environment. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services. Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</desc><rect width="1030" height="2139" fill="white" /><rect x="8" y="8" width="1014" height="2123" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Public setup: check Sage access</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Phase 1: confirm access for the selected business, action and environment</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,2013" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">ERP / product</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">Setup screen</text><path d="M 515,216 L 515,2013" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#626262">Sage</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,2013" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Public platform</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">Spain (SPFE)</text><rect x="24" y="348" width="982" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="446" width="982" height="291" fill="none" stroke="#626262" rx="0" /><rect x="36" y="1058" width="958" height="314" fill="none" stroke="#626262" rx="0" /><rect x="24" y="767" width="982" height="635" fill="none" stroke="#626262" rx="0" /><rect x="24" y="1536" width="982" height="245" fill="none" stroke="#1565C0" rx="0" /><rect x="507" y="574" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="895" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1232" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="1664" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1500" width="16" height="379" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="348" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="371" fill="#1565C0">ref | First: SXS dataset, permission and required Tax credential checks (2.1)</text><rect x="24" y="446" width="982" height="34" fill="#FAFAFA" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="469" fill="#626262">opt | Find a service only if its ID is not already known</text><rect x="36" y="1058" width="958" height="34" fill="#FAFAFA" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="1081" fill="#626262">opt | Read detail only for a known connection</text><rect x="24" y="767" width="982" height="34" fill="#FAFAFA" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="790" fill="#626262">opt | Inspect saved access-point setup only where the public channel supports it</text><rect x="24" y="1536" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1559" fill="#1565C0">opt | Check only missing/stale evidence; public method and permission must be confirmed</text><rect x="38" y="258" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Start: the customer wants Sage access to the public platform. Inputs: business, requested function and</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">environment.</text><rect x="38" y="1915" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1939" fill="#626262">End: return public readiness or a specific missing item and owner. No public enrolment call or test invoice is</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1962" fill="#626262">assumed.</text><rect x="142" y="488" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="506" fill="#626262">[Existing] API-01 / FR-01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="530" fill="#626262">Find available platform services</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="553" fill="#626262">GET /accesspoints</text><path d="M 130,574 L 507,574" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,568 L 507,574 L 495,580 Z" fill="#626262" stroke="#626262" /><rect x="142" y="592" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="610" fill="#626262">FR-01 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="634" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="657" fill="#626262">Service names + IDs</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="680" fill="#626262">Use service id as accessPointId</text><path d="M 507,701 L 130,701" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,695 L 130,701 L 142,707" fill="none" stroke="#626262" /><rect x="142" y="809" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="827" fill="#626262">[Existing] API-02 / FR-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="851" fill="#626262">Find this dataset's connections</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="874" fill="#626262">GET /datasets/{datasetId}/accesspoints</text><path d="M 130,895 L 507,895" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,889 L 507,895 L 495,901 Z" fill="#626262" stroke="#626262" /><rect x="142" y="913" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="931" fill="#626262">FR-02 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="955" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="978" fill="#626262">Entries per access point</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1001" fill="#626262">Each status + connectionId (or null)</text><path d="M 507,1022 L 130,1022" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1016 L 130,1022 L 142,1028" fill="none" stroke="#626262" /><rect x="142" y="1100" width="361" height="123" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1118" fill="#626262">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1142" fill="#626262">Read each address's setup status</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1165" fill="#626262">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1188" fill="#626262">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1211" fill="#626262">{connectionId}/</text><path d="M 130,1232 L 507,1232" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1226 L 507,1232 L 495,1238 Z" fill="#626262" stroke="#626262" /><rect x="142" y="1250" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1268" fill="#626262">FR-04 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1292" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1315" fill="#626262">Each address: status + errorCode</text><path d="M 507,1336 L 130,1336" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1330 L 130,1336 L 142,1342" fill="none" stroke="#626262" /><rect x="142" y="1414" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1432" fill="#1565C0">[To confirm] Setup request; ONB-03/04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1456" fill="#1565C0">Check Sage public access</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1479" fill="#1565C0">Business + action + environment</text><path d="M 130,1500 L 507,1500" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1494 L 507,1500 L 495,1506 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1578" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1596" fill="#1565C0">[To confirm] Public access method</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1620" fill="#1565C0">Check access for this business/action</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1643" fill="#1565C0">No onboarding method supplied</text><path d="M 523,1664 L 892,1664" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1658 L 892,1664 L 880,1670 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1682" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1700" fill="#1565C0">[To confirm] Public access method</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1724" fill="#1565C0">Access evidence or specific limitation</text><path d="M 892,1745 L 523,1745" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1739 L 523,1745 L 535,1751" fill="none" stroke="#1565C0" /><rect x="142" y="1793" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1811" fill="#1565C0">[Setup result] ONB-04/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1835" fill="#1565C0">For each requested function:</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1858" fill="#1565C0">ready or missing item + owner</text><path d="M 507,1879 L 130,1879" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1873 L 130,1879 L 142,1885" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2053" fill="#626262">Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2076" fill="#626262">Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2099" fill="#626262">activation is separate.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>