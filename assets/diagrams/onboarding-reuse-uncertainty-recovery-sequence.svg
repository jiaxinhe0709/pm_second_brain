ginal operation</text><path d="M 523,863 L 892,863" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,857 L 892,863 L 880,869 Z" fill="#444444" stroke="#444444" /><rect x="527" y="881" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="899" fill="#888888">[To qualify] Original-effect observation</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="923" fill="#222222">Confirmed / absent / conflicting</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="946" fill="#222222">or still unknown</text><path d="M 892,967 L 523,967" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,961 L 523,967 L 535,973" fill="none" stroke="#444444" /><rect x="142" y="1015" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1033" fill="#888888">[Logical outcome] ONB-08/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1057" fill="#222222">Finding + safe next action owner</text><path d="M 507,1078 L 130,1078" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1072 L 130,1078 L 142,1084" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1162" fill="#888888">Solid requests; dashed paired responses; grey activation bars. Timing and service placement remain proposed.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1185" fill="#888888">Current business access is required. HTTP success is separate from readiness and activation. Unknown evidence holds</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="