<svg aria-label="Uncertainty and recovery" xmlns="http://www.w3.org/2000/svg" width="1030" height="1248" viewBox="0 0 1030 1248" role="img"><title>Uncertainty and recovery</title><desc>Observe the original effect; preserve valid independent functions. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid requests; dashed paired responses; grey activation bars. Timing and service placement remain proposed. Current business access is required. HTTP success is separate from readiness and activation. Unknown evidence holds dependent work.</desc><rect width="1030" height="1248" fill="white" /><rect x="8" y="8" width="1014" height="1232" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Uncertainty and recovery</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Observe the original effect; preserve valid independent functions</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1022,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1122" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">Product</text><path d="M 515,216 L 515,1122" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1122" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Original provider</text><rect x="24" y="258" width="982" height="68" fill="none" stroke="#777777" rx="0" /><rect x="24" y="356" width="982" height="291" fill="none" stroke="#777777" rx="0" /><rect x="24" y="758" width="982" height="245" fill="none" stroke="#777777" rx="0" /><rect x="507" y="507" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="863" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="722" width="16" height="356" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="258" width="982" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#222222">ref | Shared checks (2.1) for observation access only; skip provisioning and all mutations</text><rect x="24" y="356" width="982" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="379" fill="#222222">opt | Known connection; qualified safe detail read can add evidence</text><rect x="24" y="758" width="982" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="781" fill="#222222">opt | Original provider/operation and authoritative observation contract qualified</text><rect x="142" y="398" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="416" fill="#888888">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="440" fill="#222222">GET /connectors/{accessPointId}/</text><text font-family="Ari