ately</text><path d="M 507,2568 L 130,2568" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2562 L 130,2568 L 142,2574" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2652" fill="#888888">Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2675" fill="#888888">Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be qualified.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2698" fill="#888888">HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects under ONB-08.</text></svg>