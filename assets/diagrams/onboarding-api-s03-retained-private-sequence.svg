<svg aria-label="ONB-S03 - Existing private provider retained" xmlns="http://www.w3.org/2000/svg" width="1800" height="2738" viewBox="0 0 1800 2738" role="img"><title>ONB-S03 - Existing private provider retained</title><desc>Keep the provider/account; establish only missing Sage setup. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale. Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be qualified. HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects under ONB-08.</desc><rect width="1800" height="2738" fill="white" /><rect x="8" y="8" width="1784" height="2722" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">ONB-S03 - Existing private provider retained</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Keep the provider/account; establish only missing Sage setup</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1792,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,2612" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">Product</text><path d="M 515,216 L 515,2612" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,2612" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Identity</text><path d="M 1285,216 L 1285,2612" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Tax Service</text><path d="M 1670,216 L 1670,2612" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1562" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1670" y="190" fill="#222222">Private provider</text><rect x="36" y="503" width="1728" height="291" fill="none" stroke="#777777" rx="0" /><rect x="24" y="258" width="1752" height="566" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1143" width="1752" height="268" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1728" width="1752" height="430" fill="none" stroke="#777777" rx="0" /><rect x="507" y="363" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="654" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="1003" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="1271" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="899" width="16" height="587" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1856" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1662" y="2041" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="2279" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="2464" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="36" y="503" width="1728" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="526" fill="#222222">opt | A known connection needs detail</text><rect x="24" y="258" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#222222">opt | Known authorised dataset; inspect Sage setup only</text><rect x="24" y="1143" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1166" fill="#222222">opt | Certificate required for the selected purpose; use current evidence</text><rect x="24" y="1728" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1751" fill="#222222">opt | Missing Sage setup only; retained account and provider effects qualified</text><rect x="38" y="1522" width="1724" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1546" fill="#222222">Continue dependent checks only after valid NIF, current action authority and required certificate readiness</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1569" fill="#222222">pass.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1600" fill="#888888">ONB-02/03/08 | Unconfirmed evidence holds only dependent work</text><rect x="38" y="1636" width="1724" height="68" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1660" fill="#222222">Keep the provider/account. Qualify connect effects, route authority and continuity before dispatch.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1692" fill="#888888">ONB-05/06/07 | INT-AP04: connect can take over routing</text><rect x="142" y="300" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="318" fill="#888888">[Existing] API-02 / FR-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="342" fill="#222222">GET /datasets/{datasetId}/accesspoints</text><path d="M 130,363 L 507,363" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,357 L 507,363 L 495,369 Z" fill="#444444" stroke="#444444" /><rect x="142" y="381" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="399" fill="#888888">FR-02 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="423" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="446" fill="#222222">Status + connectionId (or null)</text><path d="M 507,467 L 130,467" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,461 L 130,467 L 142,473" fill="none" stroke="#444444" /><rect x="142" y="545" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="563" fill="#888888">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="587" fill="#222222">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="610" fill=