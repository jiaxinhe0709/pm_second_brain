rence</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1354" fill="#222222">or reason / unconfirmed</text><path d="M 1277,1375 L 523,1375" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1369 L 523,1375 L 535,1381" fill="none" stroke="#444444" /><rect x="142" y="1423" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1441" fill="#888888">[Logical outcome] ONB-02/03/08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1465" fill="#222222">Gate decision + action owner</text><path d="M 507,1486 L 130,1486" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1480 L 130,1486 L 142,1492" fill="none" stroke="#444444" /><rect x="142" y="1770" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1788" fill="#888888">[Existing] API-03 / FR-03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1812" fill="#222222">POST /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1835" fill="#222222">datasets/{datasetId}/connect</text><path d="M 130,1856 L 507,1856" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1850 L 507,1856 L 495,1862 Z" fill="#444444" stroke="#444444" /><rect x="142" y="1874" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1892" fill="#888888">FR-03 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1916" fill="#222222">201 Created</text><text font-family="Arial, sans-serif" font-size="1