<svg xmlns="http://www.w3.org/2000/svg" aria-label="Customer: view list, open invoice and download file" width="1415" height="2614" viewBox="0 0 1415 2614" role="img"><title>Customer: view list, open invoice and download file</title><desc>The ERP uses existing calls; Spain coverage still needs qualification.. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid: request. Dashed: result. Grey bars show handling, not elapsed time. Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</desc><rect width="1415" height="2614" fill="white" /><rect x="8" y="8" width="1399" height="2598" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Customer: view list, open invoice and download file</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">The ERP uses existing calls; Spain coverage still needs qualification.</text><path d="M 8,124 L 1407,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,2511" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">Customer /</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">accountant</text><path d="M 515,216 L 515,2511" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#626262">ERP / product</text><path d="M 900,216 L 900,2511" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Domain Service -</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">E-Invoice Service</text><path d="M 1285,216 L 1285,2511" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="178" fill="#626262">File source /</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="201" fill="#626262">records</text><rect x="24" y="394" width="1367" height="476" fill="none" stroke="#626262" rx="0" /><rect x="24" y="900" width="1367" height="499" fill="none" stroke="#626262" rx="0" /><rect x="36" y="1751" width="1343" height="268" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1587" width="1367" height="728" fill="none" stroke="#1565C0" rx="0" /><rect x="892" y="580" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="499" width="16" height="335" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="1109" width="16" height="127" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1005" width="16" height="358" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="1879" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1277" y="2094" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1715" width="16" height="564" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="394" width="1367" height="34" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="417" fill="#626262">case | B. View invoice list — business level</text><rect x="24" y="900" width="1367" height="34" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="923" fill="#626262">case | C. Select and open invoice — one invoice</text><rect x="36" y="1751" width="1343" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="1774" fill="#1565C0">opt | Attachment choices/links omitted, or link expiry confirmed</text><rect x="24" y="1587" width="1367" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1610" fill="#1565C0">opt | D. Download file — one attachment</text><rect x="38" y="258" width="1339" height="112" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Customer consultation covers sent and received invoices. ERP calls the E-Invoice Service through the shared</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">Query/Retrieve API. Reuse the NIF/business dataset binding and existing certificate/authority setup; the GETs</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="328" fill="#626262">use a Sage ID M2M token. Recheck current user/client permission. Automatic receiving is inbound only.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="358" fill="#626262">SPEC026 §2; RSD-07; RET-G01/03/05</text><rect x="38" y="1429" width="1339" height="134" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1453" fill="#626262">Keep the selected ID and business context; qualify the list-to-detail ID under RET-G01. Metadata alone is not</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1476" fill="#626262">a complete view. Retrieve includeAttachments defaults to true. With false, descriptors and URL/Factur-X</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1499" fill="#626262">generation are omitted, but availableAttachments is retained. A positive count does not itself return file</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1522" fill="#626262">choices or links.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1551" fill="#626262">INT-RCV03, snapshot 13 November; RET-API-01/02</text><rect x="38" y="2345" width="1339" height="134" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2369" fill="#626262">Apply file access, role, safety and integrity checks. A zero attachment count is distinct from omitted</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2392" fill="#626262">descriptors. Qualify readable content and SPFE inbound freshness. Safe saved access can continue during source</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2415" fill="#626262">outage or pending inbound ERP delivery, including an authorised faithful copy. Viewing/download does not</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2438" fill="#626262">create buyer acceptance.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="2467" fill="#626262">REF-SCOPE/COPY-POLICY; RET-G04/05/08/10</text><rect x="142" y="436" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="454" fill="#1565C0">[Proposed] SPEC026 §2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="478" fill="#1565C0">View invoice list</text><path d="M 130,499 L 507,499" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,493 L 507,499 L 495,505 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="517" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="535" fill="#626262">[Existing] INT-RCV02; RET-API-01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="559" fill="#626262">GET /datasets/{datasetId}/e-invoices</text><path d="M 523,580 L 892,580" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,574 L 892,580 L 880,586 Z" fill="#626262" stroke="#626262" /><rect x="527" y="598" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="616" fill="#626262">[Existing] INT-RCV02; RET-API-01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="640" fill="#626262">Permitted sent/received list, status,</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="663" fill="#626262">attachment count and qualified</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="686" fill="#626262">links.next paging</text><path d="M 892,707 L 523,707" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,701 L 523,707 L 535,713" fill="none" stroke="#626262" /><rect x="142" y="725" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="743" fill="#1565C0">[Proposed] RSD-07; RET-G03/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="767" fill="#1565C0">Invoice list and collection result; keep</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="790" fill="#1565C0">empty, failed and incomplete results</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="813" fill="#1565C0">distinct</text><path d="M 507,834 L 130,834" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,828 L 130,834 L 142,840" fill="none" stroke="#1565C0" /><rect x="142" y="942" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="960" fill="#1565C0">[Proposed] SPEC026 §2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="984" fill="#1565C0">Select and open invoice</text><path d="M 130,1005 L 507,1005" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,999 L 507,1005 L 495,1011 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1023" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1041" fill="#626262">[Existing] INT-RCV03; RET-API-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1065" fill="#626262">GET /datasets/{datasetId}/e-invoices/{e-</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1088" fill="#626262">invoiceId}</text><path d="M 523,1109 L 892,1109" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1103 L 892,1109 L 880,1115 Z" fill="#626262" stroke="#626262" /><rect x="527" y="1127" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1145" fill="#626262">[Existing] INT-RCV03; RET-API-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1169" fill="#626262">Selected invoice details, history,</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1192" fill="#626262">attachment count and included</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1215" fill="#626262">descriptors/URLs</text><path d="M 892,1236 L 523,1236" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1230 L 523,1236 L 535,1242" fill="none" stroke="#626262" /><rect x="142" y="1254" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1272" fill="#1565C0">[Proposed] RSD-07; RET-G01/08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1296" fill="#1565C0">Permitted invoice content and file</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1319" fill="#1565C0">choices, or reason content is</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1342" fill="#1565C0">unavailable</text><path d="M 507,1363 L 130,1363" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1357 L 130,1363 L 142,1369" fill="none" stroke="#1565C0" /><rect x="142" y="1629" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1647" fill="#1565C0">[Proposed] SPEC026 §2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1671" fill="#1565C0">Download file; get file choices first if</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1694" fill="#1565C0">omitted</text><path d="M 130,1715 L 507,1715" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1709 L 507,1715 L 495,1721 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1793" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1811" fill="#626262">[Existing] INT-RCV03; RET-API-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1835" fill="#626262">GET /datasets/{datasetId}/e-invoices/{e-</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1858" fill="#626262">invoiceId}?includeAttachments=true</text><path d="M 523,1879 L 892,1879" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1873 L 892,1879 L 880,1885 Z" fill="#626262" stroke="#626262" /><rect x="527" y="1897" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1915" fill="#626262">[Existing] INT-RCV03; RET-API-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1939" fill="#626262">Attachment count, file choices and</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1962" fill="#626262">current download URLs</text><path d="M 892,1983 L 523,1983" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1977 L 523,1983 L 535,1989" fill="none" stroke="#626262" /><rect x="527" y="2031" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="2049" fill="#1565C0">[Spain] Reuse INT-RCV01 §4; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="2073" fill="#1565C0">GET {downloadUrl} for the selected saved file</text><path d="M 523,2094 L 1277,2094" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,2088 L 1277,2094 L 1265,2100 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="2112" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="2130" fill="#1565C0">[Proposed] RSD-07; RET-API-03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="2154" fill="#1565C0">Labelled bytes, or an access/file problem</text><path d="M 1277,2175 L 523,2175" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,2169 L 523,2175 L 535,2181" fill="none" stroke="#1565C0" /><rect x="142" y="2193" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="2211" fill="#1565C0">[Proposed] RSD-07; RET-G04/05/10</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2235" fill="#1565C0">Selected file, or denial/file problem</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="2258" fill="#1565C0">with a safe next action</text><path d="M 507,2279 L 130,2279" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,2273 L 130,2279 L 142,2285" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2551" fill="#626262">Solid: request. Dashed: result. Grey bars show handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2574" fill="#626262">Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>