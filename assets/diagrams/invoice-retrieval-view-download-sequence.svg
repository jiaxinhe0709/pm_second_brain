<svg xmlns="http://www.w3.org/2000/svg" aria-label="View public or private invoices; download SPFE files" width="1030" height="1356" viewBox="0 0 1030 1356" role="img"><title>View public or private invoices; download SPFE files</title><desc>View: required for both sources. User download: SPFE required; private TBD.. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid: request. Dashed: result. Grey bars show handling, not elapsed time. Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</desc><rect width="1030" height="1356" fill="white" /><rect x="8" y="8" width="1014" height="1340" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">View public or private invoices; download SPFE files</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">View: required for both sources. User download: SPFE required; private TBD.</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1253" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#626262">ERP / product</text><path d="M 515,216 L 515,1253" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,1253" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#626262">File source / records</text><rect x="24" y="879" width="982" height="222" fill="none" stroke="#626262" rx="0" /><rect x="507" y="417" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="625" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="984" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="879" width="982" height="34" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="902" fill="#626262">case | User downloads a captured SPFE file</text><rect x="38" y="258" width="954" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Reuse the authorised business dataset. The grey calls are documented; their Spain applicability still needs</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">qualification. Viewing is separate from buyer acceptance.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="336" fill="#626262">REF-SCOPE; RET-G01/03/05</text><rect x="38" y="765" width="954" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="789" fill="#626262">The product displays permitted invoice content from qualified data or a readable file. Metadata alone does not</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="812" fill="#626262">complete the view. Qualify readable-file support and SPFE freshness.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="843" fill="#626262">RET-G05/07/08; RET-API-01/02</text><rect x="38" y="1131" width="954" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1155" fill="#626262">Required SPFE download needs a proven saved-file binding and current permission. Private user download is TBD;</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1178" fill="#626262">required private view and backend source capture remain separate.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1209" fill="#626262">REF-SCOPE; RET-G04/05/10</text><rect x="142" y="354" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="372" fill="#626262">[Existing] INT-RCV01 §3.2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="396" fill="#626262">GET /datasets/{datasetId}/e-invoices</text><path d="M 130,417 L 507,417" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,411 L 507,417 L 495,423 Z" fill="#626262" stroke="#626262" /><rect x="142" y="435" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="453" fill="#626262">[Existing] INT-RCV01 §3.2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="477" fill="#626262">Permitted invoice list; follow</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="500" fill="#626262">links.next within qualified coverage</text><path d="M 507,521 L 130,521" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,515 L 130,521 L 142,527" fill="none" stroke="#626262" /><rect x="142" y="539" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="557" fill="#626262">[Existing] INT-RCV01 §3.1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="581" fill="#626262">GET /datasets/{datasetId}/e-invoices/{e-</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="604" fill="#626262">invoiceId}</text><path d="M 130,625 L 507,625" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,619 L 507,625 L 495,631 Z" fill="#626262" stroke="#626262" /><rect x="142" y="643" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="661" fill="#626262">[Existing] INT-RCV01 §3.1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="685" fill="#626262">Invoice information, history and file</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="708" fill="#626262">descriptors</text><path d="M 507,729 L 130,729" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,723 L 130,729 L 142,735" fill="none" stroke="#626262" /><rect x="142" y="921" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="939" fill="#1565C0">[Spain] Reuse INT-RCV01 §4; saved binding RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="963" fill="#1565C0">GET {downloadUrl} for the selected saved file</text><path d="M 130,984 L 892,984" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,978 L 892,984 L 880,990 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="1002" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="1020" fill="#1565C0">[Proposed] RSD-07; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="1044" fill="#1565C0">Labelled bytes, or classified denial/integrity case</text><path d="M 892,1065 L 130,1065" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1059 L 130,1065 L 142,1071" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1293" fill="#626262">Solid: request. Dashed: result. Grey bars show handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1316" fill="#626262">Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>