 fill="#333333">IC-11</text></a><text x="28" y="1002" font-family="Arial, sans-serif" font-size="15" fill="#222222">388 replaces simplified invoices. S is a corrective substitution. These are different scenarios.</text><text x="28" y="1026" font-family="Arial, sans-serif" font-size="15" fill="#222222">384/471 use qualified BG-24 and BT-ES-27/28/29. Third-party BG-ES-1 is a separate condition.</text><text x="28" y="1050" font-family="Arial, sans-serif" font-size="15" fill="#222222">SPEC-SEI-015 · Original data stays unchanged. Blocked results require a new draft revision or another governed invoice.</text><rect x="794.0" y="429" width="36" height="20" fill="white" /><text x="812" y="443" font-family="Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle">No</text><rect x="646.0" y="323" width="38" height="20" fill="white" /><text x="665" y="337" font-family="Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle">Yes</text><rect x="1383.0" y="281" width="38" height="20" fill="white" /><text x="1402" y="295" font-family="Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle">Yes</text><rect x="1157.0" y="273" width="36" height="20" fill="white" /><text x="1175" y="287" font-family="Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle">No</text><rect x="1384.5" y="478.0" width="36" height="20" fill="white" /><text x="1402.5" y="492.0" font-family="Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle">I</text><rect x="1319.5" y="613.0" width="36" height="20" fill="white" /><text x="1337.5" y="627.0" font-family="Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle">S</text><rect x="1806.0" y="613.0" width="78" height="20" fill="white" /><text x="1845.0" y="627.0" font-family="Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle">Unproven</text><rect x="2396.0" y="410.5" width="78" height="20" fill="white" /><text x="2435.0" y="424.5" font-family="Arial, sans-serif