<svg aria-label="FR notification and invoice-file capture" xmlns="http://www.w3.org/2000/svg" width="1800" height="1679" viewBox="0 0 1800 1679" role="img"><title>FR notification and invoice-file capture</title><desc>Guide-evidenced calls; capture integration and Spain support remain to qualify. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time. Existing: supplied guide/transport evidence. To qualify: logical handoff or missing contract; no deployment decision.</desc><rect width="1800" height="1679" fill="white" /><rect x="8" y="8" width="1784" height="1663" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">FR notification and invoice-file capture</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Guide-evidenced calls; capture integration and Spain support remain to qualify</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1792,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1576" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,1576" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1576" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Events</text><path d="M 1285,216 L 1285,1576" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">File source</text><path d="M 1670,216 L 1670,1576" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1562" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1670" y="190" fill="#222222">Records</text><rect x="24" y="1040" width="1752" height="384" fill="none" stroke="#777777" rx="0" /><rect x="892" y="417" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="122" y="579" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="900" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="1145" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1662" y="1307" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="1040" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1063" fill="#222222">loop | Each required qualified source-file role</text><rect x="38" y="258" width="1724" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#222222">Precondition: qualified dataset/address connection, current represented-business/action authority and correct</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#222222">access point/environment. A notification is not captured invoice bytes.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="336" fill="#888888">INT-RCV01 prerequisites; RRI-R02; RET-G01</text><rect x="38" y="696" width="1724" height="112" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="720" fill="#222222">Authenticate and check event scope. Correlate errors to the relevant history attempt. Follow INT-ERR01</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="743" fill="#222222">platform retry/support actions; do not repeat capture to repair notification failure. Only qualified file-</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="766" fill="#222222">ready work continues below.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="796" fill="#888888">INT-RCV01 section 2; INT-ERR01; RET-G02</text><rect x="38" y="1454" width="1724" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1478" fill="#222222">List discovery can replace the webhook trigger. File capture does not establish canonical mapping, product</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1501" fill="#222222">consumption, source acknowledgement or buyer acceptance.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1532" fill="#888888">RRI-R02; RCV-01-09; RET-API-A02/03/04</text><rect x="142" y="354" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="372" fill="#888888">[Existing] INT-RCV01 section 1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="396" fill="#222222">POST /internal/events/subscriptions</text><path d="M 130,417 L 892,417" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,411 L 892,417 L 880,423 Z" fill="#444444" stroke="#444444" /><rect x="142" y="435" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="453" fill="#888888">[Existing] INT-RCV01 section 1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="477" fill="#222222">201: subscription result; schema/casing to confirm</text><path d="M 892,498 L 130,498" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,492 L 130,498 L 142,504" fill="none" stroke="#444444" /><rect x="142" y="516" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="534" fill="#888888">[Existing] INT-RCV01 section 2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="558" fill="#222222">Received webhook: subject = e-invoice ID</text><path d="M 900,579 L 138,579" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 150,573 L 138,579 L 150,585 Z" fill="#444444" stroke="#444444" /><rect x="142" y="597" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="615" fill="#888888">[To qualify] RET-G02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="639" fill="#222222">Event receipt only; response contract to qualify</text><path d="M 138,660 L 900,660" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 888,654 L 900,660 L 888,666" fill="none" stroke="#444444" /><rect x="142" y="814" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="832" fill="#888888">[Existing] INT-RCV01 section 3.1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="856" fill="#222222">GET /datasets/{datasetId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="879" fill="#222222">e-invoices/{e-invoiceId}</text><path d="M 130,900 L 507,900" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,894 L 507,900 L 495,906 Z" fill="#444444" stroke="#444444" /><rect x="142" y="918" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="936" fill="#888888">[Existing] INT-RCV01 section 3.1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="960" fill="#222222">200: details, attachment roles and</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="983" fill="#222222">short-lived downloadUrl</text><path d="M 507,1004 L 130,1004" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,998 L 130,1004 L 142,1010" fill="none" stroke="#444444" /><rect x="142" y="1082" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1100" fill="#888888">[Existing] INT-RCV01 section 4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1124" fill="#222222">GET {downloadUrl}; no Sage Authorization header</text><path d="M 130,1145 L 1277,1145" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,1139 L 1277,1145 L 1265,1151 Z" fill="#444444" stroke="#444444" /><rect x="142" y="1163" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1181" fill="#888888">[Existing] INT-RCV01 section 4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1205" fill="#222222">200: actual file bytes; failure keeps capture incomplete</text><path d="M 1277,1226 L 130,1226" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1220 L 130,1226 L 142,1232" fill="none" stroke="#444444" /><rect x="142" y="1244" width="1516" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1262" fill="#888888">[To qualify] RSD-04; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1286" fill="#222222">Capture exact bytes, source role and integrity evidence</text><path d="M 130,1307 L 1662,1307" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1650,1301 L 1662,1307 L 1650,1313 Z" fill="#444444" stroke="#444444" /><rect x="142" y="1325" width="1516" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1343" fill="#888888">[To qualify] RSD-04; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1367" fill="#222222">Verified capture receipt, or incomplete/restricted state</text><path d="M 1662,1388 L 130,1388" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1382 L 130,1388 L 142,1394" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1616" fill="#888888">Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1639" fill="#888888">Existing: supplied guide/transport evidence. To qualify: logical handoff or missing contract; no deployment decision.</text></svg>