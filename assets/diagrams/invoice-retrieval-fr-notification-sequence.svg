<svg xmlns="http://www.w3.org/2000/svg" aria-label="Receive an invoice: event, details and file" width="1800" height="1453" viewBox="0 0 1800 1453" role="img"><title>Receive an invoice: event, details and file</title><desc>Existing source-capture pattern; private user download remains TBD. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid: request. Dashed: result. Grey bars show handling, not elapsed time. Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</desc><rect width="1800" height="1453" fill="white" /><rect x="8" y="8" width="1784" height="1437" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Receive an invoice: event, details and file</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Existing source-capture pattern; private user download remains TBD</text><path d="M 8,124 L 1792,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1350" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#626262">ERP / product</text><path d="M 515,216 L 515,1350" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,1350" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#626262">Events</text><path d="M 1285,216 L 1285,1350" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#626262">File source</text><path d="M 1670,216 L 1670,1350" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1562" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1670" y="190" fill="#626262">Records</text><rect x="892" y="417" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="122" y="579" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="764" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1277" y="949" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1662" y="1111" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="38" y="258" width="1724" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Start with the authorised company dataset and platform connection. Check the event source and client scope</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">before using its invoice ID.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="336" fill="#626262">RSD-01; RET-G01/02</text><rect x="38" y="1228" width="1724" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1252" fill="#626262">Listing can recover missed events. An error event needs its own action. Saved bytes do not prove product</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1275" fill="#626262">receipt or buyer acceptance.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1306" fill="#626262">INT-ERR01; RCV-01–09</text><rect x="142" y="354" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="372" fill="#626262">[Existing] INT-RCV01 §1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="396" fill="#626262">POST /internal/events/subscriptions</text><path d="M 130,417 L 892,417" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,411 L 892,417 L 880,423 Z" fill="#626262" stroke="#626262" /><rect x="142" y="435" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="453" fill="#626262">[Existing] INT-RCV01 §1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="477" fill="#626262">Subscription result; save the selected scope</text><path d="M 892,498 L 130,498" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,492 L 130,498 L 142,504" fill="none" stroke="#626262" /><rect x="142" y="516" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="534" fill="#626262">[Existing] INT-RCV01 §2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="558" fill="#626262">Received event: subject = invoice ID</text><path d="M 900,579 L 138,579" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 150,573 L 138,579 L 150,585 Z" fill="#626262" stroke="#626262" /><rect x="142" y="597" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="615" fill="#626262">[Existing] INT-RCV01 §2</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="639" fill="#626262">Event receipt; exact response to confirm</text><path d="M 138,660 L 900,660" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 888,654 L 900,660 L 888,666" fill="none" stroke="#626262" /><rect x="142" y="678" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="696" fill="#626262">[Existing] INT-RCV01 §3.1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="720" fill="#626262">GET /datasets/{datasetId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="743" fill="#626262">e-invoices/{e-invoiceId}</text><path d="M 130,764 L 507,764" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,758 L 507,764 L 495,770 Z" fill="#626262" stroke="#626262" /><rect x="142" y="782" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="800" fill="#626262">[Existing] INT-RCV01 §3.1</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="824" fill="#626262">Invoice details and each attachment</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="847" fill="#626262">downloadUrl</text><path d="M 507,868 L 130,868" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,862 L 130,868 L 142,874" fill="none" stroke="#626262" /><rect x="142" y="886" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="904" fill="#626262">[Existing] INT-RCV01 §4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="928" fill="#626262">GET {downloadUrl} for each required file</text><path d="M 130,949 L 1277,949" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,943 L 1277,949 L 1265,955 Z" fill="#626262" stroke="#626262" /><rect x="142" y="967" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="985" fill="#626262">[Existing] INT-RCV01 §4</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1009" fill="#626262">File bytes; no Sage bearer header</text><path d="M 1277,1030 L 130,1030" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1024 L 130,1030 L 142,1036" fill="none" stroke="#626262" /><rect x="142" y="1048" width="1516" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1066" fill="#1565C0">[Proposed] RSD-04; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1090" fill="#1565C0">Save and verify source bytes, role and hash</text><path d="M 130,1111 L 1662,1111" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1650,1105 L 1662,1111 L 1650,1117 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="1129" width="1516" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="1147" fill="#1565C0">[Proposed] RSD-04; RET-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="1171" fill="#1565C0">Saved file reference, or incomplete capture</text><path d="M 1662,1192 L 130,1192" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1186 L 130,1192 L 142,1198" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1390" fill="#626262">Solid: request. Dashed: result. Grey bars show handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1413" fill="#626262">Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>