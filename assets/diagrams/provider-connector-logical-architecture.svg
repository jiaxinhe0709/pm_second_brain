ns-serif" font-size="15" text-anchor="middle" fill="#222222">API</text><text x="370.0" y="810" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Alternative integration mode</text><text x="370.0" y="830" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">SPEC013 · Conditional</text></a><a href="../../specs/provider-connectors/SPEC-SEI-044-provider-connector-architecture-summary.md" aria-label="PRD214 Six private-provider bindings"><title>Provider-specific external contracts</title><rect x="1420" y="738" width="260" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1550.0" y="764" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Six private-provider</text><text x="1550.0" y="783" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">bindings</text><text x="1550.0" y="810" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Provider-specific external contracts</text><text x="1550.0" y="830" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">PRD214 · Scenario-specific</text></a><a href="../../specs/provider-connectors/SPEC-SEI-044-provider-connector-architecture-summary.md" aria-label="SPEC011 One SPFE binding"><title>External public contract</title><rect x="1715" y="738" width="260" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1845.0" y="764" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">One SPFE binding</text><text x="1845.0" y="810" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">External public contract</text><text x="1845.0" y="830" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">SPEC011 · Scenario-specific</text></a><a href="../../specs/provider-connectors/SPEC-SEI-044-provider-connector-architecture-summary.md" aria-label="CS06 / 07 / 12 / 16 Resolve blocked / uncertain work"><title>Keep original action and context</title><rect x="1420" y="598" width="260" height="104" rx="8" fill="#d7d7d7" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1550.0" y="624" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Resolve blocked / uncertain</text><text x="1550.0" y="643" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">work</text><text x="1550.0" y="670" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Keep original action and context</text><text x="1550.0" y="690" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">CS06 / 07 / 12 / 16 · Conditional</text></a><text x="28" y="950" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Scope: six private connectors (B2B Router, Banqup, EDICOM, SERES, ZeroComa, Sovos) + SPFE = seven; one common Sage API contract.</text><text x="28" y="974" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">A direct provider consumer is an alternative executor role, not a second sender for an action already assigned to a connector.</text><text x="28" y="998" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Shared API access has role-specific permissions. Notifications are dispatch, not a separate invoice API. Crossed lines do not join.</text></svg>