<svg xmlns="http://www.w3.org/2000/svg" aria-label="Setup recovery: check what happened" width="1030" height="1520" viewBox="0 0 1030 1520" role="img"><title>Setup recovery: check what happened</title><desc>Use after a timeout, conflicting status or an unknown setup result. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services. Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</desc><rect width="1030" height="1520" fill="white" /><rect x="8" y="8" width="1014" height="1504" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Setup recovery: check what happened</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Use after a timeout, conflicting status or an unknown setup result</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1394" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">ERP / product</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">Setup screen</text><path d="M 515,216 L 515,1394" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#626262">Sage</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,1394" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Original provider</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">Earlier setup request</text><rect x="24" y="348" width="982" height="68" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="446" width="982" height="314" fill="none" stroke="#626262" rx="0" /><rect x="24" y="894" width="982" height="268" fill="none" stroke="#1565C0" rx="0" /><rect x="507" y="620" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="1022" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="858" width="16" height="402" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="348" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="371" fill="#1565C0">ref | First: use the original SXS dataset and permission to inspect; do not create setup (2.1)</text><rect x="24" y="446" width="982" height="34" fill="#FAFAFA" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="469" fill="#626262">opt | Read only a known connection whose detail can safely add evidence</text><rect x="24" y="894" width="982" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="917" fill="#1565C0">opt | Check with the original provider only through a confirmed observation method</text><rect x="38" y="258" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Start: an earlier setup request has an uncertain result. Keep its original business, provider, environment and</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">request identity.</text><rect x="38" y="1296" width="954" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1320" fill="#626262">End: record confirmed success once. Retry only with proven absence of an effect and confirmed retry rules;</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1343" fill="#626262">otherwise hold with an owner. Never duplicate RETRYING work.</text><rect x="142" y="488" width="361" height="123" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="506" fill="#626262">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="530" fill="#626262">Read each address's setup status</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="553" fill="#626262">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="576" fill="#626262">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="599" fill="#626262">{connectionId}/</text><path d="M 130,620 L 507,620" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,614 L 507,620 L 495,626 Z" fill="#626262" stroke="#626262" /><rect x="142" y="638" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="656" fill="#626262">FR-04 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="680" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="703" fill="#626262">Each address: status + errorCode</text><path d="M 507,724 L 130,724" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,718 L 130,724 L 142,730" fill="none" stroke="#626262" /><rect x="142" y="772" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="790" fill="#1565C0">[To confirm] Setup request; ONB-08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="814" fill="#1565C0">Find out what happened</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="837" fill="#1565C0">Original request + business/provider</text><path d="M 130,858 L 507,858" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,852 L 507,858 L 495,864 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="936" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="954" fill="#1565C0">[To confirm] Earlier request status</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="978" fill="#1565C0">Check the earlier setup request</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1001" fill="#1565C0">Do not repeat it</text><path d="M 523,1022 L 892,1022" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1016 L 892,1022 L 880,1028 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1040" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1058" fill="#1565C0">[To confirm] Earlier request status</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1082" fill="#1565C0">Succeeded, no effect, conflict</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1105" fill="#1565C0">or result still unknown</text><path d="M 892,1126 L 523,1126" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,1120 L 523,1126 L 535,1132" fill="none" stroke="#1565C0" /><rect x="142" y="1174" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1192" fill="#1565C0">[Setup result] ONB-08/11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1216" fill="#1565C0">Confirmed result or pending action</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1239" fill="#1565C0">with a named owner</text><path d="M 507,1260 L 130,1260" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1254 L 130,1260 L 142,1266" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1434" fill="#626262">Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1457" fill="#626262">Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1480" fill="#626262">activation is separate.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>