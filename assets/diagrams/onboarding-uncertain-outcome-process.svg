<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Onboarding reconciliation: original operation</title><desc id="desc">Observe authoritative state before declaring success, absence or permission to repeat. An empty or failed query does not prove absence. A manual decision cites source evidence and cannot erase actual external state.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Onboarding reconciliation: original operation</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">Observe authoritative state before declaring success, absence or permission to repeat.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE COORDINATION</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">VALIDATION / ADAPTER</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">OPERATIONS / RECORDS</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; CONTEXT</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">ASSESS &amp; VALIDATE</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">DECIDE &amp; EXECUTE</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">EVIDENCE &amp; RECOVER</text><polyline points="540,221 600,221 600,591 660,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="890,591 950,591 950,393 1010,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1250,393 1360,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1259.0" y="357" width="82" height="22" fill="white" opacity=".96"/><text x="1300" y="373" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">success</text><polyline points="1590,393 1710,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1940,393 2000,393 2000,221 2060,221" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1130,440 1130,591 1360,591" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1199.0" y="554" width="82" height="22" fill="white" opacity=".96"/><text x="1240" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">absent</text><polyline points="1130,440 1130,798 1360,798" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1180.0" y="764" width="100" height="22" fill="white" opacity=".96"/><text x="1230" y="780" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">unresolved</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-05</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Freeze operation</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Original hash and operation ID</text><rect x="660" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="775.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-06</text><text x="775.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Query authority</text><text x="775.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Same entity and environment</text><polygon points="1130.0,350 1250,395.0 1130.0,440 1010,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2"/><text x="1130.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1130.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Outcome proven?</text><text x="1130.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Success, absence or unresolved</text><rect x="1360" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1475.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-06</text><text x="1475.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Commit success once</text><text x="1475.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Original effect and evidence</text><rect x="1710" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1825.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-08</text><text x="1825.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Update item state</text><text x="1825.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Readiness only if gates pass</text><ellipse cx="2175.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2175.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2175.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Explain result</text><text x="2175.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">One client and aggregate</text><polygon points="1384,548 1566,548 1590,591.0 1566,634 1384,634 1360,591.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1475.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-04</text><text x="1475.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Retry if permitted</text><text x="1475.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Proven absence and same identity</text><polygon points="1384,755 1566,755 1590,798.0 1566,841 1384,841 1360,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1475.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-07</text><text x="1475.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Escalate unresolved</text><text x="1475.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Owner, evidence and deadline</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">An empty or failed query does not prove absence. A manual decision cites source evidence and cannot erase actual external state.</text></svg>