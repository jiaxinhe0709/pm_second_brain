ht:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">absent</div></div></foreignObject><path d="M 1250,435 L 1260,435 L 1260,796 L 1360,796" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 5" /><polygon points="1360.0,796.0 1351.0,792.0 1351.0,800.0" fill="#555" /><rect x="1267" y="604.5" width="63" height="22" fill="white" /><foreignObject x="1267" y="604.5" width="63" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:11px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">unresolved</div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="2175" cy="252" rx="115" ry="50" /><foreignObject x="2066" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Explain the result and next steps</b><br /><span style="font-size:12px">Per-client result and portfolio summary</span></div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="425" cy="430" rx="115" ry="50" /><foreignObject x="316" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Hold the original operation</b><br /><span style="font-size:12px">Keep its operation ID and input hash</span><br /><span style="font-size:11px;color:#555">OFR-05</span></div></div></foreignObject><polygon fill="#d7d7d7" stroke="#333333" stroke-width="2" points="1130.0,380.0 1250.0,435.0 1130.0,490.0 1010.0,435.0" /><foreignObject x="1026" y="396" width="208" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Has the result been established?</b><br /><span style="font-size:12px">Success, confirmed absence or unresolved</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1360" y="380" width="230" height="100" rx="8" /><foreignObject x="1366" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Record confirmed success once</b><br /><span style="font-size:12px">Keep the original effect and evidence</span><br /><span style="font-size:11px;color:#555">OFR-06</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1710" y="380" width="230" height="100" rx="8" /><foreignObject x="1716" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Update the client&#x27;s setup result</b><br /><span style="font-size:12px">Ready only after required checks pass</span><br /><span style="font-size:11px;color:#555">OFR-08</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="660" y="568" width="230" height="100" rx="8" /><foreignObject x="666" y="574" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check the authoritative source</b><br /><span style="font-size:12px">Same business and environment</span><br /><span style="font-size:11px;color:#555">OFR-06</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="1382.0,568.0 1568.0,568.0 1590.0,618.0 1568.0,668.0 1382.0,668.0 1360.0,618.0" /><foreignObject x="1366" y="574" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Retry only when permitted</b><br /><span style="font-size:12px">Confirmed absence; same request identity</span><br /><span style="font-size:11px;color:#555">OFR-04</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="1382.0,746.0 1568.0,746.0 1590.0,796.0 1568.0,846.0 1382.0,846.0 1360.0,796.0" /><foreignObject x="1366" y="752" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Assign the unresolved case</b><br /><span style="font-size:12px">Owner, evidence and deadline</span><br /><span style="font-size:11px;color:#555">OFR-07</span></div></div></foreignObject><foreignObject x="25" y="921" width="2750" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Observe authoritative state before declaring success, absence or permission to repeat. An empty or failed query does not prove absence. A manual decision cites source evidence and cannot erase actual external state.</div></div></foreignObject></svg>