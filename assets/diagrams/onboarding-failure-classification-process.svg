<svg aria-label="Identify setup failures and choose a safe recovery" xmlns="http://www.w3.org/2000/svg" width="2800" height="1126" viewBox="0 0 2800 1126" role="img"><title>Identify setup failures and choose a safe recovery</title><desc>Business fault and operation safety are independent decisions for one entity and capability. Transport status alone never authorises a retry. Unknown mutations reconcile before repetition; mixed portfolio items remain independent. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</desc><rect width="2800" height="1126" fill="white" /><foreignObject x="25" y="15" width="2750" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:26px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Identify setup failures and choose a safe recovery</b></div></div></foreignObject><foreignObject x="25" y="58" width="2750" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="285" y="98" width="585" height="28" rx="8" /><foreignObject x="287" y="100" width="581" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#222;box