<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Onboarding failure: classify and recover</title><desc id="desc">Business fault and operation safety are independent decisions for one entity and capability. Transport status alone never authorises a retry. Unknown mutations reconcile before repetition; mixed portfolio items remain independent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Onboarding failure: classify and recover</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">Business fault and operation safety are independent decisions for one entity and capability.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE COORDINATION</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">VALIDATION / ADAPTER</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">OPERATIONS / RECORDS</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; CONTEXT</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">ASSESS &amp; VALIDATE</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">DECIDE &amp; EXECUTE</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">EVIDENCE &amp; RECOVER</text><polyline points="540,221 600,221 600,393 660,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="890,393 1010,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1250,393 1300,393 1300,591 1360,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1259.0" y="454" width="82" height="22" fill="white" opacity=".96"/><text x="1300" y="470" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">safe</text><polyline points="1590,591 1650,591 1650,393 1710,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1940,393 2000,393 2000,221 2060,221" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1130,350 1130,264" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1146.0" y="277" width="108" height="22" fill="white" opacity=".96"/><text x="1200" y="293" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">correctable</text><polyline points="1130,440 1130,798 1360,798" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1209.0" y="764" width="82" height="22" fill="white" opacity=".96"/><text x="1250" y="780" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">unknown</text><polyline points="1475,634 1475,798 1710,798" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1534.0" y="765" width="92" height="22" fill="white" opacity=".96"/><text x="1580" y="781" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">exhausted</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-01</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Capture attempt</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Durable intent and correlation</text><rect x="660" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="775.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-02</text><text x="775.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Classify result</text><text x="775.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Fault, safety and next action</text><polygon points="1130.0,350 1250,395.0 1130.0,440 1010,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2"/><text x="1130.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1130.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Safe to retry?</text><text x="1130.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Approved contract or read-only</text><rect x="1360" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1475.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-04</text><text x="1475.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Schedule retry</text><text x="1475.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Same identity and budget</text><rect x="1710" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1825.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-08</text><text x="1825.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Publish outcome</text><text x="1825.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">One client item and aggregate</text><ellipse cx="2175.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2175.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2175.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Show next action</text><text x="2175.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Ready, pending or action</text><polygon points="1034,178 1216,178 1240,221.0 1216,264 1034,264 1010,221.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1125.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-03</text><text x="1125.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Correct revision</text><text x="1125.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Customer or authority evidence</text><polygon points="1384,755 1566,755 1590,798.0 1566,841 1384,841 1360,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1475.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-05</text><text x="1475.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Hold unknown</text><text x="1475.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Possible external mutation</text><polygon points="1734,755 1916,755 1940,798.0 1916,841 1734,841 1710,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1825.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFR-07</text><text x="1825.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Escalate owned case</text><text x="1825.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Budget or contract unresolved</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">Transport status alone never authorises a retry. Unknown mutations reconcile before repetition; mixed portfolio items remain independent.</text></svg>