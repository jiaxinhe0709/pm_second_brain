<svg xmlns="http://www.w3.org/2000/svg" aria-label="Supported change" width="1030" height="1850" viewBox="0 0 1030 1850" role="img"><title>Supported change</title><desc>Requested extension or enabled transition; Private A to Private B stays disabled. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid requests; dashed paired responses; grey activation bars. Timing and service placement remain proposed. Current business access is required. HTTP success is separate from readiness and activation. Unknown evidence holds dependent work.</desc><rect width="1030" height="1850" fill="white" /><rect x="8" y="8" width="1014" height="1834" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Supported change</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Requested extension or enabled transition; Private A to Private B stays disabled</text><path d="M 8,124 L 1022,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1724" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#626262">Product</text><path d="M 515,216 L 515,1724" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,1724" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" te