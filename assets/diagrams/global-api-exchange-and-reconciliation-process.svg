<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Global API: invoice exchange, one executor and recoverable outcomes</title><desc id="desc">Proposed design. Customer send, inbound ingest and provider execution use separate permissions within one API contract. Solid arrows: owned request or result. Dashed: evidence, event or recovery. API receipt, notification acknowledgement and buyer acceptance remain separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555" /></marker></defs><rect width="2800" height="1000" fill="white" /><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Global API: invoice exchange, one executor and recoverable outcomes</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">Proposed design. Customer send, inbound ingest and provider execution use separate permissions within one API contract.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa" /><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa" /><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">PRODUCT / PARTNER</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa" /><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa" /><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">GLOBAL API / DOMAIN</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa" /><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa" /><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">AUTHORITY / EXECUTOR</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa" /><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa" /><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">ROUTING / OPERATIONS</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7" /><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; QUALIFY</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7" /><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">AUTHORITY &amp; READINESS</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7" /><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">CONTROLLED EXECUTION</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7" /><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">OUTCOMES &amp; CONTINUITY</text><polyline points="540,221 590,221 590,393 630,393" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="630.00,393.00 620.00,389.00 620.00,397.00" fill="#555" /><polyline points="860,393 950,393" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="950.00,393.00 940.00,389.00 940.00,397.00" fill="#555" /><polyline points="1180,393 1220,393 1220,395 1270,395" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="1270.00,395.00 1260.00,391.00 1260.00,399.00" fill="#555" /><polyline points="1510,395 1550,395 1550,393 1610,393" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="1610.00,393.00 1600.00,389.00 1600.00,397.00" fill="#555" /><rect x="1510.0" y="359" width="100" height="22" fill="white" opacity=".96" /><text x="1560" y="375" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">final send</text><polyline points="1390,440 1390,548" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="1390.00,548.00 1394.00,538.00 1386.00,538.00" fill="#555" /><rect x="1414.0" y="484" width="82" height="22" fill="white" opacity=".96" /><text x="1455" y="500" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">inbound</text><polyline points="1860,393 1890,393 1890,591 1940,591" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="1940.00,591.00 1930.00,587.00 1930.00,595.00" fill="#555" /><polyline points="2190,591 2210,591 2210,593 2230,593" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="2230.00,593.00 2220.00,589.00 2220.00,597.00" fill="#555" /><polyline points="2470,593 2660,593 2660,755" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="2660.00,755.00 2664.00,745.00 2656.00,745.00" fill="#555" /><rect x="2504.0" y="558" width="82" height="22" fill="white" opacity=".96" /><text x="2545" y="574" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">known</text><polyline points="2350,638 2350,710 2065,710 2065,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="2065.00,755.00 2069.00,745.00 2061.00,745.00" fill="#555" /><rect x="2229.0" y="679" width="82" height="22" fill="white" opacity=".96" /><text x="2270" y="695" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">unknown</text><polyline points="1940,798 1905,798 1905,670 2065,670 2065,634" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="2065.00,634.00 2061.00,644.00 2069.00,644.00" fill="#555" /><rect x="1827.0" y="679" width="156" height="22" fill="white" opacity=".96" /><text x="1905" y="695" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">proven-safe retry</text><polyline points="2190,820 2200,820 2200,855 2660,855 2660,841" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="2660.00,841.00 2656.00,851.00 2664.00,851.00" fill="#555" /><rect x="2436.0" y="867" width="148" height="22" fill="white" opacity=".96" /><text x="2510" y="883" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">evidenced result</text><polyline points="2550,798 2470,798" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="2470.00,798.00 2480.00,802.00 2480.00,794.00" fill="#555" /><rect x="2452.0" y="764" width="116" height="22" fill="white" opacity=".96" /><text x="2510" y="780" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">durable fact</text><polyline points="2470,825 2505,825 2505,221 2545,221" fill="none" stroke="#555" stroke-width="2.2" /><polygon points="2545.00,221.00 2535.00,217.00 2535.00,225.00" fill="#555" /><rect x="2504.0" y="444" width="132" height="22" fill="white" opacity=".96" /><text x="2570" y="460" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">read / recover</text><polyline points="2430,755 2430,470 2655,470 2655,264" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="2655.00,264.00 2651.00,274.00 2659.00,274.00" fill="#555" /><rect x="2470.0" y="427" width="180" height="22" fill="white" opacity=".96" /><text x="2560" y="443" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">durable notification</text><polyline points="1390,634 1390,930 2340,930 2340,841" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="2340.00,841.00 2336.00,851.00 2344.00,851.00" fill="#555" /><rect x="1544.0" y="896" width="212" height="22" fill="white" opacity=".96" /><text x="1650" y="912" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">original intake evidence</text><polyline points="745,436 745,710 1080,710 1080,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="1080.00,755.00 1084.00,745.00 1076.00,745.00" fill="#555" /><rect x="849.0" y="677" width="82" height="22" fill="white" opacity=".96" /><text x="890" y="693" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">denied</text><polyline points="1065,436 1065,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" /><polygon points="1065.00,755.00 1069.00,745.00 1061.00,745.00" fill="#555" /><rect x="1063.0" y="634" width="164" height="22" fill="white" opacity=".96" /><text x="1145" y="650" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">invalid / conflict</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2" /><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-03</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Request invoice intent</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Customer send or inbound ingest</text><rect x="630" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="745.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-03</text><text x="745.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Check current authority</text><text x="745.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Principal, entity, action and scope</text><rect x="950" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="1065.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-04</text><text x="1065.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Save durable receipt</text><text x="1065.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Per-item digest and repeat identity</text><polygon points="1390.0,350 1510,395.0 1390.0,440 1270,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2" /><text x="1390.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1390.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Which accepted intent?</text><text x="1390.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Send or ingest</text><rect x="1270" y="548" width="240" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="1390.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-05</text><text x="1390.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Ingest received original</text><text x="1390.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Dedup, quarantine, product scope</text><rect x="1610" y="350" width="250" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="1735.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-05</text><text x="1735.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Freeze final send plan</text><text x="1735.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Route, profile, trust, separate actions</text><rect x="1940" y="548" width="250" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="2065.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-05</text><text x="2065.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">One assigned executor</text><text x="2065.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Sage adapter OR partner claim</text><polygon points="2350.0,548 2470,593.0 2350.0,638 2230,593.0" fill="#d7d7d7" stroke="#333333" stroke-width="2" /><text x="2350.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="2350.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Result established?</text><text x="2350.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Known or unknown</text><rect x="2550" y="755" width="220" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="2660.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-06</text><text x="2660.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Save source evidence</text><text x="2660.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Event, invoice, action, reference, time</text><rect x="2210" y="755" width="260" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2" /><text x="2340.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-06 / 08</text><text x="2340.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">History + durable events</text><text x="2340.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Independent state and action outcomes</text><ellipse cx="2660.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2" /><text x="2660.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-07 / 08</text><text x="2660.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Retrieve / acknowledge</text><text x="2660.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Scoped reads and event recovery</text><polygon points="974,755 1186,755 1210,798.0 1186,841 974,841 950,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" /><text x="1080.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-03 / 04</text><text x="1080.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Deny / correct input</text><text x="1080.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">No protected effect or disclosure</text><polygon points="1964,755 2166,755 2190,798.0 2166,841 1964,841 1940,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" /><text x="2065.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">GPA-08 / 12</text><text x="2065.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Reconcile original action</text><text x="2065.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Claim expiry cannot permit resend</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">Solid arrows: owned request or result. Dashed: evidence, event or recovery. API receipt, notification acknowledgement and buyer acceptance remain separate.</text></svg>