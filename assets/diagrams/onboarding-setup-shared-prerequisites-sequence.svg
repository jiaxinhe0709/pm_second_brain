<svg xmlns="http://www.w3.org/2000/svg" aria-label="Start onboarding: business and certificate checks" width="1415" height="1747" viewBox="0 0 1415 1747" role="img"><title>Start onboarding: business and certificate checks</title><desc>Reuse valid evidence; create a dataset only when the selected channel requires it. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services. Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</desc><rect width="1415" height="1747" fill="white" /><rect x="8" y="8" width="1399" height="1731" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Start onboarding: business and certificate checks</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Reuse valid evidence; create a dataset only when the selected channel requires it</text><path d="M 8,124 L 1407,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1644" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">ERP / product</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">Setup screen</text><path d="M 515,216 L 515,1644" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#626262">Sage</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,1644" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Business identity</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">and permission</text><path d="M 1285,216 L 1285,1644" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="178" fill="#626262">Tax Service</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="201" fill="#626262">Certificates</text><rect x="24" y="638" width="1367" height="268" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1040" width="1367" height="476" fill="none" stroke="#1565C0" rx="0" /><rect x="892" y="498" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1277" y="766" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="394" width="16" height="610" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1168" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="507" y="1376" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="638" width="1367" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="661" fill="#1565C0">opt | Certificate required for this purpose; reuse valid evidence</text><rect x="24" y="1040" width="1367" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1063" fill="#1565C0">opt | Only if checks pass and this channel needs a new dataset; confirm Spain inputs and safe repeat rules</text><rect x="38" y="258" width="1339" height="44" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Start: the customer or accountant selects a business and setup action in the ERP. Reuse valid evidence.</text><rect x="38" y="1546" width="1339" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1570" fill="#626262">End: checks pass and any required dataset ID is stored, or the affected work waits for a named owner. Spain</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1593" fill="#626262">contracts remain open.</text><rect x="142" y="308" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="326" fill="#1565C0">[To confirm] Setup request; ONB-02/03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="350" fill="#1565C0">Start setup checks</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="373" fill="#1565C0">Business NIF + caller + action</text><path d="M 130,394 L 507,394" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,388 L 507,394 L 495,400 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="412" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="430" fill="#1565C0">[To confirm] Identity/permission API</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="454" fill="#1565C0">Validate the business NIF</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="477" fill="#1565C0">and permission for this action</text><path d="M 523,498 L 892,498" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,492 L 892,498 L 880,504 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="516" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="534" fill="#1565C0">[To confirm] Identity/permission API</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="558" fill="#1565C0">Identity and permission confirmed</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="581" fill="#1565C0">or missing item + action owner</text><path d="M 892,602 L 523,602" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,596 L 523,602 L 535,608" fill="none" stroke="#1565C0" /><rect x="527" y="680" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="698" fill="#1565C0">[To confirm] Tax Service; CERT-05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="722" fill="#1565C0">Find a suitable in-date certificate</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="745" fill="#1565C0">for this business and action</text><path d="M 523,766 L 1277,766" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,760 L 1277,766 L 1265,772 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="784" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="802" fill="#1565C0">[To confirm] Tax Service; CERT-05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="826" fill="#1565C0">Usable: protected certificate reference</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="849" fill="#1565C0">Otherwise: reason or unknown result</text><path d="M 1277,870 L 523,870" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 535,864 L 523,870 L 535,876" fill="none" stroke="#1565C0" /><rect x="142" y="918" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="936" fill="#1565C0">[Setup result] ONB-02/03/08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="960" fill="#1565C0">Checks passed: continue</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="983" fill="#1565C0">Otherwise: missing item + owner</text><path d="M 507,1004 L 130,1004" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,998 L 130,1004 L 142,1010" fill="none" stroke="#1565C0" /><rect x="142" y="1082" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1100" fill="#626262">[Existing guide] INT-DS01; X-Idempotency-Key</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1124" fill="#626262">Create / confirm missing dataset</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1147" fill="#626262">POST /datasets</text><path d="M 130,1168 L 507,1168" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1162 L 507,1168 L 495,1174 Z" fill="#626262" stroke="#626262" /><rect x="142" y="1186" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1204" fill="#626262">INT-DS01; provisioning started</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1228" fill="#626262">202 Accepted</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1251" fill="#626262">Creation started; no dataset ID yet</text><path d="M 507,1272 L 130,1272" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1266 L 130,1272 L 142,1278" fill="none" stroke="#626262" /><rect x="142" y="1290" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1308" fill="#626262">[Existing guide] Same input + same key</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1332" fill="#626262">Create / confirm missing dataset</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1355" fill="#626262">POST /datasets</text><path d="M 130,1376 L 507,1376" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1370 L 507,1376 L 495,1382 Z" fill="#626262" stroke="#626262" /><rect x="142" y="1394" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1412" fill="#626262">INT-DS01; successful confirmation path</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1436" fill="#626262">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1459" fill="#626262">Save returned tenantId as datasetId</text><path d="M 507,1480 L 130,1480" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1474 L 130,1480 L 142,1486" fill="none" stroke="#626262" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1684" fill="#626262">Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1707" fill="#626262">Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>