<svg xmlns="http://www.w3.org/2000/svg" aria-label="Start onboarding: SXS and credential checks" width="1800" height="2195" viewBox="0 0 1800 2195" role="img"><title>Start onboarding: SXS and credential checks</title><desc>Product integrations with SXS and Tax Connections Service are already available. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services. Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</desc><rect width="1800" height="2195" fill="white" /><rect x="8" y="8" width="1784" height="2179" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Start onboarding: SXS and credential checks</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Product integrations with SXS and Tax Connections Service are already available</text><path d="M 8,124 L 1792,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,2092" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">ERP / product</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">Setup screen</text><path d="M 515,216 L 515,2092" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#626262">SXS</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#626262">Dataset / tenant</text><path d="M 900,216 L 900,2092" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Sage</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">E-Invoice API</text><path d="M 1285,216 L 1285,2092" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="178" fill="#626262">Identity</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="201" fill="#626262">NIF / permission</text><path d="M 1670,216 L 1670,2092" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1562" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1670" y="178" fill="#626262">Tax / Connections</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1670" y="201" fill="#626262">Certificates</text><rect x="24" y="758" width="1752" height="268" fill="none" stroke="#1565C0" rx="0" /><rect x="24" y="1480" width="1752" height="358" fill="none" stroke="#1565C0" rx="0" /><rect x="507" y="528" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="886" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1277" y="1340" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1662" y="1608" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="1236" width="16" height="700" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="758" width="1752" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="781" fill="#1565C0">opt | Load current saved setup only where the selected channel supports API-02</text><rect x="24" y="1480" width="1752" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1503" fill="#1565C0">opt | Certificate required for this action; reuse suitable saved credentials</text><rect x="38" y="258" width="1724" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Before customer setup: the product is integrated with SXS and Tax Connections Service. These are product</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">prerequisites, not repeated customer registrations.</text><rect x="38" y="348" width="1724" height="88" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="372" fill="#626262">ERP/product first checks permission to view the selected business or accountant client. Firm login does not</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="395" fill="#626262">replace client access. The product uses its qualified SXS integration; actual interface and business/client</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="418" fill="#626262">mapping remain GAP-01/06.</text><rect x="38" y="668" width="1724" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="692" fill="#626262">Continue only with a confirmed dataset mapping. Missing setup follows the channel-specific SXS process; an</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="715" fill="#626262">unavailable lookup remains pending. Reuse the dataset when adding a platform.</text><rect x="38" y="1056" width="1724" height="88" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1080" fill="#626262">ERP/product shows permitted saved setup. The customer or authorised accountant confirms the requested</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1103" fill="#626262">action/functions before the product requests shared checks. These are ONB-01/10 product actions, not</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1126" fill="#626262">additional API contracts.</text><rect x="38" y="1748" width="1724" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1772" fill="#626262">Missing credential: use separate Connections Service provisioning (040 section 2), then repeat the check. An</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1795" fill="#626262">unavailable lookup does not justify another upload.</text><rect x="38" y="1972" width="1724" height="88" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1996" fill="#626262">End: reuse the resolved dataset and any required suitable credential, or return the pending action and owner.</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2019" fill="#626262">Keep each returned reference with its source API; credential/E-Invoice ID relationships remain unconfirmed</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="2042" fill="#626262">under GAP-06.</text><rect x="142" y="442" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="460" fill="#1565C0">[To confirm] SXS interface; GAP-01/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="484" fill="#1565C0">Resolve the company dataset</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="507" fill="#1565C0">Business/client + environment</text><path d="M 130,528 L 507,528" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,522 L 507,528 L 495,534 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="546" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="564" fill="#1565C0">[To confirm] SXS interface; GAP-01/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="588" fill="#1565C0">datasetId / tenantId</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="611" fill="#1565C0">or missing/unknown + next action</text><path d="M 507,632 L 130,632" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,626 L 130,632 L 142,638" fill="none" stroke="#1565C0" /><rect x="142" y="800" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="818" fill="#626262">[Existing] API-02 / FR-02; Spain applicability open</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="842" fill="#626262">Load permitted current setup</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="865" fill="#626262">GET /datasets/{datasetId}/accesspoints</text><path d="M 130,886 L 892,886" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,880 L 892,886 L 880,892 Z" fill="#626262" stroke="#626262" /><rect x="142" y="904" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="922" fill="#626262">FR-02 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="946" fill="#626262">Access-point entries + saved references</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="969" fill="#626262">Configuration alone is not readiness</text><path d="M 892,990 L 130,990" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,984 L 130,990 L 142,996" fill="none" stroke="#626262" /><rect x="142" y="1150" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="1168" fill="#1565C0">[To confirm] Setup request; ONB-02/03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="1192" fill="#1565C0">Check onboarding prerequisites</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="1215" fill="#1565C0">NIF + datasetId + caller + action</text><path d="M 130,1236 L 892,1236" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1230 L 892,1236 L 880,1242 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="1254" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1272" fill="#1565C0">[To confirm] Identity/permission API</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1296" fill="#1565C0">Validate the business NIF</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1319" fill="#1565C0">and permission for this action</text><path d="M 908,1340 L 1277,1340" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,1334 L 1277,1340 L 1265,1346 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="1358" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1376" fill="#1565C0">[To confirm] Identity/permission API</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1400" fill="#1565C0">Identity and permission confirmed</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1423" fill="#1565C0">or missing item + action owner</text><path d="M 1277,1444 L 908,1444" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 920,1438 L 908,1444 L 920,1450" fill="none" stroke="#1565C0" /><rect x="912" y="1522" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1285.0" y="1540" fill="#1565C0">[To confirm] Tax/Connections B2B lookup; CERT-04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1285.0" y="1564" fill="#1565C0">Find and check the saved credential</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1285.0" y="1587" fill="#1565C0">Dataset + business + action + environment</text><path d="M 908,1608 L 1662,1608" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1650,1602 L 1662,1608 L 1650,1614 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="1626" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1285.0" y="1644" fill="#1565C0">[To confirm] Tax/Connections B2B lookup; CERT-04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1285.0" y="1668" fill="#1565C0">Protected credential connection ID</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1285.0" y="1691" fill="#1565C0">or missing/unsuitable/unknown + action</text><path d="M 1662,1712 L 908,1712" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 920,1706 L 908,1712 L 920,1718" fill="none" stroke="#1565C0" /><rect x="142" y="1850" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="1868" fill="#1565C0">[Setup result] ONB-02/03/08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="1892" fill="#1565C0">Checks passed: continue</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="1915" fill="#1565C0">Otherwise: missing item + owner</text><path d="M 892,1936 L 130,1936" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1930 L 130,1936 L 142,1942" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2132" fill="#626262">Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2155" fill="#626262">Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>