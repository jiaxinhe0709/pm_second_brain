<svg xmlns="http://www.w3.org/2000/svg" aria-label="Start onboarding: SXS and credential checks" width="1800" height="1651" viewBox="0 0 1800 1651" role="img"><title>Start onboarding: SXS and credential checks</title><desc>Product integrations with SXS and Tax Connections Service are already available. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services. Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</desc><rect width="1800" height="1651" fill="white" /><rect x="8" y="8" width="1784" height="1635" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Start onboarding: SXS and credential checks</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Product integrations with SXS and Tax Connections Service are already available</text><path d="M 8,124 L 1792,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1548" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="178" fill="#626262">ERP / product</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="201" fill="#626262">Setup screen</text><path d="M 515,216 L 515,1548" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#626262">SXS</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#626262">Dataset / tenant</text><path d="M 900,216 L 900,1548" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="178" fill="#626262">Sage</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#626262">E-Invoice API</text><path d="M 1285,216 L 1285,1548" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="178" fill="#626262">Identity</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="201" fill="#626262">NIF / permission</text><path d="M 1670,216 L 1670,1548" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1562" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1670" y="178" fill="#626262">Tax / Connections</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1670" y="201" fill="#626262">Certificates</text><rect x="24" y="958" width="1752" height="358" fill="none" stroke="#1565C0" rx="0" /><rect x="507" y="416" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1277" y="818" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1662" y="1086" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="892" y="714" width="16" height="700" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="958" width="1752" height="34" fill="#EFF6FF" stroke="#1565C0" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="981" fill="#1565C0">opt | Certificate required for this action; reuse suitable saved credentials</text><rect x="38" y="258" width="1724" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#626262">Before customer setup: the product is integrated with SXS and Tax Connections Service. These are product</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#626262">prerequisites, not repeated customer registrations.</text><rect x="38" y="556" width="1724" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="580" fill="#626262">Continue only with a confirmed dataset mapping. Missing setup follows the channel-specific SXS process; an</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="603" fill="#626262">unavailable lookup remains pending. Reuse the dataset when adding a platform.</text><rect x="38" y="1226" width="1724" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1250" fill="#626262">Missing credential: use separate Connections Service provisioning (040 section 2), then repeat the check. An</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1273" fill="#626262">unavailable lookup does not justify another upload.</text><rect x="38" y="1450" width="1724" height="66" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1474" fill="#626262">End: reuse the resolved dataset and any required suitable credential, or return the pending action and owner.</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1497" fill="#626262">Credential connection IDs and access-point connection IDs are separate. Spain interfaces remain open.</text><rect x="142" y="330" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="348" fill="#1565C0">[To confirm] SXS interface; GAP-01/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="372" fill="#1565C0">Resolve the company dataset</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="395" fill="#1565C0">Business/client + environment</text><path d="M 130,416 L 507,416" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,410 L 507,416 L 495,422 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="434" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="452" fill="#1565C0">[To confirm] SXS interface; GAP-01/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="476" fill="#1565C0">datasetId / tenantId</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="499" fill="#1565C0">or missing/unknown + next action</text><path d="M 507,520 L 130,520" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,514 L 130,520 L 142,526" fill="none" stroke="#1565C0" /><rect x="142" y="628" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="646" fill="#1565C0">[To confirm] Setup request; ONB-02/03</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="670" fill="#1565C0">Check onboarding prerequisites</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="693" fill="#1565C0">NIF + datasetId + caller + action</text><path d="M 130,714 L 892,714" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,708 L 892,714 L 880,720 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="732" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="750" fill="#1565C0">[To confirm] Identity/permission API</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="774" fill="#1565C0">Validate the business NIF</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="797" fill="#1565C0">and permission for this action</text><path d="M 908,818 L 1277,818" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,812 L 1277,818 L 1265,824 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="836" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="854" fill="#1565C0">[To confirm] Identity/permission API</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="878" fill="#1565C0">Identity and permission confirmed</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="901" fill="#1565C0">or missing item + action owner</text><path d="M 1277,922 L 908,922" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 920,916 L 908,922 L 920,928" fill="none" stroke="#1565C0" /><rect x="912" y="1000" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1285.0" y="1018" fill="#1565C0">[To confirm] Tax/Connections B2B lookup; CERT-04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1285.0" y="1042" fill="#1565C0">Find and check the saved credential</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1285.0" y="1065" fill="#1565C0">Dataset + business + action + environment</text><path d="M 908,1086 L 1662,1086" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1650,1080 L 1662,1086 L 1650,1092 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="1104" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1285.0" y="1122" fill="#1565C0">[To confirm] Tax/Connections B2B lookup; CERT-04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1285.0" y="1146" fill="#1565C0">Protected credential connection ID</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1285.0" y="1169" fill="#1565C0">or missing/unsuitable/unknown + action</text><path d="M 1662,1190 L 908,1190" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 920,1184 L 908,1190 L 920,1196" fill="none" stroke="#1565C0" /><rect x="142" y="1328" width="746" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="515.0" y="1346" fill="#1565C0">[Setup result] ONB-02/03/08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="1370" fill="#1565C0">Checks passed: continue</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="515.0" y="1393" fill="#1565C0">Otherwise: missing item + owner</text><path d="M 892,1414 L 130,1414" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1408 L 130,1414 L 142,1420" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1588" fill="#626262">Solid arrows: requests. Dashed arrows: responses. Lanes show responsibilities, not separate deployed services.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1611" fill="#626262">Blue marks Spain work or an interface to confirm; it does not mean a new API. Provider setup may finish later. Route activation is separate.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>