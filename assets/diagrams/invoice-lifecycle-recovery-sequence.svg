<svg xmlns="http://www.w3.org/2000/svg" aria-label="Keep successful status; resolve uncertain cancellation" width="1415" height="1218" viewBox="0 0 1415 1218" role="img"><title>Keep successful status; resolve uncertain cancellation</title><desc>A failed local attempt and an unknown external report are different results. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid: request. Dashed: result. Grey bars show handling, not elapsed time. Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</desc><rect width="1415" height="1218" fill="white" /><rect x="8" y="8" width="1399" height="1202" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Keep successful status; resolve uncertain cancellation</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">A failed local attempt and an unknown external report are different results</text><path d="M 8,124 L 1407,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1115" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#626262">ERP / product</text><path d="M 515,216 L 515,1115" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#626262">E-Invoice API</text><path d="M 900,216 L 900,1115" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#626262">Reporting / operations</text><path d="M 1285,216 L 1285,1115" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#626262">Original destination</text><rect x="24" y="258" width="1367" height="245" fill="none" stroke="#626262" rx="0" /><rect x="24" y="533" width="1367" height="430" fill="none" stroke="#626262" rx="0" /><rect x="507" y="363" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1277" y="638" width="16" height="104" fill="#dddddd" stroke="#626262" rx="0" /><rect x="1277" y="846" width="16" height="81" fill="#dddddd" stroke="#626262" rx="0" /><rect x="24" y="258" width="1367" height="34" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#626262">case | Status transition is confirmed failed</text><rect x="24" y="533" width="1367" height="34" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="556" fill="#626262">case | Cancellation may have reached its destination</text><rect x="38" y="993" width="1339" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1017" fill="#626262">Hold replacement until cancellation is resolved. Keep the original route, request and evidence. Never hide</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1040" fill="#626262">uncertainty with a new key or destination. Lifecycle Completed (209) differs from operational COMPLETED.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1071" fill="#626262">LCS-R14; LCS-A26/27; LCS-SPFE-A03</text><rect x="142" y="300" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="318" fill="#626262">[Existing] INT-LCS02/05; INT-ERR01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="342" fill="#626262">GET invoice and matching history</text><path d="M 130,363 L 507,363" fill="none" stroke="#626262" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,357 L 507,363 L 495,369 Z" fill="#626262" stroke="#626262" /><rect x="142" y="381" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="399" fill="#626262">[Existing] INT-LCS02/05; INT-ERR01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="423" fill="#626262">Last successful status; failed attempt</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="446" fill="#626262">operationStatus = ERROR</text><path d="M 507,467 L 130,467" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,461 L 130,467 L 142,473" fill="none" stroke="#626262" /><rect x="912" y="575" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="593" fill="#1565C0">[Spain proposal] LCS-09/10</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="617" fill="#1565C0">Original CANCEL* report</text><path d="M 900,638 L 1277,638" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,632 L 1277,638 L 1265,644 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="656" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="674" fill="#1565C0">[Spain proposal] LCS-09/10</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="698" fill="#1565C0">No reliable result: preserve outcome</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="721" fill="#1565C0">unknown</text><path d="M 1277,742 L 900,742" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 912,736 L 900,742 L 912,748" fill="none" stroke="#1565C0" /><rect x="912" y="760" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="778" fill="#1565C0">[Proposed] LIF-G06; no lookup endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="802" fill="#1565C0">Check the original result through</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="825" fill="#1565C0">confirmed read/support</text><path d="M 900,846 L 1277,846" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,840 L 1277,846 L 1265,852 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="864" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="882" fill="#1565C0">[Proposed] LIF-G06; no lookup endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="906" fill="#1565C0">Proved result, or an owned manual case</text><path d="M 1277,927 L 900,927" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 912,921 L 900,927 L 912,933" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1155" fill="#626262">Solid: request. Dashed: result. Grey bars show handling, not elapsed 