<svg aria-label="Failed attempt and uncertain cancellation recovery" xmlns="http://www.w3.org/2000/svg" width="1415" height="1515" viewBox="0 0 1415 1515" role="img"><title>Failed attempt and uncertain cancellation recovery</title><desc>Keep successful status, attempt results and destination reporting outcomes distinct. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests or deliveries. Dashed arrows: paired results. Grey bars show handling, not elapsed time. Guide/PRE transport: supplied evidence. Proposed/To qualify: design or missing contract, not deployed coverage.</desc><rect width="1415" height="1515" fill="white" /><rect x="8" y="8" width="1399" height="1499" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Failed attempt and uncertain cancellation recovery</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Keep successful status, attempt results and destination reporting outcomes distinct</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1412" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,1412" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1412" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Reporting / operations</text><path d="M 1285,216 L 1285,1412" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Original destination</text><rect x="24" y="258" width="1367" height="382" fill="none" stroke="#777777" rx="0" /><rect x="24" y="670" width="1367" height="590" fill="none" stroke="#777777" rx="0" /><rect x="507" y="386" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="798" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="1120" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="258" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#222222">case | A transition is confirmed failed</text><rect x="24" y="670" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="693" fill="#222222">case | A Spain report cancellation may have reached its destination</text><rect x="38" y="526" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="550" fill="#222222">Expose the failed attempt and an owned corrective action. Lifecycle Completed (209) differs from operational</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="573" fill="#222222">COMPLETED. A saved business fact remains when only its report fails.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="604" fill="#888888">LCS-R14; LCS-A26/27</text><rect x="38" y="938" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="962" fill="#222222">Hold replacement reporting. A local processing ERROR does not prove external non-execution. Keep the original</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="985" fill="#222222">route, payload, operation identity and all evidence.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1016" fill="#888888">LCS-SPFE-R03; LCS-A08/09/12; LIF-G06/07</text><rect x="38" y="1290" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1314" fill="#222222">Resume only when the selected contract and observed result permit it. Never issue a new key, send replacement</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1337" fill="#222222">first, withdraw the invoice or switch destination to hide an uncertain cancellation.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1368" fill="#888888">LCS-SPFE-A03; LIF-API-A05/06/07</text><rect x="142" y="300" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="318" fill="#888888">[Guide] INT-LCS02/05; INT-ERR01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="342" fill="#222222">GET existing invoice and correlated</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="365" fill="#222222">history</text><path d="M 130,386 L 507,386" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,380 L 507,386 L 495,392 Z" fill="#444444" stroke="#444444" /><rect x="142" y="404" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="422" fill="#888888">[Guide] INT-LCS02/05; INT-ERR01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="446" fill="#222222">Last successful currentStatus; failed</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="469" fill="#222222">history operationStatus = ERROR</text><path d="M 507,490 L 130,490" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,484 L 130,490 L 142,496" fill="none" stroke="#444444" /><rect x="912" y="712" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="730" fill="#888888">[Proposed] LCS-09/10; SPFE-S03; LIF-G04/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="754" fill="#222222">Original CANCEL* obligation with saved</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="777" fill="#222222">request identity</text><path d="M 900,798 L 1277,798" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,792 L 1277,798 L 1265,804 Z" fill="#444444" stroke="#444444" /><rect x="912" y="816" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="834" fill="#888888">[Proposed] LCS-09/10; SPFE-S03; LIF-G04/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="858" fill="#222222">No reliable completion result; external</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="881" fill="#222222">outcome remains unknown</text><path d="M 1277,902 L 900,902" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 912,896 L 900,902 L 912,908" fill="none" stroke="#444444" /><rect x="912" y="1034" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1052" fill="#888888">[To qualify] LIF-G06; no reconciliation endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1076" fill="#222222">Reconcile original operation under</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1099" fill="#222222">qualified read/support contract</text><path d="M 900,1120 L 1277,1120" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,1114 L 1277,1120 L 1265,1126 Z" fill="#444444" stroke="#444444" /><rect x="912" y="1138" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1156" fill="#888888">[To qualify] LIF-G06; no reconciliation endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1180" fill="#222222">Proven result, or owned manual case if</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1203" fill="#222222">lookup is unavailable</text><path d="M 1277,1224 L 900,1224" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 912,1218 L 900,1224 L 912,1230" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1452" fill="#888888">Solid arrows: requests or deliveries. Dashed arrows: paired results. Grey bars show handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1475" fill="#888888">Guide/PRE transport: supplied evidence. Proposed/To qualify: design or missing contract, not deployed coverage.</text></svg>