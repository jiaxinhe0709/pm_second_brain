 fill="#555555">ONB-11 · Common</text></a><text x="28" y="1030" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Logical responsibility groups; actual service ownership, API fields and provider interfaces require qualification.</text><text x="28" y="1054" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Connection checks and readiness do not activate a route. Phase gates and supported scope apply to every branch.</text><text x="28" y="1078" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Preserve valid unaffected services. Reconcile possible external effects before repeating a change or reporting activation.</text></svg>