<svg aria-label="Check and correct invoice data before issuance" xmlns="http://www.w3.org/2000/svg" width="2800" height="938" viewBox="0 0 2800 938" role="img"><title>Check and correct invoice data before issuance</title><desc>Validate a preserved source or a separately generated candidate under exact activated rules. A preflight PASS is local and time-bound. Correction creates a new source revision; original bytes and failed result remain. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</desc><rect width="2800" height="938" fill="white" /><foreignObject x="25" y="15" width="2750" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:26px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check and correct invoice data before issuance</b></div></div></foreignObject><foreignObject x="25" y="58" width="2750" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="285" y="98" width="585" height="28" rx="8" /><foreignObject x="287" y="100" width="581" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">RECEIVE THE REQUEST</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="880" y="98" width="585" height="28" rx="8" /><foreignObject x="882" y="100" width="581" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">CHECK THE INPUT</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="1475" y="98" width="605" height="28" rx="8" /><foreignObject x="1477" y="100" width="601" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">DECIDE &amp; PERFORM THE ACTION</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="2090" y="98" width="680" height="28" rx="8" /><foreignObject x="2092" y="100" width="676" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">SAVE RESULTS &amp; RECOVER</div></div></foreignObject><rect x="25" y="170" width="2750" height="164" fill="#fafafa" stroke="#aaa" /><rect x="25" y="170" width="250" height="164" fill="#e5e5e5" stroke="#