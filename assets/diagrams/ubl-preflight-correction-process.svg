<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">UBL preflight and correction</title><desc id="desc">Validate a preserved source or a separately generated candidate under exact activated rules. A preflight PASS is local and time-bound. Correction creates a new source revision; original bytes and failed result remain.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">UBL preflight and correction</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">Validate a preserved source or a separately generated candidate under exact activated rules.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE COORDINATION</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">VALIDATION / ADAPTER</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">OPERATIONS / RECORDS</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; CONTEXT</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">ASSESS &amp; VALIDATE</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">DECIDE &amp; EXECUTE</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">EVIDENCE &amp; RECOVER</text><polyline points="540,221 600,221 600,393 660,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="890,393 950,393 950,591 1010,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1240,591 1300,591 1300,393 1360,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1590,393 1710,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1940,393 2000,393 2000,221 2060,221" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="775,436 775,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="796.0" y="634" width="108" height="22" fill="white" opacity=".96"/><text x="850" y="650" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">unavailable</text><polyline points="1825,436 1825,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1854.0" y="634" width="132" height="22" fill="white" opacity=".96"/><text x="1920" y="650" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">blocking issue</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-01</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Capture source</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Facts or exact UBL and hash</text><rect x="660" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="775.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-02</text><text x="775.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Resolve profile</text><text x="775.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Country, route, document, pack</text><rect x="1010" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1125.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-03</text><text x="1125.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Generate if needed</text><text x="1125.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Distinct target and loss check</text><rect x="1360" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1475.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-04</text><text x="1475.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Validate layers</text><text x="1475.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Schema, EN, BIS / country</text><rect x="1710" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1825.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-05</text><text x="1825.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Return issues</text><text x="1825.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Rule, location and owner</text><ellipse cx="2175.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2175.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2175.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Show preflight</text><text x="2175.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Pass, blocked or unknown</text><polygon points="1734,755 1916,755 1940,798.0 1916,841 1734,841 1710,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1825.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">UV-06</text><text x="1825.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Correct revision</text><text x="1825.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">No silent XML edit</text><polygon points="684,755 866,755 890,798.0 866,841 684,841 660,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="775.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">HOLD</text><text x="775.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Pack not approved</text><text x="775.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Unsupported / undetermined</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">A preflight PASS is local and time-bound. Correction creates a new source revision; original bytes and failed result remain.</text></svg>