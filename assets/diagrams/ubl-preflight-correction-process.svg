" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Receive the source invoice data</b><br /><span style="font-size:12px">Invoice facts or exact UBL and hash</span><br /><span style="font-size:11px;color:#555">UV-01</span></div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="2175" cy="252" rx="115" ry="50" /><foreignObject x="2066" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Show the preparation result</b><br /><span style="font-size:12px">Pass, blocked or unknown</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="1732.0,202 1918.0,202 1940.0,252.0 1918.0,302.0 1732.0,302.0 1710.0,252.0" /><foreignObject x="1716" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Create a corrected revision</b><br /><span style="font-size:12px">Do not silently edit the original XML</span><br /><span style="font-size:11px;color:#555">UV-06</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="660" y="380" width="230" height="100" rx="8" /><foreignObject x="666" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Select the invoice validation rules</b><br /><span style="font-size:12px">Country, route and document type</span><br /><span style="font-size:11px;color:#555">UV-02</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1710" y="380" width="230" height="100" rx="8" /><foreignObject x="1716" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Return issues and correction owners</b><br /><span style="font-size:12px">Rule, file location and responsible owner</span><br /><span style="font-size:11px;color:#555">UV-05</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="682.0,510.0 868.0,510.0 890.0,560.0 868.0,610.0 682.0,610.0 660.0,560.0" /><foreignObject x="666" y="516" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Hold unsupported validation</b><br /><span style="font-size:12px">Rules not approved or result undetermined</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1010" y="688" width="230" height="100" rx="8" /><foreignObject x="1016" y="694" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Create a derived file if needed</b><br /><span style="font-size:12px">Keep it separate; check for meaning loss</span><br /><span style="font-size:11px;color:#555">UV-03</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1360" y="688" width="230" height="100" rx="8" /><foreignObject x="1366" y="694" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Run the validation checks</b><br /><span style="font-size:12px">Schema, invoice standard and country rules</span><br /><span style="font-size:11px;color:#555">UV-04</span></div></div></foreignObject><foreignObject x="25" y="863" width="2750" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Validate a preserved source or a separately generated candidate under exact activated rules. A preflight PASS is local and time-bound. Correction creates a new source revision; original bytes and failed result remain.</div></div></foreignObject></svg>