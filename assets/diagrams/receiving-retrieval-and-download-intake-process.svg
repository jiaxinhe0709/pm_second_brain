<svg xmlns="http://www.w3.org/2000/svg" width="2670" height="1170" viewBox="0 0 2670 1170" role="img" aria-label="Receive and retrieve invoices; download the saved source independently"><title>Receive and retrieve invoices; download the saved source independently</title><desc>One proposed feature. Qualify the source mode, preserve the actual file, and keep notification, capture, source progress, product receipt and customer download distinct.</desc><rect width="2670" height="1170" fill="white" /><text x="28" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222">Receive and retrieve invoices; download the saved source independently</text><text x="28" y="65" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">One proposed feature. Qualify the source mode, preserve the actual file, and keep notification, capture, source progress, product receipt and customer download distinct.</text><text x="28" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Proposed design · Solid: shared handoff · Dashed: conditional work or recovery · Diamond: decision · Darker grey: recovery</text><text x="28" y="143" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Common: shared behaviour · Scenario-specific: selected path · Conditional: only when required</text><rect x="20" y="160" width="2630" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="160" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="235" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Customer / accountant</text><rect x="20" y="300" width="2630" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="300" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="375" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">ERP / product</text><rect x="20" y="440" width=