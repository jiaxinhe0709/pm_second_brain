nchor="start" fill="#222222">Public source</text><text x="590" y="493" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Private source</text><text x="1250" y="493" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">File supplied</text><text x="1220" y="865" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Fetch needed</text><text x="1400" y="865" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Failure / unknown</text><text x="2400" y="444" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Qualified</text><text x="2080" y="729" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Unsafe / missing</text><text x="28" y="1080" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Missing source authority stops protected calls. A notification or query result cannot prove file capture or complete source coverage.</text><text x="28" y="1104" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Covered progress needs durable item outcomes; mapping and product receipt may finish later. Unsafe files retain an approved controlled-access path.</text><text x="28" y="1128" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">The saved-file read starts with an authorised request and does not refetch externally. Buyer acceptance and payment reporting belong to SPEC-SEI-009.</text></svg>