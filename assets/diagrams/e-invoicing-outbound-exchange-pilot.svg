<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2620 1100" role="img" aria-labelledby="t d">
<title id="t">Outbound invoice exchange</title>
<desc id="d">One left-to-right service path with short business and policy branches and a contained split to recipient delivery and a separate required copy or reporting action.</desc>
