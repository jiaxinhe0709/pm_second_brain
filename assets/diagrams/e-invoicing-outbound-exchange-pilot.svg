<text x="995.0" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Verified recipient and</text>
<text x="995.0" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">process</text>
