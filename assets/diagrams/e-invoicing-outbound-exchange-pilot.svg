<text x="1275.0" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Freeze route; transform; validate;</text>
<text x="1275.0" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">sign by policy</text>
