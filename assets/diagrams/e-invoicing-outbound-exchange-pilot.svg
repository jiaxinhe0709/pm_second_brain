<text x="715.0" y="658" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Validation rule pack</text>
<text x="715.0" y="682" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Versioned syntax and policy</text>
<text x="715.0" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">artefacts</text>
