<text x="2175.0" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Raw result for each independent action</text>
<rect x="2330" y="388" width="250" height="94" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2.2"/>
<text x="2455.0" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">11  Derive lifecycle view</text>
<text x="2455.0" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Technical, delivery, report, buyer</text>
<text x="2455.0" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">separate</text>
<path d="M310 625 H560 V707 Q500 693 440 707 T310 707 Z" fill="#ffffff" stroke="#555555" stroke-width="2.2"/>
