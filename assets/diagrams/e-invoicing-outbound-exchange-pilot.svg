<text x="435.0" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">01  Submit invoice intent</text>
<text x="435.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Issuer, recipient and source</text>
<text x="435.0" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">revision</text>
<polygon points="614,166 840,166 816,256 590,256" fill="#ffffff" stroke="#222222" stroke-width="2.2"/>
<text x="715.0" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Correct and resubmit</text>
<text x="715.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">New revision enters validation</text>
