<text x="1555.0" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">08  Dispatch per plan</text>
<text x="1555.0" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Durable attempt and external</text>
<text x="1555.0" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">correlation</text>
