<text x="2175.0" y="682" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Reconcile original action before</text>
<text x="2175.0" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">any retry</text>
