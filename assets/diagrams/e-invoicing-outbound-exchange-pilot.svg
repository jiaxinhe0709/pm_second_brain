<text x="995.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Resolve missing policy or</text>
<text x="995.0" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">route</text>
<polygon points="2354,166 2580,166 2556,256 2330,256" fill="#ffffff" stroke="#222222" stroke-width="2.2"/>
<text x="2455.0" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">12  View result and action</text>
<text x="2455.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Evidence level, history and next</text>
<text x="2455.0" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">owner</text>
<rect x="310" y="388" width="250" height="94" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2.2"/>
<text x="435.0" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">02  Receive and authorise</text>
<text x="435.0" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Tenant, entity, actor and operation</text>
<text x="435.0" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">ID</text>
<rect x="590" y="388" width="250" height="94" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2.2"/>
<text x="715.0" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">04  Validate content</text>
<text x="715.0" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Identity, syntax, profile and</text>
<text x="715.0" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">safety</text>
<polygon points="995.0,388 1120,435.0 995.0,482 870,435.0" fill="#d1d1d1" stroke="#222222" stroke-width="2.2"/>
