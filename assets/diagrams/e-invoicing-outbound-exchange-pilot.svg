<text x="1865.0" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Public, private or Peppol route</text>
<polygon points="1752,948 1978,948 2000,1012 1730,1012" fill="#ffffff" stroke="#555555" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1865.0" y="981" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Required copy / report</text>
<text x="1865.0" y="1005" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#333">Separate country-policy duty</text>
<text x="35" y="1080" font-family="Arial,sans-serif" font-size="13" fill="#444">Shapes: ellipse = start, diamond = decision, document = plan/rule, cylinder = evidence. One external subprocess contains two independently tracked actions.</text>
