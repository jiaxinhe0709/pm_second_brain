 fill="#222222">state</text><text x="1550.0" y="950" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Publish only if required</text><text x="1550.0" y="970" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-06</text></a><a href="../../specs/SPEC-SEI-002-onboarding-solution-specification.md" aria-label="ONB-07 Confirm or activate Sage route"><title>Explicit authority if needed</title><rect x="1715" y="458" width="260" height="104" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1845.0" y="484" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Confirm or activate Sage</text><text x="1845.0" y="503" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">route</text><text x="1845.0" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Explicit authority if needed</text><text x="1845.0" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-07</text></a><a href="../../specs/SPEC-SEI-002-onboarding-solution-specification.md" aria-label="ONB-11 Show per-function ERP results"><title>Current provider retained</title><rect x="2010" y="318" width="260" height="104" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="2140.0" y="344" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Show per-function ERP results</text><text x="2140.0" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Current provider retained</text><text x="2140.0" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-11</text></a><a href="../../specs/SPEC-SEI-002-onboarding-solution-specification.md" aria-label="ONB-08 Resolve the affected setup"><title>No provider substitution</title><rect x="1715" y="738" width="260" height="104" rx="8" fill="#d7d7d7" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1845.0" y="764" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Resolve the affected setup</text><text x="1845.0" y="810" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">No provider substitution</text><text x="1845.0" y="830" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-08</text></a><text x="28" y="1030" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Logical responsibility groups; actual service ownership, API fields and provider interfaces require qualification.</text><text x="28" y="1054" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Connection checks and readiness do not activate a route. Phase gates and supported scope apply to every branch.</text><text x="28" y="1078" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Preserve valid unaffected services. Reconcile possible external effects before repeating a change or reporting activation.</text></svg>