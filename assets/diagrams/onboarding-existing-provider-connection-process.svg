<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="1120" viewBox="0 0 2340 1120" role="img" aria-label="Connect the current private provider to Sage"><title>Connect the current private provider to Sage</title><desc>ONB-S03 keeps the existing provider. Bind the authorised account and qualify each function; initial Sage route activation may still be needed. ONB-S01 adds only contract-required new enrolment.</desc><rect width="2340" height="1120" fill="white" /><text x="28" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222">Connect the current private provider to Sage</text><text x="28" y="65" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">ONB-S03 keeps the existing provider. Bind the authorised account and qualify each function; initial Sage route activation may still be needed. ONB-S01 adds only contract-required new</text><text x="28" y="85" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">enrolment.</text><text x="28" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Proposed design · Solid: shared handoff · Dashed: conditional work or recovery · Diamond: decision · Darker grey: recovery</text><rect x="20" y="160" width="2300" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="160" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="235" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Customer / accountant</text><rect x="20" y="300" width="2300" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="300" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="375" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">ERP / product</text><rect x="20" y="440" width="2300" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="440" width="200" height="140" fill="#e5e5e5" stroke="#a