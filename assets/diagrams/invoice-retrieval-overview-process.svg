amily="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222222">the item?</text><text x="700.0" y="418" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">RSD-03 / PRI-02</text></a><a href="../../specs/invoice-receiving/SPEC-SEI-026-invoice-retrieval-logical-feature-specification.md" aria-label="RSD-03 Find invoices by presentation date"><title>Public platform: automatic collection</title><rect x="120" y="540" width="480" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="360.0" y="566" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Find invoices by presentation date</text><text x="360.0" y="612" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Public platform: automatic collection</text><text x="360.0" y="632" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">RSD-03</text></a><a href="../../specs/invoice-receiving/SPEC-SEI-026-invoice-retrieval-logical-feature-specification.md" aria-label="PRI-02 Read private notification or supplied files"><title>A notification alone does not contain the invoice</title><rect x="800" y="540" width="480" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1040.0" y="566" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Read private notification or supplied files</text><text x="1040.0" y="612" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">A notification alone does not contain the invoice</text><text x="1040.0" y="632" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">PRI-02</text></a><a href="../../specs/invoice-receiving/SPEC-SEI-026-invoice-retrieval-logical-feature-specification.md" aria-label="RSD-03 / PRI-03 Obtain the required source files"><title>Download missing files; reuse complete supplied bytes</title><rect x="460" y="760" width="480" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="786" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Obtain the required source files</text><text x="700.0" y="832" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Download missing files; reuse complete supplied bytes</text><text x="700.0" y="852" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">RSD-03 / PRI-03</text></a><a href="../../specs/invoice-receiving/SPEC-SEI-026-invoice-retrieval-logical-feature-specification.md" aria-label="RSD-04/05 Verify and save files and item results"><title>Exact bytes, roles, hashes and receiving state</title><rect x="460" y="930" width="480" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="956" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Verify and save files and item results</text><text x="700.0" y="1002" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Exact bytes, roles, hashes and receiving state</text><text x="700.0" y="1022" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">RSD-04/05</text></a><a href="../../specs/invoice-receiving/SPEC-SEI-026-invoice-retrieval-logical-feature-specification.md" aria-label="RSD-06 / PRI-04 Save covered collection progress"><title>Only when every covered item is accounted for</title><rect x="40" y="1160" width="360" height="110" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="220.0" y="1186" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Save covered collection progress</text><text x="220.0" y="1232" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Only when every covered item is accounted for</text><text x="220.0" y="1252" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">RSD-06 / PRI-04</text></a><a href="../../specs/invoice-receiving/SPEC-SEI-026-invoice-retrieval-logical-feature-specification.md" aria-label="RCV-02–07 Check and map the invoice"><title>Recipient, safety, duplicates, profile and meaning</title><rect x="460" y="1160" width="480" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="1186" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Check and map the invoice</text><text x="700.0" y="1232" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Recipient, safety, duplicates, profile and meaning</text><text x="700.0" y="1252" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">RCV-02–07</text></a><a href="../../specs/invoice-receiving/SPEC-SEI-026-invoice-retrieval-logical-feature-specification.md" aria-label="RSD-07/09 View invoice or download a saved file"><title>Both views; SPFE download; private download TBD</title><rect x="1000" y="1160" width="360" height="104" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1180.0" y="1186" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">View invoice or download a saved file</text><text x="1180.0" y="1232" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Both views; SPFE download; private download TBD</text><text x="1180.0" y="1252" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">RSD-07/09</text></a><a href="../../specs/invoice-receiving/SPEC-SEI-026-invoice-retrieval-logical-feature-specification.md" aria-label="RCV-07 Deliver once and confirm product receipt"><title>Keep pending delivery and who must act visible</title><rect x="460" y="1340" width="480" height="110" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="700.0" y="1366" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Deliver once and confirm product receipt</text><text x="700.0" y="1412" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Keep pending delivery and who must act visible</text><text x="700.0" y="1432" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">RCV-07</text></a><text x="160" y="520" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Public platform</text><text x="840" y="520" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Private platform</text><text x="28" y="1570" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">A missing file or pending receiving handoff cannot complete collection progress. Partial capture keeps its recovery owner.</text><text x="28" y="1594" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Mapping or product failure preserves safe permitted view/download. Private user download remains a separate Product decision.</text><text x="28" y="1618" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Source acknowledgement uses its confirmed contract milestone. Buyer acceptance and payment reports belong to lifecycle.</text></svg>