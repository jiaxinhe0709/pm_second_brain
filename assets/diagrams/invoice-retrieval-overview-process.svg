<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1660" viewBox="0 0 1400 1660" role="img" aria-label="Retrieve invoices: collect, view and download"><title>Retrieve invoices: collect, view and download</title><desc>View: public and private required. User download: SPFE required; private TBD.</desc><rect width="1400" height="1660" fill="white" /><text x="28" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222">Retrieve invoices: collect, view and download</text><text x="28" y="65" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">View: public and private required. User download: SPFE required; private TBD.</text><text x="28" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Proposed design · Solid: main steps · Dashed: selected source or a requested view/download</text><text x="28" y="143" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Read top to bottom. Branches apply only to the selected source or required action.</text><path d="M 700,284 L 700,340" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 700,340 L 704.0,332.0 L 696.0,332.0 Z" fill="#555555" /><path d="M 700,444 L 700,480 L 360,480 L 360,540" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 4" /><path d="M 360,540 L 364.0,532.0 L 356.0,532.0 Z" fill="#555555" /><path d="M 700,444 L 700,480 L 1040,480 L 1040,540" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 4" /><path d="M 1040,540 L 1044.0,532.0 L 1036.0,532.0 Z" fill="#555555" /><path d="M 360,644 L 360,700 L 700,700 L 700,760" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 700,760 L 704.0,752.0 L 696.0,752.0 Z" fill="#555555" /><path d="M 1040,644 L 1040,700 L 700,700 L 700,760" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 700,760 L 704.0,752.0 L 696.0,752.0 Z" fill="#555555" /><path d="M 700,864 L 700,930" fill="none"