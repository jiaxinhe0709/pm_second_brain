ible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">OFF-08<br /><b>Observe original</b><br />Query provider operation ID</div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2350" y="568" width="230" height="100" rx="8" /><foreignObject x="2362" y="580" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">OFF-05<br /><b>Protect history</b><br />Original actor and channel</div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="425" cy="796" rx="115" ry="50" /><foreignObject x="322" y="758" width="206" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">OFF-08<br /><b>Detect incident</b><br />Timeout, outage or reversal</div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="1692.0,746.0 1888.0,746.0 1910.0,796.0 1888.0,846.0 1692.0,846.0 1670.0,796.0" /><foreignObject x="1682" y="758" width="216" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">HOLD<br /><b>Escalate unresolved</b><br />Manual owner and deadline</div></div></foreignObject><