<svg aria-label="Recover an exit problem and protect earlier work" xmlns="http://www.w3.org/2000/svg" width="2800" height="996" viewBox="0 0 2800 996" role="img"><title>Recover an exit problem and protect earlier work</title><desc>An uncertain mutation or provider outage stays visible until the original state and obligations are owned. A reversal is a new transition. No blind retry; every invoice keeps its actual origin and unfinished obligations retain a permitted path. Logical responsibility groups; exact service owners and implementation remain open in the owning spec. Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</desc><rect width="2800" height="996" fill="white" /><foreignObject x="25" y="15" width="2750" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:26px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Recover an exit problem and protect earlier work</b></div></div></foreignObject><foreignObject x="25" y="58" width="2750" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Logical responsibility groups; exact service owners and implementation remain open in the owning spec.</div></div></foreignObject><rect fill="#d7d7d7" stroke="none" stroke-width="2" x="285" y="98" width="585" height="28" rx="8" /><foreignObject x="287" y="100" width="581" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:12px;line-height:1.18;color:#22