<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Offboarding: reconcile, restore and protect history</title><desc id="desc">An uncertain mutation or provider outage stays visible until the original state and obligations are owned. A reversal is a new transition. No blind retry; every invoice keeps its actual origin and unfinished obligations retain a permitted path.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Offboarding: reconcile, restore and protect history</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">An uncertain mutation or provider outage stays visible until the original state and obligations are owned.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE COORDINATION</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">PROVIDER / EXTERNAL</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">OPERATIONS / RECORDS</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; SCOPE</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">ASSESS &amp; PREPARE</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">TRANSITION &amp; VERIFY</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">CONTINUITY &amp; CLOSE</text><polyline points="540,221 590,221 590,393 650,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="880,393 930,393 930,591 990,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1220,591 1270,591 1270,393 1330,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1560,393 1670,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1910,393 1950,393 1950,591 2010,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1919.0" y="449" width="82" height="22" fill="white" opacity=".96"/><text x="1960" y="465" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">proven</text><polyline points="2240,591 2290,591 2290,798 2350,798" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="2580,798 2710,798 2710,264" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1790,440 1790,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1810.0" y="649" width="100" height="22" fill="white" opacity=".96"/><text x="1860" y="665" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">unresolved</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFF-08</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Detect incident</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Timeout, outage or reversal</text><rect x="650" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="765.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFF-08</text><text x="765.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Freeze unsafe work</text><text x="765.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Preserve queue and last safe route</text><rect x="990" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1105.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFF-02</text><text x="1105.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Map exposure</text><text x="1105.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Invoices, deadlines, scope</text><rect x="1330" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1445.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFF-08</text><text x="1445.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Observe original</text><text x="1445.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Query provider operation ID</text><polygon points="1790.0,350 1910,395.0 1790.0,440 1670,395.0" fill="#d7d7d7" stroke="#333333" stroke-width="2"/><text x="1790.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">DECISION</text><text x="1790.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Outcome proven?</text><text x="1790.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Confirmed, absent or unresolved</text><rect x="2010" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2125.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFF-04</text><text x="2125.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Resume or restore</text><text x="2125.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">New evidenced transition</text><rect x="2350" y="755" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2465.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">OFF-05</text><text x="2465.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Protect history</text><text x="2465.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Original actor and channel</text><ellipse cx="2645.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2645.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2645.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Explain status</text><text x="2645.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Customer and support case</text><polygon points="1694,755 1886,755 1910,798.0 1886,841 1694,841 1670,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1790.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">HOLD</text><text x="1790.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Escalate unresolved</text><text x="1790.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Manual owner and deadline</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">A reversal is a new transition. No blind retry; every invoice keeps its actual origin and unfinished obligations retain a permitted path.</text></svg>