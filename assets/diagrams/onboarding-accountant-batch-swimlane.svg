rial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">2. Save list and return</text><text x="930.0" y="503" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">receipt</text><text x="930.0" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Resume unfinished items after restart</text><text x="930.0" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-13/01</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#62-onb-02-check-business-identity-and-authority" aria-label="ONB-02 Client work allowed?"><title>Client work allowed?</title><path d="M 1210.0,598 L 1340,650.0 L 1210.0,702 L 1080,650.0 Z" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1210.0" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222222">Client work</text><text x="1210.0" y="658" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222222">allowed?</text><text x="1210.0" y="676" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-02</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#64-onb-10-assess-current-setup" aria-label="ONB-10/03–07 3. Run each client setup"><title>Recheck before protected actions</title><rect x="1360" y="458" width="260" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1490.0" y="484" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">3. Run each client setup</text><text x="1490.0" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Recheck before protected actions</text><text x="1490.0" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-10/03–07</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#613-onb-13-manage-portfolio-batch" aria-label="ONB-13/11 4. Show permitted results"><title>Keep each client result separate</title><rect x="1640" y="318" width="260" height="104" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="1770.0" y="344" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">4. Show permitted results</text><text x="1770.0" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Keep each client result separate</text><text x="1770.0" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-13/11</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#613-onb-13-manage-portfolio-batch" aria-label="ONB-13/12 Correct the affected client"><title>Other safe client items continue</title><rect x="1360" y="178" width="260" height="104" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1490.0" y="204" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Correct the affected client</text><text x="1490.0" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Other safe client items continue</text><text x="1490.0" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-13/12</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#613-onb-13-manage-portfolio-batch" aria-label="ONB-13 Cancel selected pending work"><title>Resolve effects before completion</title><rect x="240" y="458" width="260" height="104" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="370.0" y="484" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Cancel selected pending work</text><text x="370.0" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Resolve effects before completion</text><text x="370.0" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-13</text></a><rect data-arrow-label="true" x="671" y="431" width="21.8" height="19" rx="3" fill="white" /><text x="675" y="445" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">No</text><rect data-arrow-label="true" x="786" y="431" width="28.700000000000003" height="19" rx="3" fill="white" /><text x="790" y="445" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Yes</text><rect data-arrow-label="true" x="1346" y="576" width="28.700000000000003" height="19" rx="3" fill="white" /><text x="1350" y="590" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Yes</text><rect data-arrow-label="true" x="1416" y="746" width="194.3" height="19" rx="3" fill="white" /><text x="1420" y="760" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">No: return action or denial</text><rect data-arrow-label="true" x="1541" y="286" width="159.8" height="19" rx="3" fill="white" /><text x="1545" y="300" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Client action required</text><rect data-arrow-label="true" x="1316" y="406" width="132.2" height="19" rx="3" fill="white" /><text x="1320" y="420" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Corrected: recheck</text><rect data-arrow-label="true" x="1046" y="851" width="201.20000000000002" height="19" rx="3" fill="white" /><text x="1050" y="865" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Cancelled or action required</text><text x="28" y="1200" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">A receipt proves saved intake, not readiness. Reuse unchanged requests without duplicate effects.</text><text x="28" y="1224" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Check permission for each client before work and result access. One client must not expose or fail another.</text><text x="28" y="1248" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Batch states, counts, visibility and full acceptance checks remain in SPEC038 §7.</text><text x="28" y="892" font-family="Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">Additional checks and next actions</text><rect x="20" y="908" width="1900" height="240" fill="#fafafa" stroke="#aaaaaa" /><text x="36" y="930" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">When</text><text x="418" y="930" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">Who acts</text><text x="748" y="930" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">Next action</text><path d="M 20,940 L 1920,940" stroke="#cccccc" fill="none" /><text x="36" y="970" font-family="Arial, sans-serif" font-size="14" fill="#333333">One client needs action</text><text x="418" y="970" font-family="Arial, sans-serif" font-size="14" fill="#333333">Customer / accountant</text><text x="748" y="970" font-family="Arial, sans-serif" font-size="14" fill="#333333">Correct only that client; other safe clients can continue. ONB-13/12.</text><path d="M 20,992 L 1920,992" stroke="#cccccc" fill="none" /><text x="36" y="1022" font-family="Arial, sans-serif" font-size="14" fill="#333333">The accountant cancels selected work</text><text x="418" y="1022" font-family="Arial, sans-serif" font-size="14" fill="#333333">E-Invoice owner</text><text x="748" y="1022" font-family="Arial, sans-serif" font-size="14" fill="#333333">Stop permitted pending steps; retain completed work. ONB-13.</text><path d="M 20,1044 L 1920,1044" stroke="#cccccc" fill="none" /><text x="36" y="1074" font-family="Arial, sans-serif" font-size="14" fill="#333333">An earlier effect is unknown</text><text x="418" y="1074" font-family="Arial, sans-serif" font-size="14" fill="#333333">E-Invoice owner</text><text x="748" y="1074" font-family="Arial, sans-serif" font-size="14" fill="#333333">Resolve it before completing cancellation. ONB-08.</text><path d="M 20,1096 L 1920,1096" stroke="#cccccc" fill="none" /><text x="36" y="1126" font-family="Arial, sans-serif" font-size="14" fill="#333333">Permission or client access ends</text><text x="418" y="1126" font-family="Arial, sans-serif" font-size="14" fill="#333333">Identity + product</text><text x="748" y="1126" font-family="Arial, sans-serif" font-size="14" fill="#333333">Stop affected work and access; show only permitted progress. ONB-02/13.</text></svg>