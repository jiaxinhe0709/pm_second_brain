<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="1290" viewBox="0 0 1940 1290" role="img" aria-label="Accountant batch: setup, correction and cancellation"><title>Accountant batch: setup, correction and cancellation</title><desc>Save the request list, then check and process each client independently.</desc><rect width="1940" height="1290" fill="white" /><text x="28" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222">Accountant batch: setup, correction and cancellation</text><text x="28" y="65" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">Save the request list, then check and process each client independently.</text><text x="28" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Proposed design · Solid: main path · Dashed: alternative or correction · Darker grey: recovery · Details: table below · Crossed lines do not join</text><text x="28" y="143" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Read the main path from left to right. Swimlanes show proposed roles; Engineering must confirm service ownership.</text><rect x="20" y="160" width="1900" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="160" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="235" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Customer / accountant</text><rect x="20" y="300" width="1900" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="300" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="375" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">ERP / product</text><rect x="20" y="440" width="1900" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="440" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="505" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Domain Service -</text><text x="120" y="525" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">E-Invoice Service</text><rect x="20" y="580" width="1900" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="580" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="645" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Domain Service - Other</text><text x="120" y="665" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Services</text><rect x="20" y="720" width="1900" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="720" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="795" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Operations / support</text><path d="M 500,230.0 L 505,230 Q 510,230.0 510,235 L 510,505 Q 510,510.0 515,510 L 520,510.0" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 500,230.0 L 505,230 Q 510,230.0 510,235 L 510,505 Q 510,510.0 515,510 L 520,510.0" fill="none" stroke="#444444" stroke-width="2.4" stroke-linejoin="round" data-connection="choose→valid" /><path d="M 520,510.0 L 512.0,506.0 L 512.0,514.0 Z" fill="#444444" /><path d="M 650.0,458 L 650.0,422" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 650.0,458 L 650.0,422" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4" stroke-linejoin="round" data-connection="valid→reject" /><path d="M 650.0,422 L 646.0,430.0 L 654.0,430.0 Z" fill="#777777" /><path d="M 780,510.0 L 800,510.0" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 780,510.0 L 800,510.0" fill="none" stroke="#444444" stroke-width="2.4" stroke-linejoin="round" data-connection="valid→save" /><path d="M 800,510.0 L 