how handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1500" fill="#626262">Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</text><rect id="reuse-legend-grey-swatch" x="30" y="91" width="13" height="13" fill="#626262" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-grey-label" x="53" y="103" fill="#626262">Existing E-Invoice API / flow</text><rect id="reuse-legend-blue-swatch" x="340" y="91" width="13" height="13" fill="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" id="reuse-legend-blue-label" x="363" y="103" fill="#1565C0">Spain adaptation / proposed work</text></svg>