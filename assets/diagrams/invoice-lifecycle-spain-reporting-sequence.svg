<svg xmlns="http://www.w3.org/2000/svg" aria-label="Spain event: save the fact and track each report" width="1415" height="1540" viewBox="0 0 1415 1540" role="img"><title>Spain event: save the fact and track each report</title><desc>Proposed flow; each destination has its own owner and result. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid: request. Dashed: result. Grey bars show handling, not elapsed time. Blue: Spain binding or proposed work to confirm; it does not mean a new API or proven implementation.</desc><rect width="1415" height="1540" fill="white" /><rect x="8" y="8" width="1399" height="1524" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#626262">Spain event: save the fact and track each report</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#626262">Proposed flow; each destination has its own owner and result</text><path d="M 8,124 L 1407,124" fill="none" stroke="#626262" stroke-width="1.6" /><path d="M 130,216 L 130,1437" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#626262">ERP / product</text><path d="M 515,216 L 515,1437" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#626262">E-Invoice Service</text><path d="M 900,216 L 900,1437" fill="none" stroke="#626262" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#626262" rx="6" /><text font-family="Arial, sans-serif" font-size="20" 