<svg aria-label="Spain event and independent destination reports" xmlns="http://www.w3.org/2000/svg" width="1800" height="1770" viewBox="0 0 1800 1770" role="img"><title>Spain event and independent destination reports</title><desc>Proposed responsibility sequence; public SOAP transport is evidenced, country payloads remain gated. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests or deliveries. Dashed arrows: paired results. Grey bars show handling, not elapsed time. Guide/PRE transport: supplied evidence. Proposed/To qualify: design or missing contract, not deployed coverage.</desc><rect width="1800" height="1770" fill="white" /><rect x="8" y="8" width="1784" height="1754" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Spain event and independent destination reports</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Proposed responsibility sequence; public SOAP transport is evidenced, country payloads remain gated</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1792,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1667" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,1667" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">Lifecycle / country rules</text><path d="M 900,216 L 900,1667" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Public connector</text><path d="M 1285,216 L 1285,1667" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">AEAT SPFE</text><path d="M 1670,216 L 1670,1667" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1562" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1670" y="190" fill="#222222">Private platform</text><rect x="24" y="602" width="1752" height="453" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1085" width="1752" height="222" fill="none" stroke="#777777" rx="0" /><rect x="507" y="326" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="811" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="707" width="16" height="312" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1662" y="1190" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1405" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="602" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="625" fill="#222222">opt | Public reporting applies and the selected contract is qualified</text><rect x="24" y="1085" width="1752" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1108" fill="#222222">opt | A separate issuer/counterparty report is required</text><rect x="38" y="466" width="1724" height="112" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="490" fill="#222222">Select event, actor, fields, legal applicability, historical channel and each reporting owner. The</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="513" fill="#222222">lifecycle/country lane is a logical responsibility, not a new deployment. Missing evidence holds the affected</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="536" fill="#222222">report.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="566" fill="#888888">LCS-R04-06/10/12/13; LIF-G04/07/08</text><rect x="38" y="1545" width="1724" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1569" fill="#222222">An earlier success remains complete if another destination fails. Public admission is not new</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1592" fill="#222222">payment/acceptance evidence. Incoming already-reported facts cannot create a reporting loop.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1623" fill="#888888">LCS-A08/16/17/24; SPFE-S02 Article 8</text><rect x="142" y="240" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="258" fill="#888888">[Proposed] LCS-02-08; existing POST only if qualified</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="282" fill="#222222">Submit an authorised Spain business</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="305" fill="#222222">event</text><path d="M 130,326 L 507,326" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,320 L 507,326 L 495,332 Z" fill="#444444" stroke="#444444" /><rect x="142" y="344" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="362" fill="#888888">[Proposed] LCS-02-08; existing POST only if qualified</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="386" fill="#222222">Saved fact and separately tracked</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="409" fill="#222222">reporting obligations</text><path d="M 507,430 L 130,430" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,424 L 130,430 L 142,436" fill="none" stroke="#444444" /><rect x="527" y="644" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="662" fill="#888888">[Proposed] LCS-09; LIF-G04/06</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="686" fill="#222222">Execute one saved public obligation</text><path d="M 515,707 L 892,707" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,701 L 892,707 L 880,713 Z" fill="#444444" stroke="#444444" /><rect x="912" y="725" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="743" fill="#888888">[PRE transport] SPFE-S11/S17; [To qualify] business schema</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="767" fill="#222222">CustomerInvoiceEvents OR</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="790" fill="#222222">SupplierInvoiceEvents</text><path d="M 908,811 L 1277,811" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,805 L 1277,811 L 1265,817 Z" fill="#444444" stroke="#444444" /><rect x="912" y="829" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="847" fill="#888888">[PRE transport] SPFE-S11/S17; [To qualify] business schema</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="871" fill="#222222">Raw transport and business/item result</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="894" fill="#222222">at its actual evidence level</text><path d="M 1277,915 L 908,915" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 920,909 L 908,915 L 920,921" fill="none" stroke="#444444" /><rect x="527" y="933" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="951" fill="#888888">[Proposed] LCS-09/10; no inferred business fact</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="975" fill="#222222">Record this public destination result or</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="998" fill="#222222">outcome unknown</text><path d="M 892,1019 L 515,1019" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1013 L 515,1019 L 527,1025" fill="none" stroke="#444444" /><rect x="527" y="1127" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1145" fill="#888888">[To qualify] LCS-Q-PROVIDER; no endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1169" fill="#222222">Execute through the selected private contract</text><path d="M 515,1190 L 1662,1190" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1650,1184 L 1662,1190 L 1650,1196 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1208" width="1131" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="1226" fill="#888888">[To qualify] LCS-Q-PROVIDER; no endpoint supplied</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="1250" fill="#222222">Independent result; correlate a provider-owned report</text><path d="M 1662,1271 L 515,1271" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1265 L 515,1271 L 527,1277" fill="none" stroke="#444444" /><rect x="142" y="1319" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1337" fill="#888888">[Proposed] LCS-06; existing GET coverage to qualify</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1361" fill="#222222">Read fact, current dimensions and each</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1384" fill="#222222">report result</text><path d="M 130,1405 L 507,1405" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1399 L 507,1405 L 495,1411 Z" fill="#444444" stroke="#444444" /><rect x="142" y="1423" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1441" fill="#888888">[Proposed] LCS-06; existing GET coverage to qualify</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1465" fill="#222222">Authorised view with evidence age, owner</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1488" fill="#222222">and safe next action</text><path d="M 507,1509 L 130,1509" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1503 L 130,1509 L 142,1515" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1707" fill="#888888">Solid arrows: requests or deliveries. Dashed arrows: paired results. Grey bars show handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1730" fill="#888888">Guide/PRE transport: supplied evidence. Proposed/To qualify: design or missing contract, not deployed coverage.</text></svg>