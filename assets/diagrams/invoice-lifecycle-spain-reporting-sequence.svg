text><rect x="38" y="1315" width="1339" height="90" fill="#fafafa" stroke="#626262" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1339" fill="#626262">Keep a known success when another destination fails. Incoming already-reported facts must not create another</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1362" fill="#626262">report. Public receipt cannot create a payment fact.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1393" fill="#626262">LCS-A08/16/17/24</text><rect x="142" y="240" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="258" fill="#1565C0">[Proposed] Existing POST only if confirmed</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="282" fill="#1565C0">Submit an authorised decision or payment</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="305" fill="#1565C0">fact</text><path d="M 130,326 L 507,326" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,320 L 507,326 L 495,332 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="344" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="362" fill="#1565C0">[Proposed] Existing POST only if confirmed</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="386" fill="#1565C0">Saved fact and required reporting work</text><path d="M 507,407 L 130,407" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,401 L 130,407 L 142,413" fill="none" stroke="#1565C0" /><rect x="527" y="599" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size=