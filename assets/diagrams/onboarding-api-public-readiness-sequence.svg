<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2661" viewBox="0 0 1800 2661" role="img" aria-label="Onboarding API view - Public readiness and missing API coverage"><title>Onboarding API view - Public readiness and missing API coverage</title><desc>ONB-S02 | Phase 1; FR discovery calls are candidates, not proven public support. This view deliberately exposes missing call contracts instead of giving proposed endpoints factual names. The full public business process remains in SPEC-SEI-019; country/source rules are unchanged. Phase 1 performs no route activation; failure recovery returns to the affected readiness check.</desc><rect width="1800" height="2661" fill="white" /><text x="28" y="42" font-family="Arial, sans-serif" font-size="28" fill="#222222" text-anchor="start">Onboarding API view - Public readiness and missing API coverage</text><text x="28" y="75" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">ONB-S02 | Phase 1; FR discovery calls are candidates, not proven public support.</text><text x="28" y="105" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Proposed logical sequence · Participants are responsibility groups; actual service placement and contracts remain open.</text><text x="28" y="132" font-family="Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start">Solid filled arrow: request · Dashed open arrow: response · Solid open arrow: notification · Time runs down.</text><rect x="24" y="379" width="1752" height="810" fill="none" stroke="#777777" rx="4" /><path d="M 140,246 L 140,2483" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="27" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="140" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">ERP / product</text><path d="M 750,246 L 750,2483" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="637" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="750" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Global API</text><text x="750" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">FR contract candidate</text><path d="M 1090,246 L 1090,2483" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="977" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1090" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Domain Service -</text><text x="1090" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">E-Invoice Service</text><text x="1090" y="224" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Proposed coordination</text><path d="M 1390,246 L 1390,2483" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="1277" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1390" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Domain Service -</text><text x="1390" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Other Services</text><text x="1390" y="224" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Identity / trust / routing</text><path d="M 1660,246 L 1660,2483" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><rect x="1547" y="158" width="226" height="88" fill="#e8e8e8" stroke="#555555" rx="4" /><text x="1660" y="184" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Public / private platforms</text><text x="1660" y="204" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle">Qualified integration</text><rect x="24" y="379" width="1752" height="31" fill="#f1f1f1" stroke="#777777" rx="4" /><text x="36" y="401" font-family="Arial, sans-serif" font-size="15" fill="#222222" text-anchor="start">opt - API-01/02 are qualified for the selected public service</text><rect x="28" y="302" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="327" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">1 - Discover public support only if the API owner qualifies it</text><rect x="28" y="1245" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="1270" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">2 - Qualify identity, authority, access and required trust</text><rect x="28" y="1742" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="1767" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">3 - Run only the selected qualified public checks</text><rect x="35" y="2007" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="2032" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">No supplied FR create/update operation establishes a Spain public-enrolment requirement. Do not use API-03 as external registration or send a test invoice. Missing</text><text x="49" y="2054" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">prerequisite is not an unknown mutation.</text><text x="49" y="2087" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">ONB-SPFE-R02 | SPFE-S03/S08 | GAP-02/06</text><rect x="28" y="2206" width="1744" height="36" fill="#444444" stroke="#444444" rx="4" /><text x="40" y="2231" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="start">4 - Record and return per-function readiness</text><rect x="35" y="2291" width="1460" height="92" fill="#f7f7f7" stroke="#888888" rx="4" /><text x="49" y="2316" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">ONB-04/11 needs a qualified per-function result contract. FR connection status cannot supply identity, authority, trust, public-readiness and activation findings by</text><text x="49" y="2338" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">itself. Keep the missing contract visible.</text><text x="49" y="2371" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">ONB-04/11 | GAP-05/06</text><rect x="148" y="444" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="462" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">01  API-01 GET /accesspoints</text><text x="445.0" y="485" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-01 | GAP-07/08</text><path d="M 140,497 L 750,497" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,492.0 L 750,497 L 740.0,502.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="534" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="552" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">02  Dispatch scoped operation</text><text x="920.0" y="575" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,587 L 1090,587" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,582.0 L 1090,587 L 1080.0,592.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="602" width="324" height="65" fill="white" stroke="none" rx="4" /><text x="920.0" y="620" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">03  200 - supported access-point</text><text x="920.0" y="642" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">options</text><text x="920.0" y="665" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,677 L 750,677" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,682.0 L 750,677 L 760.0,672.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="714" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="732" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">04  200 - supported access-point options</text><text x="445.0" y="755" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-01</text><path d="M 750,767 L 140,767" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,772.0 L 140,767 L 150.0,762.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="804" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="822" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">05  API-02 GET /datasets/{datasetId}/accesspoints</text><text x="445.0" y="845" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">FR-02 | GAP-01/08</text><path d="M 140,857 L 750,857" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 740.0,852.0 L 750,857 L 740.0,862.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="894" width="324" height="43" fill="white" stroke="none" rx="4" /><text x="920.0" y="912" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">06  Dispatch scoped operation</text><text x="920.0" y="935" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Proposed internal handoff</text><path d="M 750,947 L 1090,947" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1080.0,942.0 L 1090,947 L 1080.0,952.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="758" y="962" width="324" height="65" fill="white" stroke="none" rx="4" /><text x="920.0" y="980" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">07  200 - existing dataset</text><text x="920.0" y="1002" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">connections</text><text x="920.0" y="1025" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Documented FR response; Spain mapping open</text><path d="M 1090,1037 L 750,1037" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 760.0,1042.0 L 750,1037 L 760.0,1032.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="148" y="1074" width="594" height="43" fill="white" stroke="none" rx="4" /><text x="445.0" y="1092" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">08  200 - existing dataset connections</text><text x="445.0" y="1115" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">API-02</text><path d="M 750,1127 L 140,1127" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 150.0,1132.0 L 140,1127 L 150.0,1122.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="1098" y="1295" width="284" height="65" fill="white" stroke="none" rx="4" /><text x="1240.0" y="1313" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">09  Verify represented business</text><text x="1240.0" y="1335" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">and action</text><text x="1240.0" y="1358" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">GAP-03/06 - API contract not supplied</text><path d="M 1090,1370 L 1390,1370" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1380.0,1365.0 L 1390,1370 L 1380.0,1375.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="1098" y="1407" width="284" height="43" fill="white" stroke="none" rx="4" /><text x="1240.0" y="1425" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">10  Independent check findings</text><text x="1240.0" y="1448" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">ONB-02/03 - current evidence</text><path d="M 1390,1460 L 1090,1460" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 1100.0,1465.0 L 1090,1460 L 1100.0,1455.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="1098" y="1475" width="284" height="65" fill="white" stroke="none" rx="4" /><text x="1240.0" y="1493" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">11  Check purpose-specific</text><text x="1240.0" y="1515" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">protected access</text><text x="1240.0" y="1538" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">GAP-06 - reuse SPEC-SEI-001 contract</text><path d="M 1090,1550 L 1390,1550" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1380.0,1545.0 L 1390,1550 L 1380.0,1555.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="1098" y="1565" width="284" height="65" fill="white" stroke="none" rx="4" /><text x="1240.0" y="1583" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">12  Readiness reference or</text><text x="1240.0" y="1605" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">limitation</text><text x="1240.0" y="1628" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">No credential material</text><path d="M 1390,1640 L 1090,1640" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 1100.0,1645.0 L 1090,1640 L 1100.0,1635.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="1098" y="1814" width="554" height="43" fill="white" stroke="none" rx="4" /><text x="1375.0" y="1832" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">13  Qualified non-mutating public check</text><text x="1375.0" y="1855" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">GAP-06 - connector contract to bind</text><path d="M 1090,1867 L 1660,1867" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1650.0,1862.0 L 1660,1867 L 1650.0,1872.0 Z" fill="#555555" stroke="#555555" stroke-width="1.8" /><rect x="1098" y="1904" width="554" height="43" fill="white" stroke="none" rx="4" /><text x="1375.0" y="1922" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="middle">14  Observation or failed check</text><text x="1375.0" y="1945" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">ONB-03/08 - exact operation owner</text><path d="M 1660,1957 L 1090,1957" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6 5" /><path d="M 1100.0,1962.0 L 1090,1957 L 1100.0,1952.0" fill="none" stroke="#555555" stroke-width="1.8" /><rect x="24" y="2501" width="1752" height="144" fill="#f4f4f4" stroke="#aaaaaa" rx="4" /><text x="40" y="2526" font-family="Arial, sans-serif" font-size="17" fill="#222222" text-anchor="start">Scope and interpretation</text><text x="40" y="2553" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">This view deliberately exposes missing call contracts instead of giving proposed endpoints factual names.</text><text x="40" y="2577" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">The full public business process remains in SPEC-SEI-019; country/source rules are unchanged.</text><text x="40" y="2601" font-family="Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start">Phase 1 performs no route activation; failure recovery returns to the affected readiness check.</text></svg>