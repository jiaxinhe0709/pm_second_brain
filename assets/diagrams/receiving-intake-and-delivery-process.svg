<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" role="img" aria-labelledby="title desc"><title id="title">Receiving: trusted intake to one product invoice</title><desc id="desc">Public retrieval and private arrival converge on recipient, trust, duplicate and original-file controls. A duplicate links source evidence to one business invoice. Quarantine is owned and cannot be called trusted delivery.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="2800" height="1000" fill="white"/><text x="25" y="45" font-family="Arial" font-size="27" font-weight="700" fill="#111">Receiving: trusted intake to one product invoice</text><text x="25" y="75" font-family="Arial" font-size="15" fill="#444">Public retrieval and private arrival converge on recipient, trust, duplicate and original-file controls.</text><rect x="25" y="145" width="2750" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="2750" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE COORDINATION</text><rect x="25" y="505" width="2750" height="180" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="505" width="240" height="180" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="550" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">VALIDATION / ADAPTER</text><rect x="25" y="695" width="2750" height="265" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="695" width="240" height="265" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="740" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">OPERATIONS / RECORDS</text><rect x="285" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="577.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">REQUEST &amp; CONTEXT</text><rect x="880" y="98" width="585" height="28" rx="6" fill="#d7d7d7"/><text x="1172.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">ASSESS &amp; VALIDATE</text><rect x="1475" y="98" width="605" height="28" rx="6" fill="#d7d7d7"/><text x="1777.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">DECIDE &amp; EXECUTE</text><rect x="2090" y="98" width="680" height="28" rx="6" fill="#d7d7d7"/><text x="2430.0" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#333">EVIDENCE &amp; RECOVER</text><polyline points="540,221 590,221 590,393 650,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="880,393 930,393 930,591 990,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1220,591 1270,591 1270,393 1330,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1560,393 1610,393 1610,591 1670,591" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="1900,591 1950,591 1950,393 2010,393" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="2240,393 2460,393 2460,221 2530,221" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/><polyline points="2240,393 2290,393 2290,798 2350,798" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="2246.0" y="634" width="108" height="22" fill="white" opacity=".96"/><text x="2300" y="650" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">if required</text><polyline points="2580,798 2710,798 2710,264" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="2588.0" y="714" width="84" height="22" fill="white" opacity=".96"/><text x="2630" y="730" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">observed</text><polyline points="1445,436 1445,755" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1450.0" y="634" width="180" height="22" fill="white" opacity=".96"/><text x="1540" y="650" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">duplicate / conflict</text><ellipse cx="425.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="425.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">RCV-01</text><text x="425.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Register item</text><text x="425.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Public or private source, hash</text><rect x="650" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="765.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">RCV-02</text><text x="765.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Match recipient</text><text x="765.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Operator, entity and route time</text><rect x="990" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1105.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">RCV-03</text><text x="1105.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Assess trust</text><text x="1105.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Safety, integrity and replay</text><rect x="1330" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1445.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">RCV-04</text><text x="1445.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Resolve duplicate</text><text x="1445.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Business and network identity</text><rect x="1670" y="548" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="1785.0" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">RCV-05 / 06</text><text x="1785.0" y="595" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Validate and map</text><text x="1785.0" y="617" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Original kept; canonical distinct</text><rect x="2010" y="350" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2125.0" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">RCV-07</text><text x="2125.0" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Publish once</text><text x="2125.0" y="419" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Durable record and product event</text><rect x="2350" y="755" width="230" height="86" rx="9" fill="#e8e8e8" stroke="#333333" stroke-width="2"/><text x="2465.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">RCV-08</text><text x="2465.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Acknowledge source</text><text x="2465.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Separate technical outcome</text><ellipse cx="2645.0" cy="221.0" rx="115.0" ry="43.0" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="2645.0" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">END</text><text x="2645.0" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Invoice available</text><text x="2645.0" y="247" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Buyer workflow is separate</text><polygon points="1354,755 1536,755 1560,798.0 1536,841 1354,841 1330,798.0" fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5"/><text x="1445.0" y="777" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">RCV-09</text><text x="1445.0" y="802" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111">Quarantine / link</text><text x="1445.0" y="824" text-anchor="middle" font-family="Arial" font-size="11" fill="#444">Wrong, unsafe or conflicting</text><text x="25" y="986" font-family="Arial" font-size="12" fill="#555">A duplicate links source evidence to one business invoice. Quarantine is owned and cannot be called trusted delivery.</text></svg>