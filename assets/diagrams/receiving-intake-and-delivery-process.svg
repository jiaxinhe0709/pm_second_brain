 /><path d="M 1220,738 L 1230,738 L 1230,430 L 1330,430" fill="none" stroke="#555" stroke-width="2" /><polygon points="1330.0,430.0 1321.0,426.0 1321.0,434.0" fill="#555" /><path d="M 1560,430 L 1570,430 L 1570,738 L 1670,738" fill="none" stroke="#555" stroke-width="2" /><polygon points="1670.0,738.0 1661.0,734.0 1661.0,742.0" fill="#555" /><path d="M 1900,738 L 1910,738 L 1910,430 L 2010,430" fill="none" stroke="#555" stroke-width="2" /><polygon points="2010.0,430.0 2001.0,426.0 2001.0,434.0" fill="#555" /><path d="M 2240,430 L 2250,430 L 2250,252 L 2530,252" fill="none" stroke="#555" stroke-width="2" /><polygon points="2530.0,252.0 2521.0,248.0 2521.0,256.0" fill="#555" /><path d="M 2240,430 L 2250,430 L 2250,738 L 2350,738" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 5" /><polygon points="2350.0,738.0 2341.0,734.0 2341.0,742.0" fill="#555" /><rect x="2257" y="573" width="68.5" height="22" fill="white" /><foreignObject x="2257" y="573" width="68.5" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:11px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">if required</div></div></foreignObject><path d="M 2580,738 L 2590,738 L 2590,312 L 2520,312 L 2520,252 L 2530,252" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 5" /><polygon points="2530.0,252.0 2521.0,248.0 2521.0,256.0" fill="#555" /><rect x="2597" y="514" width="52" height="22" fill="white" /><foreignObject x="2597" y="514" width="52" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:11px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">observed</div></div></foreignObject><path d="M 1445,480 L 1445,510" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 5" /><polygon points="1445.0,510.0 1449.0,501.0 1441.0,501.0" fill="#555" /><rect x="1452" y="484" width="118" height="22" fill="white" /><foreignObject x="1452" y="484" width="118" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:11px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">duplicate / conflict</div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="2645" cy="252" rx="115" ry="50" /><foreignObject x="2536" y="208" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Make the invoice available</b><br /><span style="font-size:12px">The buyer&#x27;s business decision is separate</span></div></div></foreignObject><ellipse fill="#ffffff" stroke="#333333" stroke-width="2" cx="425" cy="430" rx="115" ry="50" /><foreignObject x="316" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Record the received invoice item</b><br /><span style="font-size:12px">Public or private source and file hash</span><br /><span style="font-size:11px;color:#555">RCV-01</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="650" y="380" width="230" height="100" rx="8" /><foreignObject x="656" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Match the intended recipient</b><br /><span style="font-size:12px">Platform, business and route at that time</span><br /><span style="font-size:11px;color:#555">RCV-02</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1330" y="380" width="230" height="100" rx="8" /><foreignObject x="1336" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check for a duplicate invoice</b><br /><span style="font-size:12px">Business and network identity</span><br /><span style="font-size:11px;color:#555">RCV-04</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2010" y="380" width="230" height="100" rx="8" /><foreignObject x="2016" y="386" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Save and share the invoice once</b><br /><span style="font-size:12px">Saved record and authorised product event</span><br /><span style="font-size:11px;color:#555">RCV-07</span></div></div></foreignObject><polygon fill="#f6f6f6" stroke="#333333" stroke-width="2" stroke-dasharray="7 5" points="1352.0,510.0 1538.0,510.0 1560.0,560.0 1538.0,610.0 1352.0,610.0 1330.0,560.0" /><foreignObject x="1336" y="516" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Hold unsafe items or link repeats</b><br /><span style="font-size:12px">Wrong recipient, unsafe file or conflict</span><br /><span style="font-size:11px;color:#555">RCV-09</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="990" y="688" width="230" height="100" rx="8" /><foreignObject x="996" y="694" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Check file safety and trust</b><br /><span style="font-size:12px">Integrity and signs of repeated submission</span><br /><span style="font-size:11px;color:#555">RCV-03</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="1670" y="688" width="230" height="100" rx="8" /><foreignObject x="1676" y="694" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Validate and map the invoice</b><br /><span style="font-size:12px">Keep the original and mapped data separate</span><br /><span style="font-size:11px;color:#555">RCV-05 / 06</span></div></div></foreignObject><rect fill="#e8e8e8" stroke="#333333" stroke-width="2" x="2350" y="688" width="230" height="100" rx="8" /><foreignObject x="2356" y="694" width="218" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:14px;line-height:1.18;color:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;"><b>Acknowledge the source if required</b><br /><span style="font-size:12px">Separate technical result</span><br /><span style="font-size:11px;color:#555">RCV-08</span></div></div></foreignObject><foreignObject x="25" y="863" width="2750" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:13px;line-height:1.18;color:#222;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:visible;"><div class="diagram-text" style="max-width:100%;overflow-wrap:break-word;">Public retrieval and private arrival converge on recipient, trust, duplicate and original-file controls. A duplicate links source evidence to one business invoice. Quarantine is owned and cannot be called trusted delivery.</div></div></foreignObject></svg>