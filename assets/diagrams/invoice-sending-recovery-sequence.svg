<svg aria-label="Uncertain action: observe before repetition" xmlns="http://www.w3.org/2000/svg" width="1415" height="1265" viewBox="0 0 1415 1265" role="img"><title>Uncertain action: observe before repetition</title><desc>Preserve the original business, route, input and action identity. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time. Existing labels identify supplied evidence; To qualify labels do not define new endpoints or deployed service boundaries.</desc><rect width="1415" height="1265" fill="white" /><rect x="8" y="8" width="1399" height="1249" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Uncertain action: observe before repetition</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Preserve the original business, route, input and action identity</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1162" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,1162" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1162" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Original platform</text><path d="M 1285,216 L 1285,1162" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="190" fill="#222222">Operations</text><rect x="24" y="258" width="1367" height="268" fill="none" stroke="#777777" rx="0" /><rect x="507" y="386" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="738" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="1277" y="923" width="16" height="81" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="258" width="1367" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="281" fill="#222222">opt | The Sage e-invoice ID is known</text><rect x="38" y="556" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="580" fill="#222222">If the POST response was lost and the ID is unknown, this guide supplies no discovery-by-key operation.</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="603" fill="#222222">Preserve the request; do not create another invoice.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="634" fill="#888888">OUT-13; SND-G04</text><rect x="38" y="1040" width="1339" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1064" fill="#222222">Record confirmed success once. Retry proven absence only under the selected safe contract and current</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1087" fill="#222222">authority. Retain completed delivery while a public copy remains unknown.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1118" fill="#888888">OUT-A07/08/16; no new retry API is implied</text><rect x="142" y="300" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="318" fill="#888888">[Existing] INT-SND01 step 5</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="342" fill="#222222">GET /datasets/{datasetId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="365" fill="#222222">e-invoices/{e-invoiceId}</text><path d="M 130,386 L 507,386" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,380 L 507,386 L 495,392 Z" fill="#444444" stroke="#444444" /><rect x="142" y="404" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="422" fill="#888888">[Existing] INT-SND01 step 5</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="446" fill="#222222">200 detail or failed read; neither</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="469" fill="#222222">proves global absence</text><path d="M 507,490 L 130,490" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,484 L 130,490 L 142,496" fill="none" stroke="#444444" /><rect x="527" y="652" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="670" fill="#888888">[To qualify] OUT-13; SND-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="694" fill="#222222">Observe the original action using its</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="717" fill="#222222">qualified correlation</text><path d="M 515,738 L 892,738" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,732 L 892,738 L 880,744 Z" fill="#444444" stroke="#444444" /><rect x="527" y="756" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="774" fill="#888888">[To qualify] OUT-13; SND-G04/05</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="798" fill="#222222">Proven success, qualified absence or</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="821" fill="#222222">unresolved evidence</text><path d="M 892,842 L 515,842" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,836 L 515,842 L 527,848" fill="none" stroke="#444444" /><rect x="527" y="860" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="878" fill="#888888">[To qualify] OUT-13/15; SND-G04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="902" fill="#222222">Assign unresolved evidence and safe next action</text><path d="M 515,923 L 1277,923" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,917 L 1277,923 L 1265,929 Z" fill="#444444" stroke="#444444" /><rect x="527" y="941" width="746" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="900.0" y="959" fill="#888888">[To qualify] OUT-13/15; SND-G04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="900.0" y="983" fill="#222222">Owned hold; assignment is not external completion</text><path d="M 1277,1004 L 515,1004" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,998 L 515,1004 L 527,1010" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1202" fill="#888888">Solid arrows: requests. Dashed arrows: paired responses. Grey bars: handling, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1225" fill="#888888">Existing labels identify supplied evidence; To qualify labels do not define new endpoints or deployed service boundaries.</text></svg>