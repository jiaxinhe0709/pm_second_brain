<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1090" viewBox="0 0 1400 1090" role="img" aria-label="Spain: cancel or correct an issued invoice"><title>Spain: cancel or correct an issued invoice</title><desc>Two independent flows. Full customer rejection does not automatically cancel the invoice.</desc><rect width="1400" height="1090" fill="white" /><text x="28" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222">Spain: cancel or correct an issued invoice</text><text x="28" y="65" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">Two independent flows. Full customer rejection does not automatically cancel the invoice.</text><text x="28" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Proposed design · Solid arrows: steps within one flow. Cards link to the owning specifications.</text><text x="28" y="143" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Read each flow from top to bottom. Check eligibility before starting the selected action.</text><path d="M 350,314 L 350,385" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 350,385 L 354.0,377.0 L 346.0,377.0 Z" fill="#555555" /><path d="M 350,489 L 350,560" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 350,560 L 354.0,552.0 L 346.0,552.0 Z" fill="#555555" /><path d="M 350,664 L 350,735" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 350,735 L 354.0,727.0 L 346.0,727.0 Z" fill="#555555" /><path d="M 1050,314 L 1050,385" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1050,385 L 1054.0,377.0 L 1046.0,377.0 Z" fill="#555555" /><path d="M 1050,489 L 1050,560" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1050,560 L 1054.0,552.0 L 1046.0,552.0 Z" fill="#555555" /><path d="M 1050,664 L 1050,735" fill="none" stroke="#555555" stroke-width="1.8" /><path d="M 1050,735 L 1054.0,727.0 L 1046.0,727.0 Z" fi