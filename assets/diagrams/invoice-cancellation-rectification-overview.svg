pecification.md#proposed-spain-invoice-states" aria-label="SPEC-SEI-029 Track the new invoice independently"><title>Its own acceptance, rejection and payment</title><rect x="750" y="735" width="600" height="104" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="1050.0" y="761" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Track the new invoice independently</text><text x="1050.0" y="807" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Its own acceptance, rejection and payment</text><text x="1050.0" y="827" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">SPEC-SEI-029</text></a><text x="50" y="188" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">CANCEL E-INVOICE</text><text x="750" y="188" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">CORRECT INVOICE (RECTIFY)</text><text x="28" y="1000" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Cancellation denied: show the reason and permitted next action. Unknown result: reconcile the original cancellation attempt.</text><text x="28" y="1024" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Rectification: correct the new candidate before issuance; reconcile uncertain sending without repeating successful actions.</text><text x="28" y="1048" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">SD-CANCEL01 design input. Sage cancellation contract and Spain implementation support remain open; see SPEC-SEI-047.</text></svg>