<svg xmlns="http://www.w3.org/2000/svg" aria-label="Shared API: source capture, product retrieval and replay" width="1415" height="2156" viewBox="0 0 1415 2156" role="img"><title>Shared API: source capture, product retrieval and replay</title><desc>Provider Connectors submit source data through the same API products use to retrieve it. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Solid: requests. Dashed: paired responses. Grey bars: handling intervals, not elapsed time. Blue: proposed operation mapping. Provider-owned and SPFE interfaces remain external contracts; permissions differ by consumer role.</desc><rect width="1415" height="2156" fill="white" /><rect x="8" y="8" width="1399" height="2140" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">Shared API: source capture, product retrieval and replay</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Provider Connectors submit source data through the same API products use to retrieve it</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#666666">Grey: Existing documented calls</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="350" y="104" fill="#1565C0">Blue: Proposed Spain handoffs</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="680" y="104" fill="#B42318">Red: Open / Assumption / Gap / Source conflict</text><path d="M 8,124 L 1407,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,2053" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">ERP / product</text><path d="M 515,216 L 515,2053" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="178" fill="#222222">Domain Service -</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="201" fill="#222222">E-Invoice Service</text><path d="M 900,216 L 900,2053" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="900" y="178" fill="#222222">Domain Service - Other Services</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="201" fill="#222222">Provider Connector</text><path d="M 1285,216 L 1285,2053" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="1177" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="178" fill="#222222">Public / private</text><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="1285" y="201" fill="#222222">platforms</text><rect x="24" y="372" width="1367" height="245" fill="none" stroke="#666666" rx="0" /><rect x="24" y="647" width="1367" height="291" fill="none" stroke="#666666" rx="0" /><rect x="24" y="968" width="1367" height="613" fill="none" stroke="#666666" rx="0" /><rect x="24" y="1611" width="1367" height="268" fill="none" stroke="#666666" rx="0" /><rect x="1277" y="477" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="775" width="16" height="127" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1096" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1441" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1739" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="24" y="372" width="1367" height="34" fill="#fafafa" stroke="#666666" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="395" fill="#666666">opt | A1 · Connector polls / downloads through the selected external contract</text><rect x="24" y="647" width="1367" height="34" fill="#fafafa" stroke="#666666" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="670" fill="#666666">opt | A2 · Alternative: qualified platform push; no supplied SPFE push interface</text><rect x="24" y="968" width="1367" height="34" fill="#fafafa" stroke="#666666" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="991" fill="#666666">ref | B · Shared-API intake and product access</text><rect x="24" y="1611" width="1367" height="34" fill="#fafafa" stroke="#666666" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1634" fill="#666666">opt | C · Intake response lost, interrupted capture or duplicate source delivery</text><rect x="38" y="258" width="1339" height="90" fill="#fafafa" stroke="#666666" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="282" fill="#666666">Entry paths A1/A2 are alternatives. Acquire only within authorised source scope. Source capture is separate</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="305" fill="#666666">from buyer acceptance.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="336" fill="#666666">CA-01/04; CS08 / 09</text><rect x="38" y="1236" width="1339" height="90" fill="#fafafa" stroke="#666666" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1260" fill="#666666">Advance covered acquisition progress only after durable capture. If the external contract requires capture</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1283" fill="#666666">before its acknowledgement, complete this intake before sending that acknowledgement.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1314" fill="#666666">CA-04; CS08 / 09 / 10</text><rect x="38" y="1909" width="1339" height="112" fill="#fafafa" stroke="#666666" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1933" fill="#666666">An authorised provider can submit directly to the same API where its integration mode assigns that role. A</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1956" fill="#666666">connector and provider must not independently execute the same delivery. Expired cursors/source gaps require</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1979" fill="#666666">qualified recovery before a completeness claim.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="2009" fill="#666666">CA-01–04; CS02 / 08 / 10</text><rect x="912" y="414" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="432" fill="#1565C0">[Proposed] CA-03/04; CS08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="456" fill="#1565C0">Query / download source invoice or event</text><path d="M 900,477 L 1277,477" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 1265,471 L 1277,477 L 1265,483 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="495" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="513" fill="#1565C0">[Proposed] CA-03/04; CS08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="537" fill="#1565C0">Source bytes / page / empty / fault</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="560" fill="#1565C0">Preserve continuation and evidence</text><path d="M 1277,581 L 900,581" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 912,575 L 900,581 L 912,587" fill="none" stroke="#1565C0" /><rect x="912" y="689" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="707" fill="#1565C0">[Proposed] CA-01/04; CS09</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="731" fill="#1565C0">Deliver source content / notification</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="754" fill="#1565C0">Authenticate source and account scope</text><path d="M 1285,775 L 908,775" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 920,769 L 908,775 L 920,781 Z" fill="#1565C0" stroke="#1565C0" /><rect x="912" y="793" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="1092.5" y="811" fill="#1565C0">[Proposed] CA-01/04; CS09</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="835" fill="#1565C0">Contract-defined technical response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="858" fill="#1565C0">Capture / acknowledgement order is</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="1092.5" y="881" fill="#1565C0">qualified</text><path d="M 908,902 L 1285,902" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 1273,896 L 1285,902 L 1273,908" fill="none" stroke="#1565C0" /><rect x="527" y="1010" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1028" fill="#1565C0">[Proposed] CA-04; CS08 / 10</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1052" fill="#1565C0">Submit source invoice / event evidence</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1075" fill="#1565C0">Stable source identity and timestamps</text><path d="M 900,1096 L 523,1096" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 535,1090 L 523,1096 L 535,1102 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1114" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1132" fill="#1565C0">[Proposed] CA-04; CS08 / 10</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1156" fill="#1565C0">Durable capture receipt</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1179" fill="#1565C0">Same identity deduplicates</text><path d="M 523,1200 L 900,1200" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 888,1194 L 900,1200 L 888,1206" fill="none" stroke="#1565C0" /><rect x="142" y="1332" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1350" fill="#1565C0">[Proposed] CA-01/04; CS02 / 08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1374" fill="#1565C0">Retrieve permitted saved invoice /</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1397" fill="#1565C0">status</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1420" fill="#1565C0">Use product caller permissions</text><path d="M 130,1441 L 507,1441" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1435 L 507,1441 L 495,1447 Z" fill="#1565C0" stroke="#1565C0" /><rect x="142" y="1459" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1477" fill="#1565C0">[Proposed] CA-01/04; CS02 / 08</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1501" fill="#1565C0">Saved content / source observation</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1524" fill="#1565C0">Same shared API contract</text><path d="M 507,1545 L 130,1545" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1539 L 130,1545 L 142,1551" fill="none" stroke="#1565C0" /><rect x="527" y="1653" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1671" fill="#1565C0">[Proposed] CA-02/04; CS03 / 10 / 15</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1695" fill="#1565C0">Repeat original intake submission</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1718" fill="#1565C0">Same source identity and input</text><path d="M 900,1739 L 523,1739" fill="none" stroke="#1565C0" stroke-width="1.6" /><path stroke-width="1.6" d="M 535,1733 L 523,1739 L 535,1745 Z" fill="#1565C0" stroke="#1565C0" /><rect x="527" y="1757" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1775" fill="#1565C0">[Proposed] CA-02/04; CS03 / 10 / 15</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1799" fill="#1565C0">Existing or newly committed capture</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1822" fill="#1565C0">No duplicate business processing</text><path d="M 523,1843 L 900,1843" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 888,1837 L 900,1843 L 888,1849" fill="none" stroke="#1565C0" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2093" fill="#888888">Solid: requests. Dashed: paired responses. Grey bars: handling intervals, not elapsed time.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="2116" fill="#888888">Blue: proposed operation mapping. Provider-owned and SPFE interfaces remain external contracts; permissions differ by consumer role.</text></svg>