<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1150" viewBox="0 0 2220 1150" role="img" aria-label="Approval: reuse, request or withdraw"><title>Approval: reuse, request or withdraw</title><desc>Reuse valid approval, request a missing decision, or stop affected use when approval ends.</desc><rect width="2220" height="1150" fill="white" /><text x="28" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222">Approval: reuse, request or withdraw</text><text x="28" y="65" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">Reuse valid approval, request a missing decision, or stop affected use when approval ends.</text><text x="28" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Proposed design · Solid: main path · Dashed: alternative or correction · Darker grey: recovery · Details: table below · Crossed lines do not join</text><text x="28" y="143" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">Read the main path from left to right. Swimlanes show proposed roles; Engineering must confirm service ownership.</text><rect x="20" y="160" width="2180" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="160" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="235" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Customer / accountant</text><rect x="20" y="300" width="2180" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="300" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="375" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">ERP / product</text><rect x="20" y="440" width="2180" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="440" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="505" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Domain Service -</text><text x="120" y="525" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">E-Invoice Service</text><rect x="20" y="580" width="2180" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="580" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="645" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Domain Service - Other</text><text x="120" y="665" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Services</text><path d="M 500,650.0 L 505,650 Q 510,650.0 510,645 L 510,515 Q 510,510.0 515,510 L 520,510.0" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 500,650.0 L 505,650 Q 510,650.0 510,645 L 510,515 Q 510,510.0 515,510 L 520,510.0" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4" stroke-linejoin="round" data-connection="valid→request" /><path d="M 520,510.0 L 512.0,506.0 L 512.0,514.0 Z" fill="#777777" /><path d="M 370,702 L 370,728 Q 370,735 377,735 L 1763,735 Q 1770,735 1770,728 L 1770,562" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 370,702 L 370,728 Q 370,735 377,735 L 1763,735 Q 1770,735 1770,728 L 1770,562" fill="none" stroke="#444444" stroke-width="2.4" stroke-linejoin="round" data-connection="valid→resume" /><path d="M 1770,562 L 1766.0,570.0 L 1774.0,570.0 Z" fill="#444444" /><path d="M 780,510.0 L 785,510 Q 790,510.0 790,505 L 790,375 Q 790,370.0 795,370 L 800,370.0" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" data-crossing-gap="true" /><path d="M 780,510.0 L 785,510 Q 790,510.0 790,505 L 790,375 Q 790,370.0 795,370 L 800,370.0" fill="none" stroke="#444444" stroke-width="2.4" stroke-linejoin="round" data-connection="request→show" /><path d="M 800,370.0 L 792.0,366.0 L 792.0,374.0 Z" fill="#444444" /><path d="M 1060,370.0 L