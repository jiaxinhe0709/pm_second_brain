, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Respond to the current request</text><text x="1210.0" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-12</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#62-onb-02-check-business-identity-and-authority" aria-label="ONB-02/12 Approved and allowed?"><title>Approved and allowed?</title><path d="M 1490.0,598 L 1620,650.0 L 1490.0,702 L 1360,650.0 Z" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1490.0" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222222">Approved and</text><text x="1490.0" y="658" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222222">allowed?</text><text x="1490.0" y="676" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-02/12</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#63-onb-12-coordinate-client-approval-and-evidence" aria-label="ONB-12 4. Resume the affected check"><title>Recheck permission and access</title><rect x="1640" y="458" width="260" height="104" rx="8" fill="#e8e8e8" stroke="#333333" stroke-width="1.5" /><text x="1770.0" y="484" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">4. Resume the affected check</text><text x="1770.0" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Recheck permission and access</text><text x="1770.0" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-12</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#612-onb-11-return-results-and-required-actions" aria-label="ONB-11 5. Show result and next action"><title>Approval alone is not readiness</title><rect x="1920" y="318" width="260" height="104" rx="42" fill="#ffffff" stroke="#333333" stroke-width="1.5" /><text x="2050.0" y="344" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">5. Show result and next</text><text x="2050.0" y="363" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">action</text><text x="2050.0" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Approval alone is not readiness</text><text x="2050.0" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-11</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#63-onb-12-coordinate-client-approval-and-evidence" aria-label="ONB-12/02 Approval or client access ends"><title>Withdrawal or loss of role</title><rect x="1080" y="458" width="260" height="104" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1210.0" y="484" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Approval or client access</text><text x="1210.0" y="503" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">ends</text><text x="1210.0" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444444">Withdrawal or loss of role</text><text x="1210.0" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">ONB-12/02</text></a><a href="../../specs/onboarding-and-connectivity/SPEC-SEI-038-customer-onboarding-and-connectivity-logical-feature-specification.md#63-onb-12-coordinate-client-approval-and-evidence" aria-label="ONB-12/08 Stop affected future use"><title>Check unknown earlier effects</title><rect x="1360" y="458" width="260" height="104" rx="8" fill="#d7d7d7" stroke="#333333" strok