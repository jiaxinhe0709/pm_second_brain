<svg aria-label="ONB-S08 - Unsupported or unknown setup" xmlns="http://www.w3.org/2000/svg" width="1030" height="1793" viewBox="0 0 1030 1793" role="img"><title>ONB-S08 - Unsupported or unknown setup</title><desc>Return the limitation, available evidence and next action owner. Solid arrows are requests; dashed arrows are paired responses. Grey bars show handling intervals, not duration. Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale. Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be qualified. HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects under ONB-08.</desc><rect width="1030" height="1793" fill="white" /><rect x="8" y="8" width="1014" height="1777" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="27" text-anchor="start" x="30" y="45" fill="#222222">ONB-S08 - Unsupported or unknown setup</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" x="30" y="76" fill="#222222">Return the limitation, available evidence and next action owner</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="104" fill="#888888">Existing = documented API / guide; To qualify = logical handoff, no confirmed Spain contract.</text><path d="M 8,124 L 1022,124" fill="none" stroke="#444444" stroke-width="1.6" /><path d="M 130,216 L 130,1621" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="22" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="130" y="190" fill="#222222">Product</text><path d="M 515,216 L 515,1621" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="407" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="515" y="190" fill="#222222">E-Invoice API</text><path d="M 900,216 L 900,1621" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><rect x="792" y="150" width="216" height="66" fill="white" stroke="#777777" rx="6" /><text font-family="Arial, sans-serif" font-size="20" text-anchor="middle" x="900" y="190" fill="#222222">Original provider</text><rect x="36" y="688" width="958" height="291" fill="none" stroke="#777777" rx="0" /><rect x="24" y="443" width="982" height="566" fill="none" stroke="#777777" rx="0" /><rect x="24" y="1153" width="982" height="245" fill="none" stroke="#777777" rx="0" /><rect x="507" y="303" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="548" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="839" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="892" y="1258" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="507" y="1473" width="16" height="104" fill="#dddddd" stroke="#777777" rx="0" /><rect x="36" y="688" width="958" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="48" y="711" fill="#222222">opt | A known connection needs detail</text><rect x="24" y="443" width="982" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="466" fill="#222222">opt | Known authorised dataset; inspect Sage setup only</text><rect x="24" y="1153" width="982" height="34" fill="#fafafa" stroke="#777777" rx="0" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" x="36" y="1176" fill="#222222">opt | Earlier external effect possible; original provider/operation and safe observation are qualified</text><rect x="38" y="1039" width="954" height="90" fill="#fafafa" stroke="#aaaaaa" rx="0" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1063" fill="#222222">Classify the unsupported function, missing evidence or dependency; assign the next action owner. A</text><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" x="52" y="1086" fill="#222222">failed/empty read does not prove absence.</text><text font-family="Arial, sans-serif" font-size="12" text-anchor="start" x="52" y="1117" fill="#888888">ONB-S08 | ONB-08/10 | No forced switch or blind replay</text><rect x="142" y="240" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="258" fill="#888888">[Existing] API-01 / FR-01</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="282" fill="#222222">GET /accesspoints</text><path d="M 130,303 L 507,303" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,297 L 507,303 L 495,309 Z" fill="#444444" stroke="#444444" /><rect x="142" y="321" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="339" fill="#888888">FR-01 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="363" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="386" fill="#222222">Access-point IDs and names</text><path d="M 507,407 L 130,407" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,401 L 130,407 L 142,413" fill="none" stroke="#444444" /><rect x="142" y="485" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="503" fill="#888888">[Existing] API-02 / FR-02</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="527" fill="#222222">GET /datasets/{datasetId}/accesspoints</text><path d="M 130,548 L 507,548" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,542 L 507,548 L 495,554 Z" fill="#444444" stroke="#444444" /><rect x="142" y="566" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="584" fill="#888888">FR-02 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="608" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="631" fill="#222222">Status + connectionId (or null)</text><path d="M 507,652 L 130,652" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,646 L 130,652 L 142,658" fill="none" stroke="#444444" /><rect x="142" y="730" width="361" height="100" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="748" fill="#888888">[Existing] API-04 / FR-04</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="772" fill="#222222">GET /connectors/{accessPointId}/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="795" fill="#222222">datasets/{datasetId}/connections/</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="818" fill="#222222">{connectionId}/</text><path d="M 130,839 L 507,839" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,833 L 507,839 L 495,845 Z" fill="#444444" stroke="#444444" /><rect x="142" y="857" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="875" fill="#888888">FR-04 response</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="899" fill="#222222">200 OK</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="922" fill="#222222">Per-address status and errors</text><path d="M 507,943 L 130,943" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,937 L 130,943 L 142,949" fill="none" stroke="#444444" /><rect x="527" y="1195" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1213" fill="#888888">[To qualify] Provider contract / timing</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1237" fill="#222222">Observe original operation</text><path d="M 515,1258 L 892,1258" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 880,1252 L 892,1258 L 880,1264 Z" fill="#444444" stroke="#444444" /><rect x="527" y="1276" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="707.5" y="1294" fill="#888888">[To qualify] Provider contract / timing</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1318" fill="#222222">Original-effect evidence</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="707.5" y="1341" fill="#222222">or unresolved / conflicting</text><path d="M 892,1362 L 515,1362" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 527,1356 L 515,1362 L 527,1368" fill="none" stroke="#444444" /><rect x="142" y="1410" width="361" height="54" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1428" fill="#888888">[To qualify] Logical request; ONB-11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1452" fill="#222222">Assess current findings</text><path d="M 130,1473 L 507,1473" fill="none" stroke="#444444" stroke-width="1.6" /><path stroke-width="1.6" d="M 495,1467 L 507,1473 L 495,1479 Z" fill="#444444" stroke="#444444" /><rect x="142" y="1491" width="361" height="77" fill="white" stroke="none" rx="0" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="322.5" y="1509" fill="#888888">[Logical outcome] ONB-11</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1533" fill="#222222">Limitation / uncertainty</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="322.5" y="1556" fill="#222222">+ next action owner</text><path d="M 507,1577 L 130,1577" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 6" /><path stroke-width="1.6" d="M 142,1571 L 130,1577 L 142,1583" fill="none" stroke="#444444" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1661" fill="#888888">Requests: solid / filled arrow. Responses: dashed / open arrow. Grey bars: handling intervals; timing is not to scale.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1684" fill="#888888">Precondition: authorised business/dataset access and correct environment. Spain builds and logical contracts remain to be</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1707" fill="#888888">qualified.</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1730" fill="#888888">HTTP success is not readiness or activation. Failed / uncertain evidence returns an owned hold; observe original effects</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" x="30" y="1753" fill="#888888">under ONB-08.</text></svg>