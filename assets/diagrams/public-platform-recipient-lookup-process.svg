<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1100" viewBox="0 0 3200 1100" role="img" aria-labelledby="title desc"><title id="title">Recipient lookup: evidence before destination selection</title><desc id="desc">Proposed logical design. No central AEAT directory is assumed. All outcomes retain source, scope, time and policy. Early lookup is advisory. Failed or partial negative lookup cannot select the public route. New evidence never rewrites a sent plan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs><rect width="3200" height="1100" fill="white"/><text x="25" y="45" text-anchor="start" font-family="Arial" font-size="27" font-weight="700" fill="#111">Recipient lookup: evidence before destination selection</text><text x="25" y="75" text-anchor="start" font-family="Arial" font-size="15" font-weight="400" fill="#444">Proposed logical design. No central AEAT directory is assumed. All outcomes retain source, scope, time and policy.</text><rect x="25" y="145" width="3150" height="155" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="145" width="240" height="155" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">CUSTOMER / PRODUCT</text><rect x="25" y="310" width="3150" height="190" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="310" width="240" height="190" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">SAGE LOOKUP / POLICY</text><rect x="25" y="510" width="3150" height="185" fill="#f6f6f6" stroke="#aaa"/><rect x="25" y="510" width="240" height="185" fill="#e5e5e5" stroke="#aaa"/><text x="145" y="552" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#222">IDENTITY</text><text x="145" y="574" text-anchor="middle" font-family="Arial" 