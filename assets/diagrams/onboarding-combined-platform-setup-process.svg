<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="1120" viewBox="0 0 2340 1120" role="img" aria-label="Connect public and private functions independently"><title>Connect public and private functions independently</title><desc>ONB-S04 records which platform handles each function. Shared identity does not share readiness; invoice delivery, public copies and reports have distinct execution owners and results.</desc><rect width="2340" height="1120" fill="white" /><text x="28" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222">Connect public and private functions independently</text><text x="28" y="65" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222">ONB-S04 records which platform handles each function. Shared identity does not share readiness; invoice delivery, public copies and reports have distinct execution owners and results.</text><text x="28" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">Proposed design · Solid: shared handoff · Dashed: conditional work or recovery · Diamond: decision · Darker grey: recovery</text><rect x="20" y="160" width="2300" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="160" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="235" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">Customer / accountant</text><rect x="20" y="300" width="2300" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="300" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="375" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222">ERP / product</text><rect x="20" y="440" width="2300" height="140" fill="#fafafa" stroke="#aaaaaa" /><rect x="20" y="440" width="200" height="140" fill="#e5e5e5" stroke="#aaaaaa" /><text x="120" y="505" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2222